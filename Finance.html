<script>
/* ============================= FINANCE MODULE ============================= */

/* ============================= SALES DASHBOARD =============================
 * Rebuilt per explicit user request ("update my sales dashboard page in best
 * prfesional way...currently it does not have any insights, use data from sales
 * report page. I need prductu wise sales summary, year filters, number of clients,
 * higest paying clint, most seling product....jo bhi best , and required hai for
 * any business").
 *
 * ROOT CAUSE of "no insights": every headline number on the old version came from
 * periodMetrics().sales / voucherSales_(), which read the BALANCE sheet's sales
 * VOUCHERS (dataForFY('balanceVouchers') filtered on voucherType ~ /sale/i). That
 * dataset is empty in this spreadsheet — which is why the page (and the Reports
 * page's Sales card) rendered ₹0 / "0 vouchers" while the Sales Report page itself
 * showed plenty of data. The Sales Report reads the SALES sheet instead
 * (dataForFY('sales') raw lines + buildSalesReport() invoice rollup), and the main
 * Dashboard's own Total Sales KPI already uses totalSalesFromSalesSheet() for the
 * same reason. Everything below is therefore computed ONLY from the SALES sheet, so
 * every figure reconciles exactly with what Sales Report shows.
 *
 * Product dimension: the SALES sheet carries BOTH a per-line "Description"
 * (mapped from DESCRIPTION/ITEM NAME/PRODUCT headers — see mapSalesRows_ in
 * Code.gs) and a "Category" column. Which one represents "product" differs per
 * sheet, so the Product Summary exposes a Product/Category toggle rather than
 * hard-coding one — the Most Selling Product KPI and the mix donut both follow
 * whichever is selected, so the whole page stays internally consistent.
 */
const SALES_DASH_PRODUCT_META={
  description:{label:'Product / Service',plural:'Products'},
  category:{label:'Category',plural:'Categories'}
};
const SALES_DASH_UNSPECIFIED_CLIENT='Unspecified Client';
function salesDashProductDim_(){
  const d=S.salesDashProductDim;
  return SALES_DASH_PRODUCT_META[d]?d:'description';
}

// The Sales Report intentionally excludes rows with no Invoice No because it groups
// every visible result by invoice. Keep the dashboard on that exact same population
// so its total, client, product and trend numbers reconcile with the report instead
// of silently including orphan lines the report cannot display. The excluded rows
// are counted separately in renderSalesDashboard() and surfaced as a data-quality
// warning rather than being silently lost.
function salesDashboardReportLines_(rows){
  const source=Array.isArray(rows)?rows:dataForFY('sales');
  return source.filter(r=>String(r.invoiceNo||'').trim());
}

// Small, dependency-free period summary used for the YoY management pulse. Invoice
// identity mirrors buildSalesReport(): Invoice No + client, preventing accidental
// collapse if two parties ever reuse the same invoice number.
function salesDashPeriodStats_(rows){
  const invoiceSet=new Set(),clientSet=new Set();
  let sales=0;
  (rows||[]).forEach(r=>{
    sales+=Number(r.amount)||0;
    const inv=String(r.invoiceNo||'').trim().toLowerCase();
    const client=String(r.invoiceTo||'').trim().toLowerCase();
    if(inv)invoiceSet.add(inv+'|'+client);
    if(client)clientSet.add(client);
  });
  return {sales,invoices:invoiceSet.size,clients:clientSet.size,avgInvoice:invoiceSet.size?sales/invoiceSet.size:0};
}

// Year-on-year comparison for the latest selected FY (or latest SALES FY when the
// page is showing All Financial Years). This keeps the dashboard total scoped to the
// user's full selection while giving management a clean apples-to-apples momentum
// signal against the immediately preceding FY.
function salesDashYoYComparison_(){
  const allRows=salesDashboardReportLines_(S.salesRows||[]);
  const salesFYs=Array.from(new Set(allRows.map(r=>financialYearKey(r.date)).filter(Boolean))).sort().reverse();
  const selected=selectedFinancialYears().slice().sort();
  const selectedWithSales=selected.filter(key=>salesFYs.indexOf(key)!==-1);
  const currentKey=selectedWithSales.length?selectedWithSales[selectedWithSales.length-1]:(selected.length?selected[selected.length-1]:(salesFYs[0]||null));
  if(!currentKey)return null;
  const start=parseInt(currentKey.split('-')[0],10);
  const previousKey=(start-1)+'-'+String(start).slice(-2);
  const today=new Date();
  const activeFYKey=financialYearKey(today);
  const isPartial=currentKey===activeFYKey;
  let currentRows=allRows.filter(r=>financialYearKey(r.date)===currentKey);
  let previousRows=allRows.filter(r=>financialYearKey(r.date)===previousKey);
  let currentThrough=null,previousThrough=null;
  if(isPartial){
    const currentCutoff=new Date(today.getFullYear(),today.getMonth(),today.getDate(),23,59,59,999);
    const currentStart=new Date(start,3,1);
    const previousStart=new Date(start-1,3,1);
    // Compare equal elapsed FY days, not just the same calendar date. The latter is
    // off by one around leap years (e.g. an active FY that has crossed 29 February).
    const elapsedDays=Math.floor((Date.UTC(currentCutoff.getFullYear(),currentCutoff.getMonth(),currentCutoff.getDate())-Date.UTC(currentStart.getFullYear(),currentStart.getMonth(),currentStart.getDate()))/86400000);
    const previousCutoff=new Date(previousStart);
    previousCutoff.setDate(previousStart.getDate()+elapsedDays);
    previousCutoff.setHours(23,59,59,999);
    currentRows=currentRows.filter(r=>{const t=parseDT(r.date);return t!==null&&t<=currentCutoff.getTime();});
    previousRows=previousRows.filter(r=>{const t=parseDT(r.date);return t!==null&&t<=previousCutoff.getTime();});
    currentThrough=toISO(currentCutoff);previousThrough=toISO(previousCutoff);
  }
  const current=salesDashPeriodStats_(currentRows);
  const previous=salesDashPeriodStats_(previousRows);
  const delta=(value,base)=>base?((value-base)/Math.abs(base))*100:null;
  return {
    currentKey,previousKey,current,previous,isPartial,currentThrough,previousThrough,hasPrevious:previous.invoices>0,
    salesGrowth:delta(current.sales,previous.sales),
    invoiceGrowth:delta(current.invoices,previous.invoices),
    clientGrowth:delta(current.clients,previous.clients),
    avgInvoiceGrowth:delta(current.avgInvoice,previous.avgInvoice)
  };
}

// Product (or Category) wise sales summary — one row per distinct product, with
// invoice/client counts, revenue, share of total and average ticket. Invoices and
// clients are counted as DISTINCT sets (not raw line counts) because one invoice can
// carry several lines of the same product, and the same client can buy it repeatedly.
function buildSalesProductSummary_(dim,sourceRows){
  const map={};
  salesDashboardReportLines_(sourceRows).forEach(r=>{
    const name=String((dim==='category'?r.category:r.description)||'').trim()||'Unspecified';
    if(!map[name])map[name]={product:name,amount:0,lines:0,invoiceSet:new Set(),clientSet:new Set()};
    const m=map[name];
    m.amount+=Number(r.amount)||0;
    m.lines++;
    const inv=String(r.invoiceNo||'').trim().toLowerCase();
    const cl=String(r.invoiceTo||'').trim().toLowerCase();
    if(inv)m.invoiceSet.add(inv+'|'+cl);
    if(cl)m.clientSet.add(cl);
  });
  const all=Object.keys(map).map(k=>map[k]);
  const total=all.reduce((s,m)=>s+m.amount,0);
  return all.map(m=>{
    const invCount=m.invoiceSet.size||m.lines;
    return {product:m.product,invoices:invCount,clients:m.clientSet.size,
      amount:Math.round(m.amount*100)/100,
      avgPerInvoice:invCount?Math.round(m.amount/invCount*100)/100:0,
      sharePct:total?Math.round(m.amount/total*1000)/10:0};
  }).sort((a,b)=>b.amount-a.amount);
}

// Client-wise revenue summary — drives both the "Highest Paying Client" KPI and the
// Top Clients table. lastSale is stored as a real ISO date STRING (not a display
// string) so the grid's shared calendar date-range filter/sort can read it directly,
// the same way followUpList's planDate had to be materialized (see Grids.html).
function buildSalesTopClients_(sourceRows){
  const map={};
  salesDashboardReportLines_(sourceRows).forEach(r=>{
    const rawName=String(r.invoiceTo||'').trim();
    const name=rawName||SALES_DASH_UNSPECIFIED_CLIENT;
    const key=name.toLowerCase();
    if(!map[key])map[key]={client:name,isUnspecified:!rawName,state:'',amount:0,lines:0,invoiceSet:new Set(),productSet:new Set(),lastTs:null};
    const m=map[key];
    m.amount+=Number(r.amount)||0;
    m.lines++;
    if(!m.state&&r.state)m.state=String(r.state).trim();
    const inv=String(r.invoiceNo||'').trim().toLowerCase();if(inv)m.invoiceSet.add(inv);
    const prod=String(r.description||r.category||'').trim().toLowerCase();if(prod)m.productSet.add(prod);
    const t=parseDT(r.date);if(t!==null&&(m.lastTs===null||t>m.lastTs))m.lastTs=t;
  });
  const all=Object.keys(map).map(k=>map[k]);
  const total=all.reduce((s,m)=>s+m.amount,0);
  return all.map(m=>{
    const invCount=m.invoiceSet.size||m.lines;
    return {client:m.client,isUnspecified:m.isUnspecified,state:m.state||'',invoices:invCount,products:m.productSet.size,
      amount:Math.round(m.amount*100)/100,
      avgInvoice:invCount?Math.round(m.amount/invCount*100)/100:0,
      sharePct:total?Math.round(m.amount/total*1000)/10:0,
      lastSale:m.lastTs===null?'':toISO(new Date(m.lastTs))};
  }).sort((a,b)=>b.amount-a.amount);
}

// New vs Repeat clients for the selected period. Uses each client's COMPLETE
// (unfiltered) S.salesRows history to find every financial year they ever bought in:
// a client billed in the selected FY(s) who ALSO bought outside them is "repeat";
// one whose whole history sits inside the selection is "new". With no FY filter
// applied, "repeat" instead means they bought across more than one financial year.
function salesDashNewRepeat_(periodRows){
  const selected=new Set(selectedFinancialYears());
  const history={};
  salesDashboardReportLines_(S.salesRows||[]).forEach(r=>{
    const name=String(r.invoiceTo||'').trim();if(!name)return;
    const fy=financialYearKey(r.date);if(!fy)return;
    const k=name.toLowerCase();
    if(!history[k])history[k]=new Set();
    history[k].add(fy);
  });
  const inPeriod=new Set();
  salesDashboardReportLines_(periodRows).forEach(r=>{const n=String(r.invoiceTo||'').trim();if(n)inPeriod.add(n.toLowerCase());});
  let fresh=0,repeat=0;
  inPeriod.forEach(k=>{
    const fys=history[k]||new Set();
    const isRepeat=selected.size?Array.from(fys).some(f=>!selected.has(f)):fys.size>1;
    if(isRepeat)repeat++;else fresh++;
  });
  return {fresh,repeat,total:inPeriod.size};
}

// Both dashboard tables run on the SAME generic grid engine every other table in the
// app uses (renderGrid), so per-column search/sort/hide-unhide/resize/pagination and
// the Reset Filters button all come for free — data is handed over via S._sales*
// exactly like the main Dashboard's own mini-report grids do.
const SALES_PRODUCT_SUMMARY_COLS=[
  {key:'product',label:'Product / Service',width:320},
  {key:'invoices',label:'Invoices',width:100,num:true,filterType:'number-range'},
  {key:'clients',label:'Clients',width:95,num:true,filterType:'number-range'},
  {key:'amount',label:'Sales Amount',width:150,num:true,currency:true,filterType:'number-range',heatmap:true},
  {key:'sharePct',label:'% of Sales',width:110,num:true,filterType:'number-range',render:r=>esc(r.sharePct.toFixed(1)+'%')},
  {key:'avgPerInvoice',label:'Avg / Invoice',width:140,num:true,currency:true,filterType:'number-range'}
];
const SALES_TOP_CLIENTS_COLS=[
  {key:'client',label:'Client',width:280},
  {key:'state',label:'State',width:120},
  {key:'invoices',label:'Invoices',width:100,num:true,filterType:'number-range'},
  {key:'products',label:'Products',width:100,num:true,filterType:'number-range'},
  {key:'amount',label:'Sales Amount',width:150,num:true,currency:true,filterType:'number-range',heatmap:true},
  {key:'sharePct',label:'% of Sales',width:110,num:true,filterType:'number-range',render:r=>esc(r.sharePct.toFixed(1)+'%')},
  {key:'avgInvoice',label:'Avg / Invoice',width:140,num:true,currency:true,filterType:'number-range'},
  {key:'lastSale',label:'Last Sale',width:120,date:true,render:r=>r.lastSale?esc(fmtDDMMMYYYY(fromISO(r.lastSale))):muted_('—')}
];
GRID_DEFS.salesProductSummary={cols:SALES_PRODUCT_SUMMARY_COLS,data:()=>S._salesProductRows||[],showSortArrows:true};
GRID_DEFS.salesTopClients={cols:SALES_TOP_CLIENTS_COLS,data:()=>S._salesTopClientRows||[],showSortArrows:true};

function renderSalesDashboard(){
  const allPeriodLines=dataForFY('sales');
  const rawLines=salesDashboardReportLines_(allPeriodLines);
  const excludedLines=allPeriodLines.length-rawLines.length;
  const invoices=buildSalesReport();
  const fyLabel=selectedFYLabel();
  const dim=salesDashProductDim_();
  const dimMeta=SALES_DASH_PRODUCT_META[dim];

  // Use the invoice roll-up total as the dashboard's authoritative topline. Since
  // rawLines above applies the same Invoice No rule as buildSalesReport(), product,
  // client, state and chart totals now reconcile with this number line-for-line.
  const totalSales=invoices.reduce((sum,row)=>sum+(Number(row.amount)||0),0);
  const clientRows=buildSalesTopClients_(rawLines);
  const knownClientRows=clientRows.filter(row=>!row.isUnspecified);
  const productRows=buildSalesProductSummary_(dim,rawLines);
  const topClient=knownClientRows[0]||null;
  const topProduct=productRows[0]||null;
  const byState=topN(rawLines,'state','amount',6).filter(s=>s.label&&s.label!=='Unknown');
  const maxState=Math.max(1,...byState.map(x=>x.value));
  const topState=byState[0]||null;

  // Month-wise series (also feeds the trend chart via CHART_DEFS below).
  const monthly=selectedFYMonths().map(m=>({label:m.label,value:sumBy(rowsInCustomRange(rawLines,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'amount')}));
  const undatedLines=rawLines.filter(r=>parseDT(r.date)===null);
  const undatedSales=sumBy(undatedLines,'amount');
  const activeMonths=monthly.filter(m=>m.value>0);
  const bestMonth=activeMonths.slice().sort((a,b)=>b.value-a.value)[0]||null;
  const avgPerMonth=activeMonths.length?totalSales/activeMonths.length:0;

  // Unpaid = sum of the RECEIVABLES pending amount linked to each invoice by Bill Ref
  // No (already computed per invoice by buildSalesReport()). Invoices with no matching
  // receivable row count as fully realised.
  const unpaid=invoices.reduce((s,inv)=>s+(Number(inv.recvPendingAmount)||0),0);
  const overdueInvoices=invoices.filter(inv=>Number(inv.recvOverdueDays)>0&&Number(inv.recvPendingAmount)>0);
  const overdueOutstanding=overdueInvoices.reduce((s,inv)=>s+(Number(inv.recvPendingAmount)||0),0);
  const realisedPct=totalSales?Math.max(0,Math.min(100,(totalSales-unpaid)/totalSales*100)):0;
  const gstAmt=sumBy(rawLines.filter(r=>String(r.gstNo||'').trim()),'amount');
  const gstPct=totalSales?(gstAmt/totalSales*100):0;
  const top5Amt=knownClientRows.slice(0,5).reduce((s,c)=>s+c.amount,0);
  const top5Pct=totalSales?(top5Amt/totalSales*100):0;
  const nr=salesDashNewRepeat_(rawLines);
  const repeatPct=nr.total?(nr.repeat/nr.total*100):0;
  const yoy=salesDashYoYComparison_();

  S._salesProductRows=productRows;
  S._salesTopClientRows=clientRows;
  SALES_PRODUCT_SUMMARY_COLS[0].label=dimMeta.label;
  const salesReportButton=`<button type="button" class="btn btn-primary sd-sales-report-btn" data-action="goto" data-page="salesReport">View Sales Report <span>→</span></button>`;

  if(!rawLines.length){
    return `${renderFilterBar(salesReportButton)}
      <div class="panel"><div class="panel-body"><div class="empty-state">
        <div class="big">No invoice-numbered sales data for ${esc(fyLabel)}</div>
        ${excludedLines?`${excludedLines} SALES line${excludedLines===1?' has':'s have'} a blank Invoice No. Add invoice numbers in the SALES sheet so those rows can appear in Sales Report and this dashboard.`:'Financial Year filter badal ke dekho — ya "Sync with Tally" dabao.'}
      </div></div></div>`;
  }

  const kpi=(label,value,sub,icon,tone,page)=>`<div class="card"${page?` data-action="goto" data-page="${page}"`:''}>
      <div class="card-top"><span class="card-label">${esc(label)}</span><div class="card-icon ${tone}">${NAV_ICONS[icon]}</div></div>
      <div class="card-value">${value}</div><div class="card-sub">${sub}</div>
    </div>`;
  // Spotlight card: a NAME is the headline (not a number), with its amount + a share
  // bar underneath — this is what makes "highest paying client"/"most selling
  // product" instantly readable instead of just another number tile.
  const spot=(label,name,meta,pct,sub,icon,tone,page)=>`<div class="sd-spot${page?' sd-spot-link':''}"${page?` data-action="goto" data-page="${page}"`:''}>
      <div class="sd-spot-head"><span class="sd-spot-label">${esc(label)}</span><div class="card-icon ${tone}">${NAV_ICONS[icon]}</div></div>
      <div class="sd-spot-name" title="${esc(name)}">${esc(name)}</div>
      <div class="sd-spot-meta">${meta}</div>
      <div class="sd-spot-bar"><div class="sd-spot-fill ${tone}" style="width:${Math.max(2,Math.min(100,pct)).toFixed(1)}%;"></div></div>
      <div class="sd-spot-foot"><span class="sd-spot-sub">${esc(sub)}</span>${page?'<span class="sd-spot-view">View details →</span>':''}</div>
    </div>`;
  const health=(label,valueText,pct,note,tone)=>`<div class="sd-health-row">
      <div class="sd-health-top"><span class="sd-health-label">${esc(label)}</span><span class="sd-health-val ${tone}">${esc(valueText)}</span></div>
      <div class="sd-health-track"><div class="sd-health-fill ${tone}" style="width:${Math.max(1,Math.min(100,pct)).toFixed(1)}%;"></div></div>
      <div class="sd-health-note">${esc(note)}</div>
    </div>`;
  const deltaMeta=value=>{
    if(value===null||value===undefined||!isFinite(value))return{value:'—',tone:'neutral',arrow:'',word:'No baseline'};
    const rounded=Math.abs(value).toFixed(1)+'%';
    if(value>0.05)return{value:'+'+rounded,tone:'positive',arrow:'↑',word:'Growth'};
    if(value<-.05)return{value:'−'+rounded,tone:'negative',arrow:'↓',word:'Decline'};
    return{value:'0.0%',tone:'neutral',arrow:'→',word:'Flat'};
  };
  const comparisonRow=(label,current,previous,delta,isMoney)=>{
    const hasPrevious=previous!==null&&previous!==undefined;
    const variance=hasPrevious?current-previous:null;
    const d=deltaMeta(hasPrevious?delta:null);
    const value=v=>isMoney?fmtINRCompact(v):fmtNum(v);
    const varianceText=variance===null?'—':`${variance>0?'+':variance<0?'−':''}${value(Math.abs(variance))}`;
    return `<div class="sd-compare-row">
      <span class="sd-compare-label">${esc(label)}</span>
      <span class="sd-compare-current">${value(current)}</span>
      <span>${hasPrevious?value(previous):'—'}</span>
      <span class="sd-compare-variance ${variance>0?'positive':variance<0?'negative':'neutral'}">${varianceText}</span>
      <span class="sd-compare-growth ${d.tone}">${d.arrow?`<b>${d.arrow}</b>`:''}${esc(d.value)}</span>
    </div>`;
  };
  const pulseMetric=(label,delta,currentValue,sub)=>{
    const d=deltaMeta(delta);
    return `<div class="sd-pulse-metric">
      <div class="sd-pulse-metric-label">${esc(label)}</div>
      <div class="sd-pulse-metric-value ${d.tone}"><span>${d.arrow}</span>${esc(d.value)}</div>
      <div class="sd-pulse-metric-current">${currentValue}</div>
      <div class="sd-pulse-metric-sub">${esc(sub)}</div>
    </div>`;
  };
  const insight=(tone,icon,title,value,text)=>`<div class="sd-insight ${tone}">
      <div class="sd-insight-icon">${NAV_ICONS[icon]||''}</div>
      <div class="sd-insight-copy"><div class="sd-insight-title">${esc(title)}</div><div class="sd-insight-value">${esc(value)}</div><div class="sd-insight-text">${esc(text)}</div></div>
    </div>`;
  const hasSalesComparison=!!(yoy&&yoy.hasPrevious&&yoy.salesGrowth!==null&&isFinite(yoy.salesGrowth));
  const comparisonWindow=yoy&&yoy.isPartial?`through ${fmtDDMMMYYYY(fromISO(yoy.currentThrough))}`:'full financial year';
  const previousWindow=yoy&&yoy.isPartial?`through ${fmtDDMMMYYYY(fromISO(yoy.previousThrough))}`:'full financial year';
  const salesGrowth=hasSalesComparison?deltaMeta(yoy.salesGrowth):null;
  const pulseSummary=hasSalesComparison
    ?`${yoy.currentKey} sales ${comparisonWindow} ${yoy.salesGrowth>=0?'grew':'declined'} ${Math.abs(yoy.salesGrowth).toFixed(1)}% versus ${yoy.previousKey} ${previousWindow}. ${yoy.current.clients} active clients generated ${fmtINRCompact(yoy.current.sales)} from ${yoy.current.invoices} invoices.`
    :`Sales performance for ${fyLabel}. A comparable prior financial-year period is not available yet, so year-on-year movement will appear automatically after matching history is loaded.`;
  const collectionTone=overdueOutstanding>0?'risk':'good';
  const concentrationTone=top5Pct>60?'risk':top5Pct>40?'watch':'good';
  const productDependency=topProduct?topProduct.sharePct:0;
  const productTone=productDependency>45?'risk':productDependency>25?'watch':'good';

  return `
    ${renderFilterBar(salesReportButton)}

    <section class="sd-pulse">
      <div class="sd-pulse-head">
        <div>
          <div class="sd-pulse-eyebrow">Executive Sales Pulse</div>
          <h3>${yoy?esc(yoy.currentKey+' vs '+yoy.previousKey):esc(fyLabel)}</h3>
          <p>${esc(pulseSummary)}</p>
        </div>
        <div class="sd-source-badge"><span></span>Live source: SALES Report</div>
      </div>
      <div class="sd-pulse-grid">
        ${pulseMetric('Revenue Growth',yoy&&yoy.hasPrevious?yoy.salesGrowth:null,yoy?fmtINR(yoy.current.sales):fmtINR(totalSales),yoy&&yoy.hasPrevious?'vs '+yoy.previousKey+' · '+previousWindow:'prior FY unavailable')}
        ${pulseMetric('Client Growth',yoy&&yoy.hasPrevious?yoy.clientGrowth:null,String(yoy?yoy.current.clients:knownClientRows.length)+' active clients',yoy&&yoy.hasPrevious?'vs '+yoy.previous.clients+' clients · '+previousWindow:'unique billed clients')}
        ${pulseMetric('Invoice Growth',yoy&&yoy.hasPrevious?yoy.invoiceGrowth:null,String(yoy?yoy.current.invoices:invoices.length)+' invoices',yoy&&yoy.hasPrevious?'vs '+yoy.previous.invoices+' invoices · '+previousWindow:'invoice-wise SALES rows')}
        ${pulseMetric('Avg Invoice Growth',yoy&&yoy.hasPrevious?yoy.avgInvoiceGrowth:null,fmtINR(yoy?yoy.current.avgInvoice:(invoices.length?totalSales/invoices.length:0)),yoy&&yoy.hasPrevious?'vs '+fmtINRCompact(yoy.previous.avgInvoice)+' · '+previousWindow:'current average ticket')}
      </div>
    </section>

    <div class="kpi-strip" style="grid-template-columns:repeat(6,1fr);">
      ${kpi('Total Sales',fmtINR(totalSales),esc(fyLabel),'sales','c-green','salesReport')}
      ${kpi('Total Invoices',invoices.length,`${rawLines.length} line items`,'reports','c-blue','salesReport')}
      ${kpi('Avg Invoice Value',fmtINR(invoices.length?totalSales/invoices.length:0),'per invoice','collection','c-purple','salesReport')}
      ${kpi('Total Clients',knownClientRows.length,`${nr.fresh} new · ${nr.repeat} repeat${clientRows.length>knownClientRows.length?' · '+(clientRows.length-knownClientRows.length)+' unspecified':''}`,'customer','c-teal','customerList')}
      ${kpi(dimMeta.plural+' Sold',productRows.length,`distinct ${esc(dimMeta.label.toLowerCase())}`,'wallet','c-indigo')}
      ${kpi('Unpaid from Sales',fmtINR(unpaid),`${realisedPct.toFixed(1)}% realised`,'in','c-red','ageingRecv')}
    </div>

    <div class="sd-spot-grid">
      ${topClient?spot('Highest Paying Client',topClient.client,`${fmtINR(topClient.amount)} <span>· ${topClient.invoices} invoice${topClient.invoices===1?'':'s'}</span>`,topClient.sharePct,topClient.sharePct.toFixed(1)+'% of total sales','customer','c-blue','customerList'):''}

// Duration pivot (label changed from "Category" per explicit user instruction):
// MODE toggle (Monthly/Yearly/Custom Range, all on ONE row) at the top, then a table
// with Total pinned LEFT of a % Amt column (each row's share of the grand total,
// per explicit request "INKE BEENCH MEIN % AMT KA COL ADD KARNA THA" — placed
// between Total and the dimension column), then the dimension column itself
// (Category/Party Name/State — selected via the dropdown, per explicit user request
// "CATEGORY MEIN DROPDOWN AAYE CATEGORY/PARTY NAME/STATE AND AMT USKE ACCORDING
// CHANGE HO"), followed by one column per month/FY/custom-range period. A Total row
// is pinned to the header. Every row/column is sortable/resizable — resizing ANY
// single month/year column resizes ALL of them together (existing behaviour,
// unchanged); Total/%/Dimension keep independent widths. Month column labels are
// short 2-digit years ("Apr 23") and Yearly columns show the full Apr-to-Mar span
// ("2023 (Apr 2023 To Mar 2024)") since a Tally financial year is never Jan-Dec —
// both per explicit user instruction, handled in salesCategoryPeriods_() (Grids.html).
function renderSalesCategoryPivot(){
  const mode=S.salesCategoryMode||'month';
  const dimension=S.salesDimension||'category';
  const dimMeta=SALES_DIMENSION_META[dimension]||SALES_DIMENSION_META.category;

  // Cross-filter: the "other" dimension's multi-select dropdown. If dimension is
  // 'partyName', show a Category filter above; if 'category', show Party Name; etc.
  // Per explicit user instruction ("agar niche party name selected hai to upar ek
  // or dropdown aa jaye category ka, aise hi agar niche category selected hai to
  // upar party name ka dropdown aa jaye...dono dropdown multiselect wale chahiye
  // AND type bhi kar sake").
  const crossDim=dimension==='partyName'?'category':dimension==='category'?'partyName':'category';
  const crossMeta=SALES_DIMENSION_META[crossDim]||SALES_DIMENSION_META.category;
  const crossFilter=S.salesCrossFilter||[];
  const {periods,rows}=buildSalesDimensionPivot_(mode,dimension,crossFilter.length?crossDim:null,crossFilter);
  const sortKey=S.salesCategorySort||'total',sortDir=S.salesCategorySortDir===1?1:-1;
  const sorted=rows.slice().sort((a,b)=>{
    if(sortKey==='dim'){
      const x=a.dimVal.toLowerCase(),y=b.dimVal.toLowerCase();
      if(x<y)return -1*sortDir;if(x>y)return 1*sortDir;return 0;
    }
    if(sortKey==='pct'){ return (a.total-b.total)*sortDir; }
    const x=sortKey==='total'?a.total:(a.periods[sortKey]||0);
    const y=sortKey==='total'?b.total:(b.periods[sortKey]||0);
    return (x-y)*sortDir;
  });
  const grandTotal=rows.reduce((s,r)=>s+r.total,0);
  const periodGrandTotals={};periods.forEach(p=>{periodGrandTotals[p.key]=rows.reduce((s,r)=>s+(r.periods[p.key]||0),0);});
  const pctOf=t=>grandTotal?((t/grandTotal)*100).toFixed(1)+'%':'0.0%';

  // Per explicit user instruction: Monthly/Yearly/Custom Range must all render on
  // ONE row together with the row-count/Refresh/Sales-Duration toggle beneath it —
  // NOT split into separate stacked rows above/below each other.
  // FY multi-select — available for ALL modes (Monthly, Yearly, Custom Range), not
  // just Custom Range, per explicit user instruction ("custom range not working with
  // monthly pls see vo dono ke liye same hai"). Lets the user pick which financial
  // years' data to display regardless of the time-bucketing mode.
  const customFYs=S.salesCategoryCustomFYs||[];
  const allFYs=availableFinancialYears();
  const customFYLabel=customFYs.length?customFYs.map(k=>{const f=financialYearFromKey(k);return f?`${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)}`:k;}).join(', '):'Select Financial Year(s)';
  const fyPickerBtn=`<div class="fy-multi sales-cat-range-multi">
      <button type="button" class="fy-multi-btn" data-action="sales-cat-range-open">${esc(customFYLabel)} <span>▾</span></button>
      ${S.salesCategoryRangeOpen?`<div class="fy-menu sales-cat-range-menu">
        <div class="fy-option fy-all"><label><input type="checkbox" data-action="sales-cat-fy-all" ${customFYs.length===allFYs.length?'checked':''}> <span>Select All</span></label></div>
        ${allFYs.map(f=>`<div class="fy-option"><label><input type="checkbox" data-action="sales-cat-fy-toggle" data-key="${esc(f.key)}" ${customFYs.includes(f.key)?'checked':''}> <span>${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)} (Apr ${f.start.getFullYear()} – Mar ${f.end.getFullYear()})</span></label></div>`).join('')}
      </div>`:''}
    </div>`;
  const modeBar=`<div class="view-toggle sales-cat-mode-toggle">
      <button class="${mode==='month'?'active':''}" data-action="sales-cat-mode" data-mode="month">Monthly</button>
      <button class="${mode==='year'?'active':''}" data-action="sales-cat-mode" data-mode="year">Yearly</button>
      <button class="${mode==='custom'?'active':''}" data-action="sales-cat-mode" data-mode="custom">Custom Range</button>
    </div>
    ${fyPickerBtn}`;

  const totW=S.salesCategoryTotalWidth||130,pctW=S.salesCategoryPctWidth||90,catW=S.salesCategoryCatWidth||210,colW=S.salesCategoryColWidth||110;
  // Left-freeze positions computed from actual column widths (user can resize them,
  // so these can't be hardcoded CSS values) — per explicit user instruction ("ye
  // right scroll mein hide na ho freeze ho jaye").
  const snoW=52,leftTotal=snoW,leftPct=snoW+totW,leftCat=snoW+totW+pctW;
  const sortArrow=k=>sortKey===k?(sortDir===1?'▲':'▼'):'↕';
  // S.No — every other table/grid in the app (Sales Report itself, Customer List,
  // Receivables, etc.) has this as its leftmost column, so it's added here too for
  // the same consistent numbering convention, ahead of Total/%/Dimension.
  const snoTh=`<th class="scp-th scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"><div class="scp-th-inner" style="justify-content:center;cursor:default;">S.No</div></th>`;
  const totalTh=`<th class="scp-th scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;" data-action="sales-cat-sort" data-col="total">
      <div class="scp-th-inner"><span>Total</span><span class="scp-sort-ic">${sortArrow('total')}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="total"></div>
    </th>`;
  const pctTh=`<th class="scp-th scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;" data-action="sales-cat-sort" data-col="pct">
      <div class="scp-th-inner"><span>% Amt</span><span class="scp-sort-ic">${sortArrow('pct')}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="pct"></div>
    </th>`;
  const catTh=`<th class="scp-th scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">
      <div class="scp-th-inner scp-dim-inner">
        <select class="scp-dim-select" data-action="sales-dimension-select" title="Group rows by">
          ${Object.keys(SALES_DIMENSION_META).map(k=>`<option value="${k}" ${dimension===k?'selected':''}>${esc(SALES_DIMENSION_META[k].label)}</option>`).join('')}
        </select>
        <span class="scp-sort-ic" data-action="sales-cat-sort" data-col="dim" title="Sort">${sortArrow('dim')}</span>
      </div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="category"></div>
    </th>`;
  const periodTh=periods.map(p=>`<th class="scp-th scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;" data-action="sales-cat-sort" data-col="${esc(p.key)}">
      <div class="scp-th-inner"><span title="${esc(p.label)}">${esc(p.label)}</span><span class="scp-sort-ic">${sortArrow(p.key)}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="period"></div>
    </th>`).join('');

  const totalsRow=`<tr class="scp-totals-row">
      <td class="scp-tot scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"></td>
      <td class="scp-tot scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;">${fmtNum(grandTotal)}</td>
      <td class="scp-tot scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;">100.0%</td>
      <td class="scp-tot scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">TOTAL</td>
      ${periods.map(p=>`<td class="scp-tot scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;">${fmtNum(periodGrandTotals[p.key]||0)}</td>`).join('')}
    </tr>`;

  // Heatmap: compute max per period AND for the Total column, then shade each cell.
  // Uses a professional multi-tone gradient: light mint → teal → deep blue for
  // period cells; warm gold → deep indigo for the Total column — so the two read
  // as distinct data dimensions at a glance while both clearly communicate
  // magnitude via saturation/darkness.
  const maxTotal=Math.max(1,...sorted.map(r=>r.total));
  const periodMaxes={};periods.forEach(p=>{periodMaxes[p.key]=Math.max(1,...sorted.map(r=>r.periods[p.key]||0));});
  function heatPeriod_(val,maxVal){
    if(!val||!maxVal)return '';
    const t=Math.min(1,val/maxVal);
    // Gradient: #F0FDF4 (mint) → #10B981 (emerald) → #064E3B (deep green)
    let r,g,b;
    if(t<=0.5){const s=t*2;r=Math.round(240+(16-240)*s);g=Math.round(253+(185-253)*s);b=Math.round(244+(129-244)*s);}
    else{const s=(t-0.5)*2;r=Math.round(16+(6-16)*s);g=Math.round(185+(78-185)*s);b=Math.round(129+(59-129)*s);}
    return `background:rgb(${r},${g},${b});color:${t>0.55?'#fff':'#064E3B'};font-weight:700;`;
  }
  function heatTotal_(val,maxVal){
    if(!val||!maxVal)return '';
    const t=Math.min(1,val/maxVal);
    // Gradient: #EFF6FF (ice blue) → #2563EB (vivid blue) → #1E3A5F (navy)
    let r,g,b;
    if(t<=0.5){const s=t*2;r=Math.round(239+(37-239)*s);g=Math.round(246+(99-246)*s);b=Math.round(255+(235-255)*s);}
    else{const s=(t-0.5)*2;r=Math.round(37+(30-37)*s);g=Math.round(99+(58-99)*s);b=Math.round(235+(95-235)*s);}
    return `background:rgb(${r},${g},${b});color:${t>0.45?'#fff':'#1E3A5F'};font-weight:700;`;
  }

  // Pagination for Duration pivot
  const totalRows=sorted.length;
  const pageSize=S.salesCategoryPageSize||50;
  const totalPages=Math.max(1,Math.ceil(totalRows/pageSize));
  if(S.salesCategoryPage>totalPages)S.salesCategoryPage=totalPages;
  const curPage=S.salesCategoryPage||1;
  const pageStart=(curPage-1)*pageSize;
  const pageEnd=Math.min(pageStart+pageSize,totalRows);
  const paged=sorted.slice(pageStart,pageEnd);

  const body=paged.length?paged.map((r,idx)=>`<tr>
      <td class="scp-cell scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;">${pageStart+idx+1}</td>
      <td class="scp-cell scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;${heatTotal_(r.total,maxTotal)}">${fmtNum(r.total)}</td>

        tableState('salesProductSummary').page=1;

      }

    }

    if(a==='sales-cat-range-open'){S.salesCategoryRangeOpen=!S.salesCategoryRangeOpen;render();return;}

      const allKeys=availableFinancialYears().map(f=>f.key);
      S.salesCategoryCustomFYs=S.salesCategoryCustomFYs.length===allKeys.length?[]:allKeys.slice();
      render();return;
    }
    if(a==='sales-cat-fy-toggle'){
      const key=el.getAttribute('data-key');
      const idx=S.salesCategoryCustomFYs.indexOf(key);
      if(idx===-1)S.salesCategoryCustomFYs.push(key);else S.salesCategoryCustomFYs.splice(idx,1);
      render();return;
    }
    // Cross-filter dropdown handlers
    if(a==='sales-cross-open'){S.salesCrossFilterOpen=!S.salesCrossFilterOpen;S.salesCrossFilterSearch='';render();return;}
    if(a==='sales-cross-all'){
      const crossDim=(S.salesDimension||'category')==='partyName'?'category':'partyName';
      const allVals=salesDimensionValues_(crossDim);
      S.salesCrossFilter=S.salesCrossFilter.length===allVals.length?[]:allVals.slice();
      render();return;
    }
    if(a==='sales-cross-toggle'){
      const val=el.getAttribute('data-val');
      const idx=S.salesCrossFilter.indexOf(val);
      if(idx===-1)S.salesCrossFilter.push(val);else S.salesCrossFilter.splice(idx,1);
      render();return;
    }
    if(a==='sales-cross-clear'){S.salesCrossFilter=[];render();return;}
    if(a==='sales-cat-reset-filters'){S.salesCrossFilter=[];S.salesCategoryCustomFYs=[];S.salesCategoryPage=1;render();return;}
    if(a==='sales-cat-sort'){
      // Skip sort if a column resize just completed — the mouseup event from the
      // resize handle bubbles up as a click on the parent <th> which also has
      // data-action="sales-cat-sort", and triggering a sort here would re-render
      // the table and appear to "undo" the resize the user just did.
      if(salesCatResizedRecently)return;
      const col=el.getAttribute('data-col');
      if(S.salesCategorySort===col)S.salesCategorySortDir*=-1;else{S.salesCategorySort=col;S.salesCategorySortDir=col==='dim'?1:-1;}
      S.salesCategoryPage=1;render();return;
    }
    // Pagination actions for sales Duration pivot
    if(a==='sales-cat-pagefirst'){S.salesCategoryPage=1;render();return;}
    if(a==='sales-cat-pageprev'){S.salesCategoryPage=Math.max(1,S.salesCategoryPage-1);render();return;}
    if(a==='sales-cat-pagenext'){S.salesCategoryPage++;render();return;}
    if(a==='sales-cat-pagelast'){S.salesCategoryPage=999999;render();return;}
  }
  // Click-away close for the Custom Range popover and Cross-filter dropdown.
  if(S.salesCategoryRangeOpen&&!e.target.closest('.sales-cat-range-multi')){S.salesCategoryRangeOpen=false;render();}
  if(S.salesCrossFilterOpen&&!e.target.closest('.sales-cross-filter-multi')){S.salesCrossFilterOpen=false;S.salesCrossFilterSearch='';render();}
});

// Column-group resize: dragging ANY month/year column resizes ALL of them together
// (per explicit user instruction), while Total/%/Dimension keep independent widths —
// same mousedown/mousemove/mouseup pattern as the generic grid's per-column resize
// in Common.html, just writing into S.salesCategory*Width instead of a per-key map.
let salesCatResizeCtx=null;
let salesCatResizedRecently=false;
document.addEventListener('mousedown',e=>{
  const el=e.target.closest('[data-action="sales-cat-resize"]');if(!el)return;
  const target=el.getAttribute('data-target');const th=el.closest('th');
  salesCatResizeCtx={target,startX:e.clientX,startW:th.getBoundingClientRect().width};
  e.preventDefault();
  e.stopPropagation(); // prevent the sort click on parent <th> from firing
});
document.addEventListener('mousemove',e=>{
  if(!salesCatResizeCtx)return;
  const nw=Math.max(70,Math.round(salesCatResizeCtx.startW+(e.clientX-salesCatResizeCtx.startX)));
  const target=salesCatResizeCtx.target;
  if(target==='period'){
    // All period columns resize together
    document.querySelectorAll('.scp-table .scp-period').forEach(cell=>{cell.style.width=nw+'px';cell.style.minWidth=nw+'px';cell.style.maxWidth=nw+'px';});
  } else {
    // Individual frozen column — resize only THAT column class
    const selector=target==='total'?'.scp-total':target==='pct'?'.scp-pct':'.scp-cat';
    document.querySelectorAll('.scp-table '+selector).forEach(cell=>{cell.style.width=nw+'px';cell.style.minWidth=nw+'px';cell.style.maxWidth=nw+'px';});
    // Recompute left positions for all frozen columns after the resized one
    const snoW=52;
    const totEl=document.querySelector('.scp-table th.scp-total');
    const pctEl=document.querySelector('.scp-table th.scp-pct');
    const catEl=document.querySelector('.scp-table th.scp-cat');
    const curTotW=totEl?totEl.getBoundingClientRect().width:(S.salesCategoryTotalWidth||130);
    const curPctW=pctEl?pctEl.getBoundingClientRect().width:(S.salesCategoryPctWidth||90);
    const leftTotal=snoW,leftPct=snoW+curTotW,leftCat=snoW+curTotW+curPctW;
    document.querySelectorAll('.scp-table .scp-total').forEach(cell=>{cell.style.left=leftTotal+'px';});
    document.querySelectorAll('.scp-table .scp-pct').forEach(cell=>{cell.style.left=leftPct+'px';});
    document.querySelectorAll('.scp-table .scp-cat').forEach(cell=>{cell.style.left=leftCat+'px';});
  }
});
document.addEventListener('mouseup',()=>{
  if(!salesCatResizeCtx)return;
  const targetClass=salesCatResizeCtx.target==='total'?'scp-total':salesCatResizeCtx.target==='pct'?'scp-pct':salesCatResizeCtx.target==='category'?'scp-cat':'scp-period';
  const el=document.querySelector('.scp-table th.'+targetClass);
  const nw=el?el.getBoundingClientRect().width:null;
  if(nw){
    if(salesCatResizeCtx.target==='total')S.salesCategoryTotalWidth=Math.round(nw);
    else if(salesCatResizeCtx.target==='pct')S.salesCategoryPctWidth=Math.round(nw);
    else if(salesCatResizeCtx.target==='category')S.salesCategoryCatWidth=Math.round(nw);
    else S.salesCategoryColWidth=Math.round(nw);
    persistPivotColWidths_();
  }
  salesCatResizeCtx=null;
  // Flag that a resize just completed — the click event that follows mouseup on the
  // parent <th> must NOT trigger a sort toggle (it would re-render and appear to
  // "reset" the resize). The flag clears after one tick.
  salesCatResizedRecently=true;
  setTimeout(()=>{salesCatResizedRecently=false;},0);
  render();
});

      <div class="card"><div class="card-top"><span class="card-label">Total Operating Expenses</span><div class="card-icon c-red">${NAV_ICONS.wallet}</div></div><div class="card-value">${fmtINR(cur.expense)}</div><div class="card-sub">${pctOfSales_(cur.expense)} of Sales · ${expByCategory.length} categories</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Net Profit</span><div class="card-icon ${netProfit>=0?'c-green':'c-red'}">${NAV_ICONS.pl}</div></div><div class="card-value" style="color:${netProfit>=0?'var(--success)':'var(--danger)'};">${fmtINR(netProfit)}</div><div class="card-sub">${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Net Margin</span><div class="card-icon c-purple">${NAV_ICONS.collection}</div></div><div class="card-value" style="color:${netMarginPct>=0?'var(--success)':'var(--danger)'};">${netMarginPct.toFixed(1)}%</div><div class="card-sub">Net Profit ÷ Sales</div></div>
    </div>
    <div class="dash-row">
      <div class="panel">
        <div class="panel-title">Profit &amp; Loss Statement <span style="font-weight:500;color:var(--muted);font-size:11px;">— ${esc(fyLabel)}</span></div>
        <div class="panel-body" style="padding:4px 16px 14px;">
          <div class="pl-statement">
            <div class="pl-head-row"><span></span><span>% of Sales</span><span>Amount</span></div>
            ${plRow('Sales',cur.sales,{noPct:true})}
            ${plRow('Less: Purchases',cur.purchase)}
            ${plRow('Gross Profit',grossProfit,{subtotal:true})}
            ${plSection('Operating Expenses')}
            ${expByCategory.length?expByCategory.map(c=>plRow('Less: '+c.label,c.value)).join(''):`<div class="pl-row"><span class="pl-label" style="font-style:italic;color:var(--muted);">No expense lines for the selected financial year(s)</span><span class="pl-pct"></span><span class="pl-val"></span></div>`}
            ${plRow('Net Profit',netProfit,{total:true})}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Top Expense Categories</div>
        <div class="panel-body">${expByCategory.slice(0,8).map((c,i)=>`<div class="mini-cat-row"><span class="mini-cat-dot" style="background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></span><span class="mc-label" title="${esc(c.label)}">${esc(c.label)}</span><div class="mc-track"><div class="mc-fill" style="width:${(c.value/maxExpCat*100).toFixed(0)}%;background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></div></div><span class="mc-amt">${fmtINR(c.value)}</span><span class="mc-pct">${pctOfSales_(c.value)}</span></div>`).join('')||`<div class="empty-state"><div class="big">No expenses for the selected financial years</div></div>`}</div>

    </div>
    <div class="compare-note" style="margin-top:10px;">Operating expenses are grouped by Sub Group from the EXPENSE sheet for the selected financial year(s). "% of Sales" shows each line as a share of Sales so the biggest cost drivers are easy to spot at a glance. This is an indicative P&amp;L (no Other Income/Depreciation/Tax provisions are tracked in the sheet) — for statutory reporting, use Tally directly.</div>`;
}

  return `

          <div class="kv-row" style="font-weight:700;border-top:2px solid var(--ink);"><span class="k">Total Assets</span><span class="v">${fmtINR(totalAssets)}</span></div>

          <div class="kv-row"><span class="k">Sundry Creditors (Payables)</span><span class="v">${fmtINR(totalPay)}</span></div>
          <div class="kv-row"><span class="k">Bank Overdraft</span><span class="v">${fmtINR(Math.max(0,-cashPos))}</span></div>
          <div class="kv-row" style="font-weight:700;"><span class="k">Total Liabilities</span><span class="v">${fmtINR(totalLiabilities)}</span></div>
          <div class="kv-row" style="font-weight:700;border-top:2px solid var(--ink);"><span class="k">Capital / Equity (Balancing figure)</span><span class="v">${fmtINR(equity)}</span></div>

}

function renderExpenseCategoryPivot(){
  const mode=S.expenseCategoryMode||'month';
  const dimension=S.expenseDimension||'group';
  const dimMeta=EXPENSE_DIMENSION_META[dimension]||EXPENSE_DIMENSION_META.group;
  const crossDim=dimension==='group'?'subGroup':'group';
  const crossMeta=EXPENSE_DIMENSION_META[crossDim]||EXPENSE_DIMENSION_META.group;
  const crossFilter=S.expenseCrossFilter||[];
  const {periods,rows}=buildExpenseDimensionPivot_(mode,dimension,crossFilter.length?crossDim:null,crossFilter);
  const sortKey=S.expenseCategorySort||'total',sortDir=S.expenseCategorySortDir===1?1:-1;
  const sorted=rows.slice().sort((a,b)=>{
    if(sortKey==='dim'){
      const x=a.dimVal.toLowerCase(),y=b.dimVal.toLowerCase();
      if(x<y)return -1*sortDir;if(x>y)return 1*sortDir;return 0;
    }
    if(sortKey==='pct'){ return (a.total-b.total)*sortDir; }
    const x=sortKey==='total'?a.total:(a.periods[sortKey]||0);
    const y=sortKey==='total'?b.total:(b.periods[sortKey]||0);
    return (x-y)*sortDir;
  });
  const grandTotal=rows.reduce((s,r)=>s+r.total,0);
  const periodGrandTotals={};periods.forEach(p=>{periodGrandTotals[p.key]=rows.reduce((s,r)=>s+(r.periods[p.key]||0),0);});
  const pctOf=t=>grandTotal?((t/grandTotal)*100).toFixed(1)+'%':'0.0%';

  const customFYs=S.expenseCategoryCustomFYs||[];
  const allFYs=availableFinancialYears();
  const customFYLabel=customFYs.length?customFYs.map(k=>{const f=financialYearFromKey(k);return f?`${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)}`:k;}).join(', '):'Select Financial Year(s)';
  const fyPickerBtn=`<div class="fy-multi expense-cat-range-multi">
      <button type="button" class="fy-multi-btn" data-action="expense-cat-range-open">${esc(customFYLabel)} <span>▾</span></button>
      ${S.expenseCategoryRangeOpen?`<div class="fy-menu expense-cat-range-menu">
        <div class="fy-option fy-all"><label><input type="checkbox" data-action="expense-cat-fy-all" ${customFYs.length===allFYs.length?'checked':''}> <span>Select All</span></label></div>
        ${allFYs.map(f=>`<div class="fy-option"><label><input type="checkbox" data-action="expense-cat-fy-toggle" data-key="${esc(f.key)}" ${customFYs.includes(f.key)?'checked':''}> <span>${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)} (Apr ${f.start.getFullYear()} – Mar ${f.end.getFullYear()})</span></label></div>`).join('')}
      </div>`:''}
    </div>`;
  const modeBar=`<div class="view-toggle expense-cat-mode-toggle">
      <button class="${mode==='month'?'active':''}" data-action="expense-cat-mode" data-mode="month">Monthly</button>
      <button class="${mode==='year'?'active':''}" data-action="expense-cat-mode" data-mode="year">Yearly</button>
      <button class="${mode==='custom'?'active':''}" data-action="expense-cat-mode" data-mode="custom">Custom Range</button>
    </div>
    ${fyPickerBtn}`;

  const totW=S.expenseCategoryTotalWidth||130,pctW=S.expenseCategoryPctWidth||90,catW=S.expenseCategoryCatWidth||210,colW=S.expenseCategoryColWidth||110;
  const snoW=52,leftTotal=snoW,leftPct=snoW+totW,leftCat=snoW+totW+pctW;
  const sortArrow=k=>sortKey===k?(sortDir===1?'▲':'▼'):'↕';
  const snoTh=`<th class="scp-th scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"><div class="scp-th-inner" style="justify-content:center;cursor:default;">S.No</div></th>`;
  const totalTh=`<th class="scp-th scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;" data-action="expense-cat-sort" data-col="total">
      <div class="scp-th-inner"><span>Total</span><span class="scp-sort-ic">${sortArrow('total')}</span></div>
      <div class="scp-resize" data-action="expense-cat-resize" data-target="total"></div>
    </th>`;
  const pctTh=`<th class="scp-th scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;" data-action="expense-cat-sort" data-col="pct">
      <div class="scp-th-inner"><span>% Amt</span><span class="scp-sort-ic">${sortArrow('pct')}</span></div>
      <div class="scp-resize" data-action="expense-cat-resize" data-target="pct"></div>
    </th>`;
  const catTh=`<th class="scp-th scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">
      <div class="scp-th-inner scp-dim-inner">
        <select class="scp-dim-select" data-action="expense-dimension-select" title="Group rows by">
          ${Object.keys(EXPENSE_DIMENSION_META).map(k=>`<option value="${k}" ${dimension===k?'selected':''}>${esc(EXPENSE_DIMENSION_META[k].label)}</option>`).join('')}
        </select>
        <span class="scp-sort-ic" data-action="expense-cat-sort" data-col="dim" title="Sort">${sortArrow('dim')}</span>
      </div>
      <div class="scp-resize" data-action="expense-cat-resize" data-target="category"></div>
    </th>`;
  const periodTh=periods.map(p=>`<th class="scp-th scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;" data-action="expense-cat-sort" data-col="${esc(p.key)}">
      <div class="scp-th-inner"><span title="${esc(p.label)}">${esc(p.label)}</span><span class="scp-sort-ic">${sortArrow(p.key)}</span></div>
      <div class="scp-resize" data-action="expense-cat-resize" data-target="period"></div>
    </th>`).join('');

  const totalsRow=`<tr class="scp-totals-row">
      <td class="scp-tot scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"></td>
      <td class="scp-tot scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;">${fmtNum(grandTotal)}</td>
      <td class="scp-tot scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;">100.0%</td>
      <td class="scp-tot scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">TOTAL</td>
      ${periods.map(p=>`<td class="scp-tot scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;">${fmtNum(periodGrandTotals[p.key]||0)}</td>`).join('')}
    </tr>`;

  const maxTotal=Math.max(1,...sorted.map(r=>r.total));
  const periodMaxes={};periods.forEach(p=>{periodMaxes[p.key]=Math.max(1,...sorted.map(r=>r.periods[p.key]||0));});
  function heatPeriodExp_(val,maxVal){
    if(!val||!maxVal)return '';
    const t=Math.min(1,val/maxVal);
    let r,g,b;
    if(t<=0.5){const s=t*2;r=Math.round(240+(16-240)*s);g=Math.round(253+(185-253)*s);b=Math.round(244+(129-244)*s);}
    else{const s=(t-0.5)*2;r=Math.round(16+(6-16)*s);g=Math.round(185+(78-185)*s);b=Math.round(129+(59-129)*s);}
    return `background:rgb(${r},${g},${b});color:${t>0.55?'#fff':'#064E3B'};font-weight:700;`;
  }
  function heatTotalExp_(val,maxVal){
    if(!val||!maxVal)return '';
    const t=Math.min(1,val/maxVal);
    let r,g,b;
    if(t<=0.5){const s=t*2;r=Math.round(239+(37-239)*s);g=Math.round(246+(99-246)*s);b=Math.round(255+(235-255)*s);}
    else{const s=(t-0.5)*2;r=Math.round(37+(30-37)*s);g=Math.round(99+(58-99)*s);b=Math.round(235+(95-235)*s);}
    return `background:rgb(${r},${g},${b});color:${t>0.45?'#fff':'#1E3A5F'};font-weight:700;`;
  }

  // Pagination for Expense Duration pivot
  const expTotalRows=sorted.length;
  const expPageSize=S.expenseCategoryPageSize||50;
  const expTotalPages=Math.max(1,Math.ceil(expTotalRows/expPageSize));
  if(S.expenseCategoryPage>expTotalPages)S.expenseCategoryPage=expTotalPages;
  const expCurPage=S.expenseCategoryPage||1;
  const expPageStart=(expCurPage-1)*expPageSize;
  const expPageEnd=Math.min(expPageStart+expPageSize,expTotalRows);
  const expPaged=sorted.slice(expPageStart,expPageEnd);

  const body=expPaged.length?expPaged.map((r,idx)=>`<tr>
      <td class="scp-cell scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;">${expPageStart+idx+1}</td>
      <td class="scp-cell scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;${heatTotalExp_(r.total,maxTotal)}">${fmtNum(r.total)}</td>
      <td class="scp-cell scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;">${pctOf(r.total)}</td>
      <td class="scp-cell scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">${esc(r.dimVal)}</td>
      ${periods.map(p=>{const v=r.periods[p.key]||0;return `<td class="scp-cell scp-period${!v?' scp-zero':''}" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;${v?heatPeriodExp_(v,periodMaxes[p.key]):''}">${v?fmtNum(v):'—'}</td>`;}).join('')}
    </tr>`).join(''):`<tr><td colspan="${periods.length+4}"><div class="empty-state"><div class="big">No expense lines for the selected financial year(s)</div></div></td></tr>`;

  const expPaginationHtml=`<div class="dt-pagination">
      <div class="pp"><label>Rows per page</label><select data-action="expense-cat-pagesize">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}" ${expPageSize===n?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="page-range">${expTotalRows===0?'0':`${expPageStart+1}\u2013${expPageEnd}`} of ${expTotalRows}</div>
      <div class="nav" aria-label="Pagination">
        <button data-action="expense-cat-pagefirst" title="First page" ${expCurPage<=1?'disabled':''}>«</button>
        <button data-action="expense-cat-pageprev" title="Previous page" ${expCurPage<=1?'disabled':''}>‹</button>
        <span class="pageinfo">${expCurPage} / ${expTotalPages}</span>
        <button data-action="expense-cat-pagenext" title="Next page" ${expCurPage>=expTotalPages?'disabled':''}>›</button>
        <button data-action="expense-cat-pagelast" title="Last page" ${expCurPage>=expTotalPages?'disabled':''}>»</button>
      </div>
    </div>`;

  const crossAllValues=expenseDimensionValues_(crossDim);
  const crossSearch=(S.expenseCrossFilterSearch||'').toLowerCase();
  const crossFiltered=crossSearch?crossAllValues.filter(v=>v.toLowerCase().includes(crossSearch)):crossAllValues;
  const crossLabel=crossFilter.length?`${crossMeta.label}: ${crossFilter.length} selected`:`Filter by ${crossMeta.label}`;
  const crossDropdown=`<div class="fy-multi expense-cross-filter-multi">
      <button type="button" class="fy-multi-btn" data-action="expense-cross-open">${esc(crossLabel)} <span>▾</span></button>
      ${S.expenseCrossFilterOpen?`<div class="fy-menu expense-cross-menu">
        <input type="text" class="cross-filter-search" placeholder="Type to search ${crossMeta.label}…" data-action="expense-cross-search" value="${esc(S.expenseCrossFilterSearch||'')}">
        <div class="fy-option fy-all"><label><input type="checkbox" data-action="expense-cross-all" ${crossFilter.length===crossAllValues.length?'checked':''}> <span>Select All (${crossAllValues.length})</span></label></div>
        <div class="cross-filter-options">${crossFiltered.map(v=>`<div class="fy-option"><label><input type="checkbox" data-action="expense-cross-toggle" data-val="${esc(v)}" ${crossFilter.includes(v)?'checked':''}> <span>${esc(v)}</span></label></div>`).join('')}</div>
        ${crossFilter.length?`<div class="cross-filter-clear"><button class="btn btn-ghost" data-action="expense-cross-clear" style="padding:4px 10px;font-size:10px;width:100%;">Clear All</button></div>`:''} 
      </div>`:''}
    </div>`;

  // Reset Filters — same reasoning as the Sales Duration pivot above ("JHA JHA
  // FILTER HAI ADD RESET FILTER PLS"): clears the cross-filter (Group/Sub Group)
  // and the Custom FY selection for THIS (Expense) pivot.
  const expenseCatFiltersActive=!!(crossFilter.length||customFYs.length);
  const expenseResetFiltersBtn=`<button class="btn btn-ghost" data-action="expense-cat-reset-filters" ${expenseCatFiltersActive?'':'disabled'} title="Clear the cross-filter and custom financial year selection">↺ Reset Filters</button>`;
  const catToolbar=`<div class="dt-toolbar expense-cat-toolbar">
      ${renderExpenseReportViewToggle_()}
      ${modeBar}
      ${crossDropdown}
      <div class="report-switcher-right">
        <span class="count">${rows.length} ${esc(dimMeta.plural)}</span>
        ${expenseResetFiltersBtn}
        <button class="btn btn-ghost" data-action="refreshpage" style="padding:5px 12px;font-size:11.5px;">${S.syncing?'⟳ Refreshing…':'⟳ Refresh'}</button>
      </div>
    </div>`;

  return `${catToolbar}
    <div class="dt-table-wrap expense-cat-wrap">
      <div class="dt-scroll">
        <table class="dt scp-table">
          <thead>
            ${totalsRow}
            <tr>${snoTh}${totalTh}${pctTh}${catTh}${periodTh}</tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      ${expPaginationHtml}
    </div>`;
}
// Event handlers for expense report
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(el){
    const a=el.getAttribute('data-action');
    if(a==='expense-report-view'){S.expenseReportView=el.getAttribute('data-view');render();return;}
    if(a==='expense-cat-mode'){S.expenseCategoryMode=el.getAttribute('data-mode');S.expenseCategoryPage=1;render();return;}
    if(a==='expense-cat-range-open'){S.expenseCategoryRangeOpen=!S.expenseCategoryRangeOpen;render();return;}
    if(a==='expense-cat-fy-all'){
      const allKeys=availableFinancialYears().map(f=>f.key);
      S.expenseCategoryCustomFYs=S.expenseCategoryCustomFYs.length===allKeys.length?[]:allKeys.slice();
      render();return;
    }
    if(a==='expense-cat-fy-toggle'){
      const key=el.getAttribute('data-key');
      const idx=S.expenseCategoryCustomFYs.indexOf(key);
      if(idx===-1)S.expenseCategoryCustomFYs.push(key);else S.expenseCategoryCustomFYs.splice(idx,1);
      render();return;
    }
    if(a==='expense-cross-open'){S.expenseCrossFilterOpen=!S.expenseCrossFilterOpen;S.expenseCrossFilterSearch='';render();return;}
    if(a==='expense-cross-all'){
      const crossDim=(S.expenseDimension||'group')==='group'?'subGroup':'group';
      const allVals=expenseDimensionValues_(crossDim);
      S.expenseCrossFilter=S.expenseCrossFilter.length===allVals.length?[]:allVals.slice();
      render();return;
    }
    if(a==='expense-cross-toggle'){
      const val=el.getAttribute('data-val');
      const idx=S.expenseCrossFilter.indexOf(val);
      if(idx===-1)S.expenseCrossFilter.push(val);else S.expenseCrossFilter.splice(idx,1);
      render();return;
    }
    if(a==='expense-cross-clear'){S.expenseCrossFilter=[];render();return;}
    if(a==='expense-cat-reset-filters'){S.expenseCrossFilter=[];S.expenseCategoryCustomFYs=[];S.expenseCategoryPage=1;render();return;}
    if(a==='expense-cat-sort'){
      if(expenseCatResizedRecently)return;
      const col=el.getAttribute('data-col');
      if(S.expenseCategorySort===col)S.expenseCategorySortDir*=-1;else{S.expenseCategorySort=col;S.expenseCategorySortDir=col==='dim'?1:-1;}
      S.expenseCategoryPage=1;render();return;
    }
    // Pagination actions for expense Duration pivot
    if(a==='expense-cat-pagefirst'){S.expenseCategoryPage=1;render();return;}
    if(a==='expense-cat-pageprev'){S.expenseCategoryPage=Math.max(1,S.expenseCategoryPage-1);render();return;}
    if(a==='expense-cat-pagenext'){S.expenseCategoryPage++;render();return;}
    if(a==='expense-cat-pagelast'){S.expenseCategoryPage=999999;render();return;}
  }
  if(S.expenseCategoryRangeOpen&&!e.target.closest('.expense-cat-range-multi')){S.expenseCategoryRangeOpen=false;render();}
  if(S.expenseCrossFilterOpen&&!e.target.closest('.expense-cross-filter-multi')){S.expenseCrossFilterOpen=false;S.expenseCrossFilterSearch='';render();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.getAttribute('data-action')==='expense-cat-pagesize'){
    S.expenseCategoryPageSize=parseInt(el.value,10);S.expenseCategoryPage=1;render();return;
  }
  if(el.getAttribute('data-action')==='expense-dimension-select'){
    const v=el.value;
    if(EXPENSE_DIMENSION_META[v]){
      S.expenseDimension=v;
      S.expenseCrossFilter=[];S.expenseCrossFilterOpen=false;S.expenseCrossFilterSearch='';
      render();
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target,a=el.getAttribute('data-action');
  if(a==='expense-cross-search'){
    S.expenseCrossFilterSearch=el.value;
    clearTimeout(S._expenseCrossSearchTimer);
    S._expenseCrossSearchTimer=setTimeout(()=>{
      const pos=el.selectionStart;
      render();
      const ag=document.querySelector('input[data-action="expense-cross-search"]');
      if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },200);
    return;
  }
});
// Column resize for expense pivot
let expenseCatResizeCtx=null;
let expenseCatResizedRecently=false;
document.addEventListener('mousedown',e=>{
  const el=e.target.closest('[data-action="expense-cat-resize"]');if(!el)return;
  const target=el.getAttribute('data-target');const th=el.closest('th');
  expenseCatResizeCtx={target,startX:e.clientX,startW:th.getBoundingClientRect().width};
  e.preventDefault();
  e.stopPropagation();
});
document.addEventListener('mousemove',e=>{
  if(!expenseCatResizeCtx)return;
  const nw=Math.max(70,Math.round(expenseCatResizeCtx.startW+(e.clientX-expenseCatResizeCtx.startX)));
  const target=expenseCatResizeCtx.target;
  if(target==='period'){
    document.querySelectorAll('.expense-cat-wrap .scp-table .scp-period').forEach(cell=>{cell.style.width=nw+'px';cell.style.minWidth=nw+'px';cell.style.maxWidth=nw+'px';});
  } else {
    const selector=target==='total'?'.scp-total':target==='pct'?'.scp-pct':'.scp-cat';
    document.querySelectorAll('.expense-cat-wrap .scp-table '+selector).forEach(cell=>{cell.style.width=nw+'px';cell.style.minWidth=nw+'px';cell.style.maxWidth=nw+'px';});
    const snoW=52;
    const totEl=document.querySelector('.expense-cat-wrap .scp-table th.scp-total');
    const pctEl=document.querySelector('.expense-cat-wrap .scp-table th.scp-pct');
    const catEl=document.querySelector('.expense-cat-wrap .scp-table th.scp-cat');
    const curTotW=totEl?totEl.getBoundingClientRect().width:(S.expenseCategoryTotalWidth||130);
    const curPctW=pctEl?pctEl.getBoundingClientRect().width:(S.expenseCategoryPctWidth||90);
    const leftTotal=snoW,leftPct=snoW+curTotW,leftCat=snoW+curTotW+curPctW;
    document.querySelectorAll('.expense-cat-wrap .scp-table .scp-total').forEach(cell=>{cell.style.left=leftTotal+'px';});
    document.querySelectorAll('.expense-cat-wrap .scp-table .scp-pct').forEach(cell=>{cell.style.left=leftPct+'px';});
    document.querySelectorAll('.expense-cat-wrap .scp-table .scp-cat').forEach(cell=>{cell.style.left=leftCat+'px';});
  }
});
document.addEventListener('mouseup',()=>{
  if(!expenseCatResizeCtx)return;
  const targetClass=expenseCatResizeCtx.target==='total'?'scp-total':expenseCatResizeCtx.target==='pct'?'scp-pct':expenseCatResizeCtx.target==='category'?'scp-cat':'scp-period';
  const el=document.querySelector('.expense-cat-wrap .scp-table th.'+targetClass);
  const nw=el?el.getBoundingClientRect().width:null;
  if(nw){
    if(expenseCatResizeCtx.target==='total')S.expenseCategoryTotalWidth=Math.round(nw);
    else if(expenseCatResizeCtx.target==='pct')S.expenseCategoryPctWidth=Math.round(nw);
    else if(expenseCatResizeCtx.target==='category')S.expenseCategoryCatWidth=Math.round(nw);
    else S.expenseCategoryColWidth=Math.round(nw);
    persistPivotColWidths_();
  }
  expenseCatResizeCtx=null;
  expenseCatResizedRecently=true;
  setTimeout(()=>{expenseCatResizedRecently=false;},0);
  render();
});
</script>

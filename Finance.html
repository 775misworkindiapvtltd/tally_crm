<script>
/* ============================= FINANCE MODULE ============================= */

function renderSalesDashboard(){
  const salesRows=voucherSales_();
  const cur=periodMetrics();
  const byCustomer=topN(salesRows,'partyName','debit',8);
  const maxC=Math.max(1,...byCustomer.map(x=>x.value));
  const fyLabel=selectedFYLabel();

  return `
    <div class="dash-grid">
      <div class="card"><div class="card-top"><span class="card-label">Total Sales</span><div class="card-icon c-green">${NAV_ICONS.sales}</div></div><div class="card-value">${fmtINR(cur.sales)}</div><div class="card-sub">${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Transactions</span><div class="card-icon c-blue">${NAV_ICONS.reports}</div></div><div class="card-value">${salesRows.length}</div><div class="card-sub">sales vouchers — ${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Avg. Ticket Size</span><div class="card-icon c-purple">${NAV_ICONS.collection}</div></div><div class="card-value">${fmtINR(salesRows.length?cur.sales/salesRows.length:0)}</div><div class="card-sub">per voucher — ${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Active Customers</span><div class="card-icon c-teal">${NAV_ICONS.customer}</div></div><div class="card-value">${new Set(salesRows.map(v=>v.partyName)).size}</div><div class="card-sub">billed — ${esc(fyLabel)}</div></div>
    </div>
    <div class="dash-row">
      <div class="panel">
        <div class="panel-title">Sales Trend — ${esc(fyLabel)}</div>
        <div class="panel-body"><div class="chart-wrap"><canvas id="chSalesOnly" data-chart-fallback></canvas></div></div>
      </div>
      <div class="panel">
        <div class="panel-title">Top Customers by Sales — ${esc(fyLabel)}</div>
        <div class="panel-body"><div class="bar-chart">${byCustomer.map(c=>`<div class="bar-item"><div class="b-label" title="${esc(c.label)}">${esc(c.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,c.value/maxC*100)}%;"></div></div><div class="b-val">${fmtINR(c.value)}</div></div>`).join('')||`<div class="empty-state"><div class="big">No sales for the selected financial years</div></div>`}</div></div>
      </div>
    </div>`;
}
registerPage('salesDashboard',renderSalesDashboard);

// Expandable master/detail Sales Report: one MASTER row per unique Invoice No +
// party (from the SALES sheet, see buildSalesReport() in Grids.html), each expandable
// via the ▸/▾ toggle into its own individually filterable/sortable sub-table of raw
// SALES lines (Date/Description/Category/Amount, incl. and excl. GST) — see
// renderSalesReportDetail_() in Grids.html and the `expandable` support added to
// renderGrid() in Common.html. Master rows also surface the linked RECEIVABLES
// Pending Amount/Overdue Days for that invoice when one exists. Plain renderGrid()
// call — same as customerList/vendorList — so hide/unhide columns, resize,
// per-column filter, and sort all come for free from the generic (non-compact) grid
// engine, on BOTH the master table and every expanded sub-table.
// Top toggle button ("Sales"/"Duration") — per explicit user instruction, this now
// lives INSIDE each view's own toolbar row (see toolbarExtra on the salesReport
// GRID_DEF in Grids.html, and inside the bespoke pivot toolbar below) so it renders
// on the SAME single line as the row-count/Refresh/Columns controls, instead of a
// separate row above them. Internal state value stays 'category' for the pivot view
// (only the visible button label changed to "Duration" per explicit request).
function renderSalesReportViewToggle_(){
  const view=S.salesReportView||'sales';
  return `<div class="view-toggle sales-report-view-toggle">
      <button class="${view==='sales'?'active':''}" data-action="sales-report-view" data-view="sales">Sales</button>
      <button class="${view==='category'?'active':''}" data-action="sales-report-view" data-view="category">Duration</button>
    </div>`;
}
function renderSalesReport(){
  const view=S.salesReportView||'sales';
  return view==='category'?renderSalesCategoryPivot():renderGrid('salesReport');
}
registerPage('salesReport',renderSalesReport);

// Duration pivot (label changed from "Category" per explicit user instruction):
// MODE toggle (Monthly/Yearly/Custom Range, all on ONE row) at the top, then a table
// with Total pinned LEFT of a % Amt column (each row's share of the grand total,
// per explicit request "INKE BEENCH MEIN % AMT KA COL ADD KARNA THA" — placed
// between Total and the dimension column), then the dimension column itself
// (Category/Party Name/State — selected via the dropdown, per explicit user request
// "CATEGORY MEIN DROPDOWN AAYE CATEGORY/PARTY NAME/STATE AND AMT USKE ACCORDING
// CHANGE HO"), followed by one column per month/FY/custom-range period. A Total row
// is pinned to the header. Every row/column is sortable/resizable — resizing ANY
// single month/year column resizes ALL of them together (existing behaviour,
// unchanged); Total/%/Dimension keep independent widths. Month column labels are
// short 2-digit years ("Apr 23") and Yearly columns show the full Apr-to-Mar span
// ("2023 (Apr 2023 To Mar 2024)") since a Tally financial year is never Jan-Dec —
// both per explicit user instruction, handled in salesCategoryPeriods_() (Grids.html).
function renderSalesCategoryPivot(){
  const mode=S.salesCategoryMode||'month';
  const dimension=S.salesDimension||'category';
  const dimMeta=SALES_DIMENSION_META[dimension]||SALES_DIMENSION_META.category;

  // Cross-filter: the "other" dimension's multi-select dropdown. If dimension is
  // 'partyName', show a Category filter above; if 'category', show Party Name; etc.
  // Per explicit user instruction ("agar niche party name selected hai to upar ek
  // or dropdown aa jaye category ka, aise hi agar niche category selected hai to
  // upar party name ka dropdown aa jaye...dono dropdown multiselect wale chahiye
  // AND type bhi kar sake").
  const crossDim=dimension==='partyName'?'category':dimension==='category'?'partyName':'category';
  const crossMeta=SALES_DIMENSION_META[crossDim]||SALES_DIMENSION_META.category;
  const crossFilter=S.salesCrossFilter||[];
  const {periods,rows}=buildSalesDimensionPivot_(mode,dimension,crossFilter.length?crossDim:null,crossFilter);
  const sortKey=S.salesCategorySort||'total',sortDir=S.salesCategorySortDir===1?1:-1;
  const sorted=rows.slice().sort((a,b)=>{
    if(sortKey==='dim'){
      const x=a.dimVal.toLowerCase(),y=b.dimVal.toLowerCase();
      if(x<y)return -1*sortDir;if(x>y)return 1*sortDir;return 0;
    }
    if(sortKey==='pct'){ return (a.total-b.total)*sortDir; }
    const x=sortKey==='total'?a.total:(a.periods[sortKey]||0);
    const y=sortKey==='total'?b.total:(b.periods[sortKey]||0);
    return (x-y)*sortDir;
  });
  const grandTotal=rows.reduce((s,r)=>s+r.total,0);
  const periodGrandTotals={};periods.forEach(p=>{periodGrandTotals[p.key]=rows.reduce((s,r)=>s+(r.periods[p.key]||0),0);});
  const pctOf=t=>grandTotal?((t/grandTotal)*100).toFixed(1)+'%':'0.0%';

  // Per explicit user instruction: Monthly/Yearly/Custom Range must all render on
  // ONE row together with the row-count/Refresh/Sales-Duration toggle beneath it —
  // NOT split into separate stacked rows above/below each other.
  // FY multi-select — available for ALL modes (Monthly, Yearly, Custom Range), not
  // just Custom Range, per explicit user instruction ("custom range not working with
  // monthly pls see vo dono ke liye same hai"). Lets the user pick which financial
  // years' data to display regardless of the time-bucketing mode.
  const customFYs=S.salesCategoryCustomFYs||[];
  const allFYs=availableFinancialYears();
  const customFYLabel=customFYs.length?customFYs.map(k=>{const f=financialYearFromKey(k);return f?`${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)}`:k;}).join(', '):'Select Financial Year(s)';
  const fyPickerBtn=`<div class="fy-multi sales-cat-range-multi">
      <button type="button" class="fy-multi-btn" data-action="sales-cat-range-open">${esc(customFYLabel)} <span>▾</span></button>
      ${S.salesCategoryRangeOpen?`<div class="fy-menu sales-cat-range-menu">
        <div class="fy-option fy-all"><label><input type="checkbox" data-action="sales-cat-fy-all" ${customFYs.length===allFYs.length?'checked':''}> <span>Select All</span></label></div>
        ${allFYs.map(f=>`<div class="fy-option"><label><input type="checkbox" data-action="sales-cat-fy-toggle" data-key="${esc(f.key)}" ${customFYs.includes(f.key)?'checked':''}> <span>${f.start.getFullYear()}-${String(f.end.getFullYear()).slice(-2)} (Apr ${f.start.getFullYear()} – Mar ${f.end.getFullYear()})</span></label></div>`).join('')}
      </div>`:''}
    </div>`;
  const modeBar=`<div class="view-toggle sales-cat-mode-toggle">
      <button class="${mode==='month'?'active':''}" data-action="sales-cat-mode" data-mode="month">Monthly</button>
      <button class="${mode==='year'?'active':''}" data-action="sales-cat-mode" data-mode="year">Yearly</button>
      <button class="${mode==='custom'?'active':''}" data-action="sales-cat-mode" data-mode="custom">Custom Range</button>
    </div>
    ${fyPickerBtn}`;

  const totW=S.salesCategoryTotalWidth||130,pctW=S.salesCategoryPctWidth||90,catW=S.salesCategoryCatWidth||210,colW=S.salesCategoryColWidth||110;
  // Left-freeze positions computed from actual column widths (user can resize them,
  // so these can't be hardcoded CSS values) — per explicit user instruction ("ye
  // right scroll mein hide na ho freeze ho jaye").
  const snoW=52,leftTotal=snoW,leftPct=snoW+totW,leftCat=snoW+totW+pctW;
  const sortArrow=k=>sortKey===k?(sortDir===1?'▲':'▼'):'↕';
  // S.No — every other table/grid in the app (Sales Report itself, Customer List,
  // Receivables, etc.) has this as its leftmost column, so it's added here too for
  // the same consistent numbering convention, ahead of Total/%/Dimension.
  const snoTh=`<th class="scp-th scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"><div class="scp-th-inner" style="justify-content:center;cursor:default;">S.No</div></th>`;
  const totalTh=`<th class="scp-th scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;" data-action="sales-cat-sort" data-col="total">
      <div class="scp-th-inner"><span>Total</span><span class="scp-sort-ic">${sortArrow('total')}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="total"></div>
    </th>`;
  const pctTh=`<th class="scp-th scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;" data-action="sales-cat-sort" data-col="pct">
      <div class="scp-th-inner"><span>% Amt</span><span class="scp-sort-ic">${sortArrow('pct')}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="pct"></div>
    </th>`;
  const catTh=`<th class="scp-th scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">
      <div class="scp-th-inner scp-dim-inner">
        <select class="scp-dim-select" data-action="sales-dimension-select" title="Group rows by">
          ${Object.keys(SALES_DIMENSION_META).map(k=>`<option value="${k}" ${dimension===k?'selected':''}>${esc(SALES_DIMENSION_META[k].label)}</option>`).join('')}
        </select>
        <span class="scp-sort-ic" data-action="sales-cat-sort" data-col="dim" title="Sort">${sortArrow('dim')}</span>
      </div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="category"></div>
    </th>`;
  const periodTh=periods.map(p=>`<th class="scp-th scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;" data-action="sales-cat-sort" data-col="${esc(p.key)}">
      <div class="scp-th-inner"><span title="${esc(p.label)}">${esc(p.label)}</span><span class="scp-sort-ic">${sortArrow(p.key)}</span></div>
      <div class="scp-resize" data-action="sales-cat-resize" data-target="period"></div>
    </th>`).join('');

  const totalsRow=`<tr class="scp-totals-row">
      <td class="scp-tot scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;"></td>
      <td class="scp-tot scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;">${fmtNum(grandTotal)}</td>
      <td class="scp-tot scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;">100.0%</td>
      <td class="scp-tot scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">TOTAL</td>
      ${periods.map(p=>`<td class="scp-tot scp-period" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;">${fmtNum(periodGrandTotals[p.key]||0)}</td>`).join('')}
    </tr>`;

  const body=sorted.length?sorted.map((r,idx)=>`<tr>
      <td class="scp-cell scp-sno" style="width:${snoW}px;min-width:${snoW}px;max-width:${snoW}px;left:0;text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;">${idx+1}</td>
      <td class="scp-cell scp-total" style="width:${totW}px;min-width:${totW}px;max-width:${totW}px;left:${leftTotal}px;">${fmtNum(r.total)}</td>
      <td class="scp-cell scp-pct" style="width:${pctW}px;min-width:${pctW}px;max-width:${pctW}px;left:${leftPct}px;">${pctOf(r.total)}</td>
      <td class="scp-cell scp-cat" style="width:${catW}px;min-width:${catW}px;max-width:${catW}px;left:${leftCat}px;">${esc(r.dimVal)}</td>
      ${periods.map(p=>`<td class="scp-cell scp-period${!r.periods[p.key]?' scp-zero':''}" style="width:${colW}px;min-width:${colW}px;max-width:${colW}px;">${r.periods[p.key]?fmtNum(r.periods[p.key]):'—'}</td>`).join('')}
    </tr>`).join(''):`<tr><td colspan="${periods.length+4}"><div class="empty-state"><div class="big">No sales lines for the selected financial year(s)</div></div></td></tr>`;

  // Layout (per explicit user instruction — positions numbered per screenshot):
  // Row 1 (left): Sales / Duration toggle + Monthly / Yearly / Custom Range
  // Row 1 (right): "15 Categories" count + ⟳ Refresh + Columns ▾
  // This swaps positions 1↔2 from the previous layout and keeps 3 directly after
  // the Sales/Duration toggle (all on one thin row, left to right).
  // Cross-filter dropdown — searchable multi-select for the "other" dimension.
  const crossAllValues=salesDimensionValues_(crossDim);
  const crossSearch=(S.salesCrossFilterSearch||'').toLowerCase();
  const crossFiltered=crossSearch?crossAllValues.filter(v=>v.toLowerCase().includes(crossSearch)):crossAllValues;
  const crossLabel=crossFilter.length?`${crossMeta.label}: ${crossFilter.length} selected`:`Filter by ${crossMeta.label}`;
  const crossDropdown=`<div class="fy-multi sales-cross-filter-multi">
      <button type="button" class="fy-multi-btn" data-action="sales-cross-open">${esc(crossLabel)} <span>▾</span></button>
      ${S.salesCrossFilterOpen?`<div class="fy-menu sales-cross-menu">
        <input type="text" class="cross-filter-search" placeholder="Type to search ${crossMeta.label}…" data-action="sales-cross-search" value="${esc(S.salesCrossFilterSearch||'')}">
        <div class="fy-option fy-all"><label><input type="checkbox" data-action="sales-cross-all" ${crossFilter.length===crossAllValues.length?'checked':''}> <span>Select All (${crossAllValues.length})</span></label></div>
        <div class="cross-filter-options">${crossFiltered.map(v=>`<div class="fy-option"><label><input type="checkbox" data-action="sales-cross-toggle" data-val="${esc(v)}" ${crossFilter.includes(v)?'checked':''}> <span>${esc(v)}</span></label></div>`).join('')}</div>
        ${crossFilter.length?`<div class="cross-filter-clear"><button class="btn btn-ghost" data-action="sales-cross-clear" style="padding:4px 10px;font-size:10px;width:100%;">Clear All</button></div>`:''} 
      </div>`:''}
    </div>`;

  const catToolbar=`<div class="dt-toolbar sales-cat-toolbar">
      ${renderSalesReportViewToggle_()}
      ${modeBar}
      ${crossDropdown}
      <div class="report-switcher-right">
        <span class="count">${rows.length} ${esc(dimMeta.plural)}</span>
        <button class="btn btn-ghost" data-action="refreshpage" style="padding:5px 12px;font-size:11.5px;">${S.syncing?'⟳ Refreshing…':'⟳ Refresh'}</button>
      </div>
    </div>`;

  return `${catToolbar}
    <div class="dt-table-wrap sales-cat-wrap">
      <div class="dt-scroll">
        <table class="dt scp-table">
          <thead>
            ${totalsRow}
            <tr>${snoTh}${totalTh}${pctTh}${catTh}${periodTh}</tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>`;
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(el){
    const a=el.getAttribute('data-action');
    if(a==='sales-report-view'){S.salesReportView=el.getAttribute('data-view');render();return;}
    if(a==='sales-cat-mode'){S.salesCategoryMode=el.getAttribute('data-mode');render();return;}
    if(a==='sales-cat-range-open'){S.salesCategoryRangeOpen=!S.salesCategoryRangeOpen;render();return;}
    if(a==='sales-cat-fy-all'){
      const allKeys=availableFinancialYears().map(f=>f.key);
      S.salesCategoryCustomFYs=S.salesCategoryCustomFYs.length===allKeys.length?[]:allKeys.slice();
      render();return;
    }
    if(a==='sales-cat-fy-toggle'){
      const key=el.getAttribute('data-key');
      const idx=S.salesCategoryCustomFYs.indexOf(key);
      if(idx===-1)S.salesCategoryCustomFYs.push(key);else S.salesCategoryCustomFYs.splice(idx,1);
      render();return;
    }
    // Cross-filter dropdown handlers
    if(a==='sales-cross-open'){S.salesCrossFilterOpen=!S.salesCrossFilterOpen;S.salesCrossFilterSearch='';render();return;}
    if(a==='sales-cross-all'){
      const crossDim=(S.salesDimension||'category')==='partyName'?'category':'partyName';
      const allVals=salesDimensionValues_(crossDim);
      S.salesCrossFilter=S.salesCrossFilter.length===allVals.length?[]:allVals.slice();
      render();return;
    }
    if(a==='sales-cross-toggle'){
      const val=el.getAttribute('data-val');
      const idx=S.salesCrossFilter.indexOf(val);
      if(idx===-1)S.salesCrossFilter.push(val);else S.salesCrossFilter.splice(idx,1);
      render();return;
    }
    if(a==='sales-cross-clear'){S.salesCrossFilter=[];render();return;}
    if(a==='sales-cat-sort'){
      // Skip sort if a column resize just completed — the mouseup event from the
      // resize handle bubbles up as a click on the parent <th> which also has
      // data-action="sales-cat-sort", and triggering a sort here would re-render
      // the table and appear to "undo" the resize the user just did.
      if(salesCatResizedRecently)return;
      const col=el.getAttribute('data-col');
      if(S.salesCategorySort===col)S.salesCategorySortDir*=-1;else{S.salesCategorySort=col;S.salesCategorySortDir=col==='dim'?1:-1;}
      render();return;
    }
  }
  // Click-away close for the Custom Range popover and Cross-filter dropdown.
  if(S.salesCategoryRangeOpen&&!e.target.closest('.sales-cat-range-multi')){S.salesCategoryRangeOpen=false;render();}
  if(S.salesCrossFilterOpen&&!e.target.closest('.sales-cross-filter-multi')){S.salesCrossFilterOpen=false;S.salesCrossFilterSearch='';render();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.getAttribute('data-action')==='sales-dimension-select'){
    const v=el.value;
    if(SALES_DIMENSION_META[v]){
      S.salesDimension=v;
      S.salesCrossFilter=[];S.salesCrossFilterOpen=false;S.salesCrossFilterSearch='';
      try{localStorage.setItem('tally_sales_dimension',v);}catch(ignore){}
      render();
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target,a=el.getAttribute('data-action');
  // Cross-filter search — debounced live-filter. Uses the same refocus pattern as
  // ledger-search (save cursor pos → render → find the new input → focus + restore
  // cursor) so typing stays fluid instead of losing focus after every keystroke,
  // per explicit user instruction ("ek keyword type karte hi dusra type nahi hota
  // hai fr se click karo to fr ek type hota hai").
  if(a==='sales-cross-search'){
    S.salesCrossFilterSearch=el.value;
    clearTimeout(S._crossSearchTimer);
    S._crossSearchTimer=setTimeout(()=>{
      const pos=el.selectionStart;
      render();
      const ag=document.querySelector('input[data-action="sales-cross-search"]');
      if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },200);
    return;
  }
  // (Old sales-cat-custom-from/to handlers removed — Custom Range now uses FY
  // multi-select checkboxes instead of date inputs, per explicit user instruction.)
});
// Column-group resize: dragging ANY month/year column resizes ALL of them together
// (per explicit user instruction), while Total/%/Dimension keep independent widths —
// same mousedown/mousemove/mouseup pattern as the generic grid's per-column resize
// in Common.html, just writing into S.salesCategory*Width instead of a per-key map.
let salesCatResizeCtx=null;
let salesCatResizedRecently=false;
document.addEventListener('mousedown',e=>{
  const el=e.target.closest('[data-action="sales-cat-resize"]');if(!el)return;
  const target=el.getAttribute('data-target');const th=el.closest('th');
  salesCatResizeCtx={target,startX:e.clientX,startW:th.getBoundingClientRect().width};
  e.preventDefault();
  e.stopPropagation(); // prevent the sort click on parent <th> from firing
});
document.addEventListener('mousemove',e=>{
  if(!salesCatResizeCtx)return;
  const nw=Math.max(70,Math.round(salesCatResizeCtx.startW+(e.clientX-salesCatResizeCtx.startX)));
  const selector=salesCatResizeCtx.target==='total'?'.scp-total':salesCatResizeCtx.target==='pct'?'.scp-pct':salesCatResizeCtx.target==='category'?'.scp-cat':'.scp-period';
  document.querySelectorAll('.scp-table '+selector).forEach(cell=>{cell.style.width=nw+'px';cell.style.minWidth=nw+'px';cell.style.maxWidth=nw+'px';});
});
document.addEventListener('mouseup',()=>{
  if(!salesCatResizeCtx)return;
  const targetClass=salesCatResizeCtx.target==='total'?'scp-total':salesCatResizeCtx.target==='pct'?'scp-pct':salesCatResizeCtx.target==='category'?'scp-cat':'scp-period';
  const el=document.querySelector('.scp-table th.'+targetClass);
  const nw=el?el.getBoundingClientRect().width:null;
  if(nw){
    if(salesCatResizeCtx.target==='total')S.salesCategoryTotalWidth=Math.round(nw);
    else if(salesCatResizeCtx.target==='pct')S.salesCategoryPctWidth=Math.round(nw);
    else if(salesCatResizeCtx.target==='category')S.salesCategoryCatWidth=Math.round(nw);
    else S.salesCategoryColWidth=Math.round(nw);
  }
  salesCatResizeCtx=null;
  // Flag that a resize just completed — the click event that follows mouseup on the
  // parent <th> must NOT trigger a sort toggle (it would re-render and appear to
  // "reset" the resize). The flag clears after one tick.
  salesCatResizedRecently=true;
  setTimeout(()=>{salesCatResizedRecently=false;},0);
  render();
});
CHART_DEFS['salesDashboard']=function(){
  const months=selectedFYMonths();
  const salesRows=voucherSales_();
  const salesSeries=months.map(m=>sumBy(rowsInCustomRange(salesRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'debit'));
  drawComboChart('chSalesOnly',months.map(m=>m.label),[{label:'Sales',data:salesSeries,color:'#16A34A'}]);
};

function renderExpensesDashboard(){
  const expRows=dataForFY('expense');
  const total=sumBy(expRows,'amount');
  const totalBase=total||1;
  const byCategory=topN(expRows,'subGroup','amount',8);
  const bySubCategory=topN(expRows,'group','amount',8);
  const maxCat=Math.max(1,...byCategory.map(x=>x.value));
  const fyLabel=selectedFYLabel();

  return `
    <div class="dash-grid">
      <div class="card"><div class="card-top"><span class="card-label">Total Expenses</span><div class="card-icon c-red">${NAV_ICONS.wallet}</div></div><div class="card-value">${fmtINR(total)}</div><div class="card-sub">${expRows.length} voucher lines — ${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Categories</span><div class="card-icon c-orange">${NAV_ICONS.reports}</div></div><div class="card-value">${new Set(expRows.map(r=>r.group)).size}</div><div class="card-sub">distinct expense groups</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Largest Category</span><div class="card-icon c-purple">${NAV_ICONS.pl}</div></div><div class="card-value" style="font-size:14px;">${esc(byCategory[0]?byCategory[0].label:'—')}</div><div class="card-sub">${byCategory[0]?fmtINR(byCategory[0].value):''}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Avg per Voucher</span><div class="card-icon c-blue">${NAV_ICONS.collection}</div></div><div class="card-value">${fmtINR(expRows.length?total/expRows.length:0)}</div><div class="card-sub">${esc(fyLabel)}</div></div>
    </div>
    <div class="dash-row">
      <div class="panel">
        <div class="panel-title">Expense by Category — ${esc(fyLabel)}</div>
        <div class="panel-body">${byCategory.map((c,i)=>`
          <div class="mini-cat-row"><span class="mini-cat-dot" style="background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></span><span class="mc-label" title="${esc(c.label)}">${esc(c.label)}</span><div class="mc-track"><div class="mc-fill" style="width:${(c.value/maxCat*100).toFixed(0)}%;background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></div></div><span class="mc-amt">${fmtINR(c.value)}</span><span class="mc-pct">${(c.value/totalBase*100).toFixed(1)}%</span></div>`).join('')||`<div class="empty-state"><div class="big">No expenses for the selected financial years</div></div>`}
          <div class="mini-total-row"><span>Total</span><span>${fmtINR(total)}</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Expense by Sub-Category — ${esc(fyLabel)}</div>
        <div class="panel-body" style="padding:0;">${(()=>{S.expenseSubCategoryRows=bySubCategory.map(c=>Object.assign({},c,{pct:(c.value/total*100).toFixed(1)+'%'}));return renderGrid('expenseSubCategory');})()}</div>
      </div>
    </div>`;
}
registerPage('expensesDashboard',renderExpensesDashboard);

function renderCashFlow(){
  const cur=periodMetrics();
  const receiptRows=dataForFY('receipt');
  const paymentRows=dataForFY('payment');
  const cashPos=cashInHandBank();
  const fyLabel=selectedFYLabel();

  return `
    <div class="dash-grid">
      <div class="card"><div class="card-top"><span class="card-label">Receipt Transactions</span><div class="card-icon c-blue">${NAV_ICONS.cashflow}</div></div><div class="card-value">${receiptRows.length}</div><div class="card-sub">${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Cash In</span><div class="card-icon c-green">${NAV_ICONS['arrow-down']}</div></div><div class="card-value">${fmtINR(cur.collections)}</div><div class="card-sub">receipts — ${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Cash Out</span><div class="card-icon c-red">${NAV_ICONS['arrow-up']}</div></div><div class="card-value">${fmtINR(cur.payments)}</div><div class="card-sub">payments — ${esc(fyLabel)}</div></div>
      <div class="card"><div class="card-top"><span class="card-label">Net Cash Flow</span><div class="card-icon c-purple">${NAV_ICONS.cashflow}</div></div><div class="card-value">${fmtINR(cashPos)}</div><div class="card-sub">${receiptRows.length+paymentRows.length} entries — ${esc(fyLabel)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Cash In vs Cash Out — ${esc(fyLabel)}</div>
      <div class="panel-body"><div class="chart-wrap"><canvas id="chCashFlow6m" data-chart-fallback></canvas></div></div>
    </div>
    <div class="compare-note" style="margin-top:10px;">Cash flow is derived from Receipt/Payment bank ledger legs for the selected financial years (no dedicated Cash/Bank book sheet) — treat as indicative and reconcile against Tally directly for statutory reporting.</div>`;
}
registerPage('cashFlow',renderCashFlow);
CHART_DEFS['cashFlow']=function(){
  const months=selectedFYMonths();
  const receiptRows=dataForFY('receipt');
  const paymentRows=dataForFY('payment');
  const inflow=months.map(m=>sumBy(rowsInCustomRange(receiptRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'debitLedgerAmount'));
  const outflow=months.map(m=>sumBy(rowsInCustomRange(paymentRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'creditLedgerAmount'));
  drawComboChart('chCashFlow6m',months.map(m=>m.label),[{label:'Cash In',data:inflow,color:'#16A34A'},{label:'Cash Out',data:outflow,color:'#E23A3A'}]);
};

function renderProfitLoss(){
  const cur=periodMetrics();
  const grossProfit=cur.sales-cur.purchase;
  const netProfit=grossProfit-cur.expense;
  const expByCategory=topN(dataForFY('expense'),'subGroup','amount',20);
  const fyLabel=selectedFYLabel();

  return `
    <div class="simple-panel">
      <h3 style="margin-bottom:14px;font-size:15px;">Profit &amp; Loss Statement — ${esc(fyLabel)}</h3>
      <div class="kv-grid" style="grid-template-columns:1fr;max-width:520px;">
        <div class="kv-row"><span class="k">Sales</span><span class="v">${fmtINR(cur.sales)}</span></div>
        <div class="kv-row"><span class="k">Less: Purchases</span><span class="v">${fmtINR(cur.purchase)}</span></div>
        <div class="kv-row" style="font-weight:700;"><span class="k">Gross Profit</span><span class="v">${fmtINR(grossProfit)}</span></div>
        ${expByCategory.map(c=>`<div class="kv-row"><span class="k">Less: ${esc(c.label)}</span><span class="v">${fmtINR(c.value)}</span></div>`).join('')}
        <div class="kv-row" style="font-weight:700;border-top:2px solid var(--ink);"><span class="k">Net Profit</span><span class="v" style="color:${netProfit>=0?'var(--success)':'var(--danger)'};">${fmtINR(netProfit)}</span></div>
      </div>
    </div>`;
}
registerPage('profitLoss',renderProfitLoss);

function renderBalanceSheet(){
  const totalRecv=outstandingReceivable();
  const totalPay=outstandingPayable();
  const cashPos=cashInHandBank();
  const totalAssets=totalRecv+Math.max(0,cashPos);
  const totalLiabilities=totalPay+Math.max(0,-cashPos);
  const equity=totalAssets-totalLiabilities;
  const fyLabel=selectedFYLabel();
  return `
    <div class="dash-row" style="grid-template-columns:1fr 1fr;">
      <div class="simple-panel">
        <h3 style="margin-bottom:14px;font-size:14px;">Assets — ${esc(fyLabel)}</h3>
        <div class="kv-grid" style="grid-template-columns:1fr;">
          <div class="kv-row"><span class="k">Cash &amp; Bank</span><span class="v">${fmtINR(Math.max(0,cashPos))}</span></div>
          <div class="kv-row"><span class="k">Sundry Debtors (Receivables)</span><span class="v">${fmtINR(totalRecv)}</span></div>
          <div class="kv-row" style="font-weight:700;border-top:2px solid var(--ink);"><span class="k">Total Assets</span><span class="v">${fmtINR(totalAssets)}</span></div>
        </div>
      </div>
      <div class="simple-panel">
        <h3 style="margin-bottom:14px;font-size:14px;">Liabilities &amp; Equity — ${esc(fyLabel)}</h3>
        <div class="kv-grid" style="grid-template-columns:1fr;">
          <div class="kv-row"><span class="k">Sundry Creditors (Payables)</span><span class="v">${fmtINR(totalPay)}</span></div>
          <div class="kv-row"><span class="k">Bank Overdraft</span><span class="v">${fmtINR(Math.max(0,-cashPos))}</span></div>
          <div class="kv-row" style="font-weight:700;"><span class="k">Total Liabilities</span><span class="v">${fmtINR(totalLiabilities)}</span></div>
          <div class="kv-row" style="font-weight:700;border-top:2px solid var(--ink);"><span class="k">Capital / Equity (Balancing figure)</span><span class="v">${fmtINR(equity)}</span></div>
        </div>
      </div>
    </div>
    <div class="compare-note" style="margin-top:10px;">Indicative selected-FY view only — built from Receivables/Payables/derived cash flow, not a full trial balance. For statutory Balance Sheet, use Tally directly.</div>`;
}
registerPage('balanceSheet',renderBalanceSheet);

</script>

<script>
/* ============================= DASHBOARD DATA HELPERS =============================
 * See Code.gs header comment "NOTE ON ASSUMPTIONS" for how Sales/Collections/Payments
 * are derived from the Balance/Receipt/PAYMENT tabs (there is no dedicated Sales
 * register sheet in the source spreadsheet).
 */
function sumBy(arr,key){ return arr.reduce((s,r)=>s+(Number(r[key])||0),0); }
function rowsInCustomRange(arr,dateKey,from,to){ return arr.filter(r=>inRange(r[dateKey],from,to)); }

function voucherSales_(from,to){ return dataForFY('balanceVouchers').filter(v=>/sale/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }
function voucherPurchase_(from,to){ return dataForFY('balanceVouchers').filter(v=>/purchase/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }
function voucherCreditNote_(from,to){ return dataForFY('balanceVouchers').filter(v=>/credit\s*note/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }

function periodMetrics(){
  const sales=sumBy(voucherSales_(),'debit');
  const purchase=sumBy(voucherPurchase_(),'debit');
  const expense=sumBy(dataForFY('expense'),'amount');
  const collections=sumBy(dataForFY('receipt'),'debitLedgerAmount');
  const payments=sumBy(dataForFY('payment'),'creditLedgerAmount');
  const netProfit=sales-expense-purchase;
  return {sales,purchase,expense,collections,payments,netProfit};
}

function outstandingReceivable(){ return sumBy(dataForFY('receivables'),'pendingAmount'); } // RECEIVABLES sheet, column K
function outstandingPayable(){ return sumBy(dataForFY('payables'),'closingBalance'); }
// Total Sales — per user instruction, read from the dedicated SALES sheet, column M
// (column N holds product category, reserved for a future category breakdown). This
// sheet has no date column as described, so there's no period comparison for it yet.
function totalSalesFromSalesSheet(){ return sumBy(dataForFY('sales'),'amount'); }
function cashInHandBank(){
  // Receipt ledger inflow minus payment ledger outflow for the selected financial years.
  return sumBy(dataForFY('receipt'),'debitLedgerAmount')-sumBy(dataForFY('payment'),'creditLedgerAmount');
}
// Dashboard chart cards use whole rupees, matching the reference's compact absolute
// figures. This is formatting only; stored/calculated values retain their precision.
function fmtINRChart(n){ return fmtINR(Math.round(Number(n)||0)).replace(/\.00$/,''); }

// Dashboard cash-flow card: uses the same Receipt/PAYMENT ledger legs as the full
// Cash Flow page. For the selected FY, Opening Balance is the net ledger movement
// before the displayed month; Closing Balance is always Opening + Cash In - Cash Out.
// If today is outside the selected FY, the card uses that FY's final month so the
// selected-filter result stays meaningful instead of silently mixing financial years.
// Uses the same SALES (date/amount) and EXPENSE trend (date/amount) series as the
// original Sales vs Expenses chart. Keeping this in one helper lets the fixed
// right-side value card and the Chart.js canvas always display identical amounts.
function dashboardTrendData_(){
  const months=selectedFYMonths();
  const salesRows=dataForFY('sales');
  const expenseTrendRows=dataForFY('expenseTrend');
  const sales=months.map(m=>sumBy(rowsInCustomRange(salesRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'amount'));
  const expenses=months.map(m=>sumBy(rowsInCustomRange(expenseTrendRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'amount'));
  return {months,sales,expenses,profit:sales.map((value,i)=>value-(expenses[i]||0))};
}

function dashboardCashFlowMTD_(){
  const months=selectedFYMonths();
  const now=new Date();
  const activeMonth=months.find(m=>m.y===now.getFullYear()&&m.m===now.getMonth())||months[months.length-1];
  if(!activeMonth)return {opening:0,cashIn:0,cashOut:0,closing:0,net:0,label:''};
  const start=new Date(activeMonth.y,activeMonth.m,1).getTime();
  const isCurrentMonth=activeMonth.y===now.getFullYear()&&activeMonth.m===now.getMonth();
  const end=(isCurrentMonth?new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59):new Date(activeMonth.y,activeMonth.m+1,0,23,59,59)).getTime();
  const receipts=dataForFY('receipt'),payments=dataForFY('payment');
  const sumBefore=(rows,key)=>rows.reduce((total,row)=>{const t=parseDT(row.date);return t!==null&&t<start?total+(Number(row[key])||0):total;},0);
  const sumMTD=(rows,key)=>rows.reduce((total,row)=>{const t=parseDT(row.date);return t!==null&&t>=start&&t<=end?total+(Number(row[key])||0):total;},0);
  const opening=sumBefore(receipts,'debitLedgerAmount')-sumBefore(payments,'creditLedgerAmount');
  const cashIn=sumMTD(receipts,'debitLedgerAmount');
  const cashOut=sumMTD(payments,'creditLedgerAmount');
  const net=cashIn-cashOut;
  return {opening,cashIn,cashOut,closing:opening+net,net,label:activeMonth.label};
}

function topN(arr,groupKey,amtKey,n){
  const map={};
  arr.forEach(r=>{ const k=r[groupKey]||'Unknown'; map[k]=(map[k]||0)+(Number(r[amtKey])||0); });
  return Object.keys(map).map(k=>({label:k,value:map[k]})).sort((a,b)=>b.value-a.value).slice(0,n);
}

function ageingBuckets(rows,amtKey){
  const buckets={'0-30':0,'31-60':0,'61-90':0,'90+':0};
  rows.forEach(r=>{
    const d=Number(r.overdueDays)||0; const amt=Number(r[amtKey])||0;
    if(d<=30)buckets['0-30']+=amt; else if(d<=60)buckets['31-60']+=amt; else if(d<=90)buckets['61-90']+=amt; else buckets['90+']+=amt;
  });
  return buckets;
}

// Calendar-day difference between a date value and TODAY (both taken at midnight,
// so time-of-day never matters). A due date of today correctly returns 0, not a
// small negative number — this is what makes "Upcoming Due This Week" include today.
function daysUntil(dateVal){
  const t=parseDT(dateVal); if(t===null) return null;
  const now=new Date();
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  return Math.round((t-todayStart)/86400000);
}
function mrDateFull_(v){ const t=parseDT(v); return t===null?(v||'—'):fmtDDMMMYYYY(new Date(t)); } // "31 May 2025"
function mrDateShort_(v){ const t=parseDT(v); return t===null?(v||'—'):fmtDDMMM(new Date(t)); } // "01 Jun"
const MINI_IC_ARROW_DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>';
const MINI_IC_CALENDAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

function statusForDueDate(dueDateVal,overdueDays){
  const d=Number(overdueDays)||0;
  if(d>0) return {cls:'overdue',label:'Overdue'};
  const t=parseDT(dueDateVal); if(t===null) return {cls:'current',label:'Current'};
  const daysLeft=Math.round((t-Date.now())/86400000);
  if(daysLeft<=7) return {cls:'due-soon',label:'Due Soon'};
  return {cls:'current',label:'Current'};
}

/* ============================= DASHBOARD RENDER ============================= */
function renderDashboard(){
  const cur=periodMetrics();
  const fyLabel=selectedFYLabel();

  const totalRecv=outstandingReceivable(), totalPay=outstandingPayable(), cashPos=cashInHandBank();
  const totalSales=totalSalesFromSalesSheet();
  const overdueRecvRows=dataForFY('receivables').filter(r=>Number(r.overdueDays)>0);
  const overduePayRows=dataForFY('payables').filter(r=>Number(r.overdueDays)>0);
  const custSt=tableState('topCustomersDash'),vendSt=tableState('topVendorsDash');
  if(!custSt.sort){custSt.sort='value';custSt.dir=-1;}
  if(!vendSt.sort){vendSt.sort='value';vendSt.dir=-1;}

  // "vs previous period" comparison chips removed along with the Date Range/Compare UI
  // (there is no period to compare against anymore) — cards now show plain totals.
  const kpis=[
    {label:'Total Sales',value:totalSales,icon:'sales',cls:'c-green',page:'salesDashboard'},
    {label:'Total Expenses',value:cur.expense,icon:'wallet',cls:'c-orange',page:'expensesDashboard'},
    {label:'Total Receivables',value:totalRecv,icon:'in',cls:'c-blue',page:'recvDashboard'},
    {label:'Outstanding Payables',value:totalPay,icon:'out',cls:'c-red',page:'payDashboard'},
    {label:'Collections',value:cur.collections,icon:'collection',cls:'c-teal',page:'collectionAnalysis'},
    {label:'Payments',value:cur.payments,icon:'arrow-up',cls:'c-purple',page:'payDashboard'},
    {label:'Net Profit',value:cur.netProfit,icon:'pl',cls:'c-indigo',page:'profitLoss'},
    {label:'Cash in Hand / Bank',value:cashPos,icon:'cashflow',cls:'c-blue',page:'cashFlow'},
  ];

  const kpiCards=kpis.map(k=>{
    return `<div class="card" data-action="goto" data-page="${k.page}">
      <div class="card-top"><span class="card-label">${esc(k.label)}</span><div class="card-icon ${k.cls}">${NAV_ICONS[k.icon]}</div></div>
      <div class="card-value">${fmtINR(k.value)}</div>
    </div>`;
  }).join('');

  const recvAge=ageingBuckets(dataForFY('receivables'),'pendingAmount');
  const payAge=ageingBuckets(dataForFY('payables'),'closingBalance');
  const trendData=dashboardTrendData_();
  const trendLast=Math.max(0,trendData.months.length-1);
  const trendLatest={label:trendData.months[trendLast]?trendData.months[trendLast].label:'—',sales:trendData.sales[trendLast]||0,expenses:trendData.expenses[trendLast]||0,profit:trendData.profit[trendLast]||0};
  // Presentation-only percentages for the reference-style ageing legends. The base
  // values and their Total Outstanding calculations stay exactly as before.
  const recvAgeBase=totalRecv||1, payAgeBase=totalPay||1;
  const cashFlowMtd=dashboardCashFlowMTD_();
  const cashFlowMax=Math.max(1,Math.abs(cashFlowMtd.opening),cashFlowMtd.cashIn,cashFlowMtd.cashOut,Math.abs(cashFlowMtd.closing));
  const ageColors=['#2E6BF2','#16A34A','#F08A1D','#E23A3A'];

  // Keep all party aggregates in the dashboard state so sorting and the full reports
  // remain data-complete. The mini-report grid applies its own presentation-only row
  // limit to match the fixed no-scroll dashboard layout.
  const recvRowsAll=dataForFY('receivables'), payRowsAll=dataForFY('payables');
  // dueDate here doubles as the "Last Receipt"/"Last Payment" column in the mini
  // report below (taken from that party's most-overdue/most-recent bill) — same
  // approximation the app has always used, unchanged calculation logic.
  const topCustomers=topN(recvRowsAll,'partyName','pendingAmount',9999).map(t=>{
    const row=recvRowsAll.filter(r=>r.partyName===t.label).sort((a,b)=>b.overdueDays-a.overdueDays)[0];
    return Object.assign({},t,{overdueDays:row?Number(row.overdueDays)||0:0,dueDate:row?row.dueDate:''});
  });
  const topVendors=topN(payRowsAll,'partyName','closingBalance',9999).map(t=>{
    const row=payRowsAll.filter(r=>r.partyName===t.label).sort((a,b)=>b.overdueDays-a.overdueDays)[0];
    return Object.assign({},t,{overdueDays:row?Number(row.overdueDays)||0:0,dueDate:row?row.dueDate:''});
  });
  const expenseByCategory=topN(dataForFY('expense'),'subGroup','amount',6);
  const expenseTotal=sumBy(dataForFY('expense'),'amount');
  const expenseTotalBase=expenseTotal||1;
  const maxExpCat=Math.max(1,...expenseByCategory.map(x=>x.value));

  const recentReceipts=dataForFY('receipt').slice().sort((a,b)=>(parseDT(b.date)||0)-(parseDT(a.date)||0)).slice(0,5);

  // Due today through the next 7 days — daysUntil() compares calendar days (not
  // exact milliseconds), so a bill due TODAY always returns 0 and is correctly
  // included here (previously it could be excluded depending on the time of day).
  const dueThisWeek=dataForFY('receivables').filter(r=>{
    const days=daysUntil(r.dueDate); if(days===null) return false;
    return days>=0 && days<=7;
  }).sort((a,b)=>(parseDT(a.dueDate)||0)-(parseDT(b.dueDate)||0)).slice(0,5);

  // Sales Topline donut: break Total Sales down by the SALES sheet's column-N category
  // if categories are present; otherwise fall back to the documented 70/24/6 estimate.
  const salesByCategory=topN(dataForFY('sales'),'category','amount',6);
  const useRealCategories=salesByCategory.length>0;
  const domesticSales=totalSales*0.7, exportSales=totalSales*0.24, otherIncome=totalSales*0.06; // fallback estimate, see README

  return `
    ${renderFilterBar()}

    <div class="kpi-strip">${kpiCards}</div>

    <div class="dashboard-chart-grid">
      <div class="panel dashboard-chart-card dashboard-sales-card">
        <div class="panel-title">Sales vs Expenses Trend <span class="chart-title-actions"><span class="chart-info" title="Monthly Sales, Expenses and Profit">ⓘ</span><span class="chart-period">Monthly⌄</span></span></div>
        <div class="panel-body dashboard-chart-body"><div class="chart-wrap dashboard-sales-chart"><canvas id="chSalesTrend" data-chart-fallback></canvas><div class="dashboard-trend-value-card" aria-label="Latest monthly Sales, Expenses and Profit"><div class="trend-value-month">${esc(trendLatest.label)}</div><div class="trend-value-row"><span class="trend-value-dot sales"></span><span>Sales</span><b>${fmtINRChart(trendLatest.sales)}</b></div><div class="trend-value-row"><span class="trend-value-dot expenses"></span><span>Expenses</span><b>${fmtINRChart(trendLatest.expenses)}</b></div><div class="trend-value-row"><span class="trend-value-dot profit"></span><span>Profit</span><b>${fmtINRChart(trendLatest.profit)}</b></div></div></div></div>
      </div>
      <div class="panel dashboard-chart-card dashboard-ageing-card">
        <div class="panel-title">Receivable Ageing <span class="chart-title-actions"><span class="chart-title-sub">(Outstanding)</span><span class="chart-info" title="Outstanding receivables grouped by overdue days">ⓘ</span></span></div>
        <div class="panel-body dashboard-ageing-body">
          <div class="chart-wrap dashboard-donut"><canvas id="chRecvAge" data-chart-fallback></canvas></div>
          <div class="donut-legend dashboard-donut-legend">
            ${Object.keys(recvAge).map((k,i)=>`<div class="dl-row"><span class="dl-dot" style="background:${ageColors[i]};"></span><span class="dl-detail"><span class="dl-label">${esc(k.replace('-',' - '))} Days</span><span class="dl-metric">${fmtINRChart(recvAge[k])} <span class="dl-pct">(${(recvAge[k]/recvAgeBase*100).toFixed(0)}%)</span></span></span></div>`).join('')}
          </div>
        </div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINRChart(totalRecv)}</span></div>
      </div>
      <div class="panel dashboard-chart-card dashboard-ageing-card">
        <div class="panel-title">Payable Ageing <span class="chart-title-actions"><span class="chart-title-sub">(Outstanding)</span><span class="chart-info" title="Outstanding payables grouped by overdue days">ⓘ</span></span></div>
        <div class="panel-body dashboard-ageing-body">
          <div class="chart-wrap dashboard-donut"><canvas id="chPayAge" data-chart-fallback></canvas></div>
          <div class="donut-legend dashboard-donut-legend">
            ${Object.keys(payAge).map((k,i)=>`<div class="dl-row"><span class="dl-dot" style="background:${ageColors[i]};"></span><span class="dl-detail"><span class="dl-label">${esc(k.replace('-',' - '))} Days</span><span class="dl-metric">${fmtINRChart(payAge[k])} <span class="dl-pct">(${(payAge[k]/payAgeBase*100).toFixed(0)}%)</span></span></span></div>`).join('')}
          </div>
        </div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINRChart(totalPay)}</span></div>
      </div>
      <div class="panel dashboard-chart-card dashboard-cashflow-card">
        <div class="panel-title">Cash Flow (MTD) <span class="chart-info" title="${esc(cashFlowMtd.label)}: Receipt ledger inflow less PAYMENT ledger outflow">ⓘ</span></div>
        <div class="panel-body dashboard-cashflow-body">
          <div class="cashflow-list dashboard-cashflow-list">
            <div class="cf-item"><span class="cf-label">Opening Balance</span><div class="cf-track"><div class="cf-fill blue" style="width:${Math.abs(cashFlowMtd.opening)/cashFlowMax*100}%;"></div></div><span class="cf-val">${fmtINRChart(cashFlowMtd.opening)}</span></div>
            <div class="cf-item"><span class="cf-label">Cash In (Receipts)</span><div class="cf-track"><div class="cf-fill green" style="width:${cashFlowMtd.cashIn/cashFlowMax*100}%;"></div></div><span class="cf-val pos">+ ${fmtINRChart(cashFlowMtd.cashIn)}</span></div>
            <div class="cf-item"><span class="cf-label">Cash Out (Payments)</span><div class="cf-track"><div class="cf-fill red" style="width:${cashFlowMtd.cashOut/cashFlowMax*100}%;"></div></div><span class="cf-val neg">- ${fmtINRChart(cashFlowMtd.cashOut)}</span></div>
            <div class="cf-item cashflow-closing"><span class="cf-label">Closing Balance</span><div class="cf-track"><div class="cf-fill blue" style="width:${Math.abs(cashFlowMtd.closing)/cashFlowMax*100}%;"></div></div><span class="cf-val">${fmtINRChart(cashFlowMtd.closing)}</span></div>
          </div>
          <div class="cf-net"><span class="lbl">Net Cash Flow</span><span class="val ${cashFlowMtd.net<0?'neg':''}">${cashFlowMtd.net>=0?'+':''}${fmtINRChart(cashFlowMtd.net)}</span></div>
        </div>
      </div>
    </div>

    <div class="dash-row3">
      <div class="rpt-panel rpt-panel--fixed">
        <div class="rpt-panel-title">Top Customers by Outstanding <a data-action="goto" data-page="customerList">View All</a></div>
        <div class="rpt-panel-body">${(()=>{
          if(S.syncing&&!recvRowsAll.length) return `<div class="empty-state" style="padding:50px 20px;"><div class="spinner" style="margin:0 auto 12px;"></div><div class="big">Loading receivables…</div></div>`;
          S.dashTopCustomers=topCustomers;return renderGrid('topCustomersDash');
        })()}</div>
        <div class="rpt-panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalRecv)}</span></div>
      </div>
      <div class="rpt-panel rpt-panel--fixed">
        <div class="rpt-panel-title">Top Vendors by Payable <a data-action="goto" data-page="vendorList">View All</a></div>
        <div class="rpt-panel-body">${(()=>{
          if(S.syncing&&!payRowsAll.length) return `<div class="empty-state" style="padding:50px 20px;"><div class="spinner" style="margin:0 auto 12px;"></div><div class="big">Loading payables…</div></div>`;
          S.dashTopVendors=topVendors;return renderGrid('topVendorsDash');
        })()}</div>
        <div class="rpt-panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalPay)}</span></div>
      </div>
      <div class="rpt-panel rpt-panel--fixed">
        <div class="rpt-panel-title">Expense by Category — ${esc(fyLabel)} <a data-action="goto" data-page="expensesDashboard">View All</a></div>
        <div class="rpt-panel-body">${(()=>{
          S.dashExpenseByCategory=expenseByCategory.map((c,i)=>({label:c.label,value:c.value,pctNum:c.value/expenseTotalBase*100,pct:(c.value/expenseTotalBase*100).toFixed(1)+'%',color:CHART_PALETTE[i%CHART_PALETTE.length]}));
          return renderGrid('expenseCategoryDash');
        })()}</div>
        <div class="rpt-panel-foot"><span>Total</span><span>${fmtINR(expenseTotal)}</span></div>
      </div>
    </div>

    <div class="dash-row4">
      <div class="panel">
        <div class="panel-title">Recent Receipts <a data-action="goto" data-page="receipt">View All</a></div>
        <div class="panel-body mr-list-body">
          ${recentReceipts.length?recentReceipts.map(r=>`
            <div class="mr-row">
              <span class="mr-ic mr-ic-recv">${MINI_IC_ARROW_DOWN}</span>
              <span class="mr-date">${esc(mrDateShort_(r.date))}</span>
              <span class="mr-name" title="${esc(r.bankPartyName||r.creditLedgerName)}">${esc(r.bankPartyName||r.creditLedgerName)}</span>
              <span class="mr-amt">${fmtINR(r.debitLedgerAmount||r.creditLedgerAmount)}</span>
              <span class="mr-badge">${esc(r.transactionType||'—')}</span>
            </div>`).join(''):`<div class="empty-state"><div class="big">No receipts yet</div></div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Upcoming Due This Week <span class="pt-info" title="Includes bills due today through the next 7 days">ⓘ</span><a data-action="goto" data-page="followUpList">View All</a></div>
        <div class="panel-body mr-list-body">
          ${dueThisWeek.length?dueThisWeek.map(r=>{
            const days=daysUntil(r.dueDate);
            const daysLabel=days===0?'Today':days+' Days';
            return `<div class="mr-row">
              <span class="mr-ic mr-ic-due">${MINI_IC_CALENDAR}</span>
              <span class="mr-date">${esc(mrDateShort_(r.dueDate))}</span>
              <span class="mr-name" title="${esc(r.partyName)}">${esc(r.partyName)}</span>
              <span class="mr-amt">${fmtINR(r.pendingAmount)}</span>
              <span class="mr-days">${esc(daysLabel)}</span>
            </div>`;
          }).join(''):`<div class="empty-state"><div class="big">Nothing due 🎉</div></div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Sales Topline${useRealCategories?' by Category':''} — ${esc(fyLabel)}</div>
        <div class="panel-body" style="display:flex;flex-direction:column;align-items:center;">
          <div class="chart-wrap donut"><canvas id="chSalesTopline" data-chart-fallback></canvas></div>
        </div>
        <div class="panel-foot"><span>Total Sales</span><span>${fmtINR(totalSales)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Quick Actions</div>
        <div class="panel-body">
          <div class="qa-grid">
            <div class="qa-btn" data-action="goto" data-page="receipt"><span class="qa-ic c-green" style="background:var(--green-tint);color:var(--green);">${NAV_ICONS['arrow-down']}</span><span class="qa-txt">Record Receipt</span></div>
            <div class="qa-btn" data-action="goto" data-page="payment"><span class="qa-ic" style="background:var(--red-tint);color:var(--red);">${NAV_ICONS['arrow-up']}</span><span class="qa-txt">Record Payment</span></div>
            <div class="qa-btn" data-action="goto" data-page="expense"><span class="qa-ic" style="background:var(--orange-tint);color:var(--orange);">${NAV_ICONS.wallet}</span><span class="qa-txt">Add Expense</span></div>
            <div class="qa-btn" data-action="goto" data-page="customerList"><span class="qa-ic" style="background:var(--blue-tint);color:var(--blue);">${NAV_ICONS.customer}</span><span class="qa-txt">Customer Follow-up</span></div>
            <div class="qa-btn" data-action="goto" data-page="vendorList"><span class="qa-ic" style="background:var(--purple-tint);color:var(--purple);">${NAV_ICONS.customer}</span><span class="qa-txt">Vendor Follow-up</span></div>
            <div class="qa-btn" data-action="goto" data-page="creditNotes"><span class="qa-ic" style="background:var(--teal-tint);color:var(--teal);">${NAV_ICONS.creditnote}</span><span class="qa-txt">Credit Note</span></div>
            <div class="qa-btn" data-action="goto" data-page="ledger"><span class="qa-ic" style="background:var(--indigo-tint);color:var(--indigo);">${NAV_ICONS.book}</span><span class="qa-txt">Bank Reconcile</span></div>
            <div class="qa-btn" data-action="goto" data-page="ledger"><span class="qa-ic" style="background:var(--gold-tint);color:var(--gold);">${NAV_ICONS.book}</span><span class="qa-txt">Email Statement</span></div>
            <div class="qa-btn" data-action="goto" data-page="reports"><span class="qa-ic" style="background:var(--blue-tint);color:var(--blue);">${NAV_ICONS.reports}</span><span class="qa-txt">Reports</span></div>
          </div>
        </div>
      </div>
    </div>
  `;
}
registerPage('dashboard',renderDashboard);

CHART_DEFS['dashboard']=function(){
  const trendData=dashboardTrendData_();
  const months=trendData.months;
  const salesTrendSeries=trendData.sales;
  const expenseTrendSeries=trendData.expenses;
  const profitTrendSeries=trendData.profit;
  // Screenshot-matched dashboard chart: Sales and Expenses retain their existing
  // monthly series as bars; Profit is the derived Sales minus Expenses line on the
  // same rupee axis, with absolute INR values in the right-side hover card.
  drawComboChart('chSalesTrend',months.map(m=>m.label),
    [{label:'Sales',data:salesTrendSeries,color:'#16A34A'},{label:'Expenses',data:expenseTrendSeries,color:'#E23A3A'}],
    {label:'Profit',data:profitTrendSeries,color:'#2E6BF2',sameAxis:true},{overview:true});

  const recvAge=ageingBuckets(dataForFY('receivables'),'pendingAmount');
  const payAge=ageingBuckets(dataForFY('payables'),'closingBalance');
  drawDonutChart('chRecvAge',Object.keys(recvAge),Object.values(recvAge),['#2E6BF2','#16A34A','#F08A1D','#E23A3A']);
  drawDonutChart('chPayAge',Object.keys(payAge),Object.values(payAge),['#2E6BF2','#16A34A','#F08A1D','#E23A3A']);

  const salesByCategory=topN(dataForFY('sales'),'category','amount',6);
  if(salesByCategory.length){
    drawDonutChart('chSalesTopline',salesByCategory.map(c=>c.label),salesByCategory.map(c=>c.value),CHART_PALETTE);
  } else {
    const totalSales=totalSalesFromSalesSheet();
    const domesticSales=totalSales*0.7, exportSales=totalSales*0.24, otherIncome=totalSales*0.06;
    drawDonutChart('chSalesTopline',['Domestic Sales','Export Sales','Other Income'],[domesticSales,exportSales,otherIncome],['#2E6BF2','#16A34A','#F08A1D']);
  }
};
</script>

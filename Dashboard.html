<script>
/* ============================= DASHBOARD DATA HELPERS =============================
 * See Code.gs header comment "NOTE ON ASSUMPTIONS" for how Sales/Collections/Payments
 * are derived from the Balance/Receipt/PAYMENT tabs (there is no dedicated Sales
 * register sheet in the source spreadsheet).
 */
function sumBy(arr,key){ return arr.reduce((s,r)=>s+(Number(r[key])||0),0); }
function rowsInCustomRange(arr,dateKey,from,to){ return arr.filter(r=>inRange(r[dateKey],from,to)); }

function voucherSales_(from,to){ return dataForFY('balanceVouchers').filter(v=>/sale/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }
function voucherPurchase_(from,to){ return dataForFY('balanceVouchers').filter(v=>/purchase/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }
function voucherCreditNote_(from,to){ return dataForFY('balanceVouchers').filter(v=>/credit\s*note/i.test(v.voucherType||'')&&(!from||inRange(v.date,from,to))); }

function periodMetrics(){
  const sales=sumBy(voucherSales_(),'debit');
  const purchase=sumBy(voucherPurchase_(),'debit');
  const expense=sumBy(dataForFY('expense'),'amount');
  const collections=sumBy(dataForFY('receipt'),'debitLedgerAmount');
  const payments=sumBy(dataForFY('payment'),'creditLedgerAmount');
  const netProfit=sales-expense-purchase;
  return {sales,purchase,expense,collections,payments,netProfit};
}

function outstandingReceivable(){ return sumBy(dataForFY('receivables'),'pendingAmount'); } // RECEIVABLES sheet, column K
function outstandingPayable(){ return sumBy(dataForFY('payables'),'closingBalance'); }
// Total Sales — per user instruction, read from the dedicated SALES sheet, column M
// (column N holds product category, reserved for a future category breakdown). This
// sheet has no date column as described, so there's no period comparison for it yet.
function totalSalesFromSalesSheet(){ return sumBy(dataForFY('sales'),'amount'); }
function cashInHandBank(){
  // Receipt ledger inflow minus payment ledger outflow for the selected financial years.
  return sumBy(dataForFY('receipt'),'debitLedgerAmount')-sumBy(dataForFY('payment'),'creditLedgerAmount');
}

function topN(arr,groupKey,amtKey,n){
  const map={};
  arr.forEach(r=>{ const k=r[groupKey]||'Unknown'; map[k]=(map[k]||0)+(Number(r[amtKey])||0); });
  return Object.keys(map).map(k=>({label:k,value:map[k]})).sort((a,b)=>b.value-a.value).slice(0,n);
}

function ageingBuckets(rows,amtKey){
  const buckets={'0-30':0,'31-60':0,'61-90':0,'90+':0};
  rows.forEach(r=>{
    const d=Number(r.overdueDays)||0; const amt=Number(r[amtKey])||0;
    if(d<=30)buckets['0-30']+=amt; else if(d<=60)buckets['31-60']+=amt; else if(d<=90)buckets['61-90']+=amt; else buckets['90+']+=amt;
  });
  return buckets;
}

function statusForDueDate(dueDateVal,overdueDays){
  const d=Number(overdueDays)||0;
  if(d>0) return {cls:'overdue',label:'Overdue'};
  const t=parseDT(dueDateVal); if(t===null) return {cls:'current',label:'Current'};
  const daysLeft=Math.round((t-Date.now())/86400000);
  if(daysLeft<=7) return {cls:'due-soon',label:'Due Soon'};
  return {cls:'current',label:'Current'};
}

/* ============================= DASHBOARD RENDER ============================= */
function renderDashboard(){
  const cur=periodMetrics();
  const fyLabel=selectedFYLabel();

  const totalRecv=outstandingReceivable(), totalPay=outstandingPayable(), cashPos=cashInHandBank();
  const totalSales=totalSalesFromSalesSheet();
  const overdueRecvRows=dataForFY('receivables').filter(r=>Number(r.overdueDays)>0);
  const overduePayRows=dataForFY('payables').filter(r=>Number(r.overdueDays)>0);

  // "vs previous period" comparison chips removed along with the Date Range/Compare UI
  // (there is no period to compare against anymore) — cards now show plain totals.
  const kpis=[
    {label:'Total Sales',value:totalSales,icon:'sales',cls:'c-green',page:'salesDashboard'},
    {label:'Total Expenses',value:cur.expense,icon:'wallet',cls:'c-orange',page:'expensesDashboard'},
    {label:'Total Receivables',value:totalRecv,icon:'in',cls:'c-blue',page:'recvDashboard'},
    {label:'Outstanding Payables',value:totalPay,icon:'out',cls:'c-red',page:'payDashboard'},
    {label:'Collections',value:cur.collections,icon:'collection',cls:'c-teal',page:'collectionAnalysis'},
    {label:'Payments',value:cur.payments,icon:'arrow-up',cls:'c-purple',page:'payDashboard'},
    {label:'Net Profit',value:cur.netProfit,icon:'pl',cls:'c-indigo',page:'profitLoss'},
    {label:'Cash in Hand / Bank',value:cashPos,icon:'cashflow',cls:'c-blue',page:'cashFlow'},
  ];

  const kpiCards=kpis.map(k=>{
    return `<div class="card" data-action="goto" data-page="${k.page}">
      <div class="card-top"><span class="card-label">${esc(k.label)}</span><div class="card-icon ${k.cls}">${NAV_ICONS[k.icon]}</div></div>
      <div class="card-value">${fmtINR(k.value)}</div>
    </div>`;
  }).join('');

  const recvAge=ageingBuckets(dataForFY('receivables'),'pendingAmount');
  const payAge=ageingBuckets(dataForFY('payables'),'closingBalance');
  const ageColors=['#2E6BF2','#16A34A','#F08A1D','#E23A3A'];

  const topCustomers=topN(dataForFY('receivables'),'partyName','pendingAmount',5).map(t=>{
    const row=dataForFY('receivables').find(r=>r.partyName===t.label && Number(r.pendingAmount)===t.value)||dataForFY('receivables').filter(r=>r.partyName===t.label).sort((a,b)=>b.overdueDays-a.overdueDays)[0];
    return Object.assign({},t,{overdueDays:row?row.overdueDays:0,dueDate:row?row.dueDate:'',billRefNo:row?row.billRefNo:''});
  });
  const topVendors=topN(dataForFY('payables'),'partyName','closingBalance',5).map(t=>{
    const row=dataForFY('payables').filter(r=>r.partyName===t.label).sort((a,b)=>b.overdueDays-a.overdueDays)[0];
    return Object.assign({},t,{overdueDays:row?row.overdueDays:0,dueDate:row?row.dueDate:'',billRefNo:row?row.billRefNo:''});
  });
  const expenseByCategory=topN(dataForFY('expense'),'subGroup','amount',6);
  const expenseTotal=sumBy(dataForFY('expense'),'amount');
  const expenseTotalBase=expenseTotal||1;
  const maxExpCat=Math.max(1,...expenseByCategory.map(x=>x.value));

  const recentReceipts=dataForFY('receipt').slice().sort((a,b)=>(parseDT(b.date)||0)-(parseDT(a.date)||0)).slice(0,5);

  const dueThisWeek=dataForFY('receivables').filter(r=>{
    const t=parseDT(r.dueDate); if(t===null) return false;
    const days=Math.round((t-Date.now())/86400000);
    return days>=0 && days<=7;
  }).sort((a,b)=>(parseDT(a.dueDate)||0)-(parseDT(b.dueDate)||0)).slice(0,5);

  // Sales Topline donut: break Total Sales down by the SALES sheet's column-N category
  // if categories are present; otherwise fall back to the documented 70/24/6 estimate.
  const salesByCategory=topN(dataForFY('sales'),'category','amount',6);
  const useRealCategories=salesByCategory.length>0;
  const domesticSales=totalSales*0.7, exportSales=totalSales*0.24, otherIncome=totalSales*0.06; // fallback estimate, see README

  return `
    ${renderFilterBar()}

    <div class="kpi-strip">${kpiCards}</div>

    <div class="dash-row3" style="grid-template-columns:1.4fr 1fr 1fr;">
      <div class="panel">
        <div class="panel-title">Sales vs Expenses Trend <span style="font-size:10px;color:var(--muted);font-weight:600;">${esc(fyLabel)}</span></div>
        <div class="panel-body"><div class="chart-wrap"><canvas id="chSalesTrend" data-chart-fallback></canvas></div></div>
        <div class="panel-foot"><span>Total Sales</span><span>${fmtINR(totalSales)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Receivable Ageing (Outstanding)</div>
        <div class="panel-body donut-panel-body">
          <div class="chart-wrap donut"><canvas id="chRecvAge" data-chart-fallback></canvas></div>
          <div class="donut-legend">
            ${Object.keys(recvAge).map((k,i)=>`<div class="dl-row"><span class="dl-dot" style="background:${ageColors[i]};"></span><span class="dl-label">${k} Days</span><span class="dl-val">${fmtINR(recvAge[k])}</span></div>`).join('')}
          </div>
        </div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalRecv)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Payable Ageing (Outstanding)</div>
        <div class="panel-body donut-panel-body">
          <div class="chart-wrap donut"><canvas id="chPayAge" data-chart-fallback></canvas></div>
          <div class="donut-legend">
            ${Object.keys(payAge).map((k,i)=>`<div class="dl-row"><span class="dl-dot" style="background:${ageColors[i]};"></span><span class="dl-label">${k} Days</span><span class="dl-val">${fmtINR(payAge[k])}</span></div>`).join('')}
          </div>
        </div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalPay)}</span></div>
      </div>
    </div>

    <div class="dash-row3">
      <div class="panel">
        <div class="panel-title">Top Customers by Outstanding <a data-action="goto" data-page="customerList">View All</a></div>
        <div class="panel-body" style="padding:0;">${(()=>{S.dashTopCustomers=topCustomers.map(c=>{const st=statusForDueDate(c.dueDate,c.overdueDays);return Object.assign({},c,{statusLabel:st.label,statusCls:st.cls});});return renderGrid('topCustomersDash');})()}</div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalRecv)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Top Vendors by Payable <a data-action="goto" data-page="vendorList">View All</a></div>
        <div class="panel-body" style="padding:0;">${(()=>{S.dashTopVendors=topVendors.map(c=>{const st=statusForDueDate(c.dueDate,c.overdueDays);return Object.assign({},c,{statusLabel:st.label,statusCls:st.cls});});return renderGrid('topVendorsDash');})()}</div>
        <div class="panel-foot"><span>Total Outstanding</span><span>${fmtINR(totalPay)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Expense by Category — ${esc(fyLabel)} <a data-action="goto" data-page="expensesDashboard">View All</a></div>
        <div class="panel-body">
          ${expenseByCategory.length?expenseByCategory.map((c,i)=>`
            <div class="mini-cat-row">
              <span class="mini-cat-dot" style="background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></span>
              <span class="mc-label" title="${esc(c.label)}">${esc(c.label)}</span>
              <div class="mc-track"><div class="mc-fill" style="width:${(c.value/maxExpCat*100).toFixed(0)}%;background:${CHART_PALETTE[i%CHART_PALETTE.length]};"></div></div>
              <span class="mc-amt">${fmtINR(c.value)}</span>
              <span class="mc-pct">${(c.value/expenseTotalBase*100).toFixed(1)}%</span>
            </div>`).join(''):`<div class="empty-state"><div class="big">No expenses</div></div>`}
          <div class="mini-total-row"><span>Total</span><span>${fmtINR(expenseTotal)}</span></div>
        </div>
      </div>
    </div>

    <div class="dash-row4">
      <div class="panel">
        <div class="panel-title">Recent Receipts <a data-action="goto" data-page="receipt">View All</a></div>
        <div class="panel-body" style="padding:6px 16px;">
          ${recentReceipts.length?recentReceipts.map(r=>`
            <div class="mini-row">
              <div class="lft"><div><div class="nm">${esc(r.bankPartyName||r.creditLedgerName)}</div><div class="sub">${esc(r.date)}</div></div></div>
              <div style="display:flex;align-items:center;gap:8px;"><span class="mode-badge">${esc(r.transactionType||'—')}</span><span class="amt recv">${fmtINR(r.debitLedgerAmount||r.creditLedgerAmount)}</span></div>
            </div>`).join(''):`<div class="empty-state"><div class="big">No receipts yet</div></div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Upcoming Due This Week <a data-action="goto" data-page="followUpList">View All</a></div>
        <div class="panel-body" style="padding:6px 16px;">
          ${dueThisWeek.length?dueThisWeek.map(r=>{
            const t=parseDT(r.dueDate);const days=t===null?'':Math.round((t-Date.now())/86400000)+' Days';
            return `<div class="mini-row"><div class="lft"><div><div class="nm">${esc(r.partyName)}</div><div class="sub">${esc(r.dueDate)}</div></div></div><div style="display:flex;align-items:center;gap:8px;"><span class="amt">${fmtINR(r.pendingAmount)}</span><span class="mode-badge">${days}</span></div></div>`;
          }).join(''):`<div class="empty-state"><div class="big">Nothing due 🎉</div></div>`}
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">Sales Topline${useRealCategories?' by Category':''} — ${esc(fyLabel)}</div>
        <div class="panel-body" style="display:flex;flex-direction:column;align-items:center;">
          <div class="chart-wrap donut"><canvas id="chSalesTopline" data-chart-fallback></canvas></div>
        </div>
        <div class="panel-foot"><span>Total Sales</span><span>${fmtINR(totalSales)}</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">Quick Actions</div>
        <div class="panel-body">
          <div class="qa-grid">
            <div class="qa-btn" data-action="goto" data-page="receipt"><span class="qa-ic c-green" style="background:var(--green-tint);color:var(--green);">${NAV_ICONS['arrow-down']}</span><span class="qa-txt">Record Receipt</span></div>
            <div class="qa-btn" data-action="goto" data-page="payment"><span class="qa-ic" style="background:var(--red-tint);color:var(--red);">${NAV_ICONS['arrow-up']}</span><span class="qa-txt">Record Payment</span></div>
            <div class="qa-btn" data-action="goto" data-page="expense"><span class="qa-ic" style="background:var(--orange-tint);color:var(--orange);">${NAV_ICONS.wallet}</span><span class="qa-txt">Add Expense</span></div>
            <div class="qa-btn" data-action="goto" data-page="customerList"><span class="qa-ic" style="background:var(--blue-tint);color:var(--blue);">${NAV_ICONS.customer}</span><span class="qa-txt">Customer Follow-up</span></div>
            <div class="qa-btn" data-action="goto" data-page="vendorList"><span class="qa-ic" style="background:var(--purple-tint);color:var(--purple);">${NAV_ICONS.customer}</span><span class="qa-txt">Vendor Follow-up</span></div>
            <div class="qa-btn" data-action="goto" data-page="creditNotes"><span class="qa-ic" style="background:var(--teal-tint);color:var(--teal);">${NAV_ICONS.creditnote}</span><span class="qa-txt">Credit Note</span></div>
            <div class="qa-btn" data-action="goto" data-page="ledger"><span class="qa-ic" style="background:var(--indigo-tint);color:var(--indigo);">${NAV_ICONS.book}</span><span class="qa-txt">Bank Reconcile</span></div>
            <div class="qa-btn" data-action="goto" data-page="ledger"><span class="qa-ic" style="background:var(--gold-tint);color:var(--gold);">${NAV_ICONS.book}</span><span class="qa-txt">Email Statement</span></div>
            <div class="qa-btn" data-action="goto" data-page="reports"><span class="qa-ic" style="background:var(--blue-tint);color:var(--blue);">${NAV_ICONS.reports}</span><span class="qa-txt">Reports</span></div>
          </div>
        </div>
      </div>
    </div>
  `;
}
registerPage('dashboard',renderDashboard);

CHART_DEFS['dashboard']=function(){
  const months=selectedFYMonths();
  const salesRows=dataForFY('sales');
  const expenseTrendRows=dataForFY('expenseTrend');
  const salesTrendSeries=months.map(m=>sumBy(rowsInCustomRange(salesRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'amount'));
  const expenseTrendSeries=months.map(m=>sumBy(rowsInCustomRange(expenseTrendRows,'date',toISO(new Date(m.y,m.m,1)),toISO(new Date(m.y,m.m+1,0))),'amount'));
  drawLineChart('chSalesTrend',months.map(m=>m.label),
    [{label:'Sales',data:salesTrendSeries,color:'#2E6BF2'},{label:'Expenses',data:expenseTrendSeries,color:'#E23A3A'}]);

  const recvAge=ageingBuckets(dataForFY('receivables'),'pendingAmount');
  const payAge=ageingBuckets(dataForFY('payables'),'closingBalance');
  drawDonutChart('chRecvAge',Object.keys(recvAge),Object.values(recvAge),['#2E6BF2','#16A34A','#F08A1D','#E23A3A']);
  drawDonutChart('chPayAge',Object.keys(payAge),Object.values(payAge),['#2E6BF2','#16A34A','#F08A1D','#E23A3A']);

  const salesByCategory=topN(dataForFY('sales'),'category','amount',6);
  if(salesByCategory.length){
    drawDonutChart('chSalesTopline',salesByCategory.map(c=>c.label),salesByCategory.map(c=>c.value),CHART_PALETTE);
  } else {
    const totalSales=totalSalesFromSalesSheet();
    const domesticSales=totalSales*0.7, exportSales=totalSales*0.24, otherIncome=totalSales*0.06;
    drawDonutChart('chSalesTopline',['Domestic Sales','Export Sales','Other Income'],[domesticSales,exportSales,otherIncome],['#2E6BF2','#16A34A','#F08A1D']);
  }
};
</script>

<script>
/* ============================= FINANCIAL YEAR FILTER ============================= */
function defaultFilterState(){
  return {fy:[],fyOpen:false}; // [] means every available financial year
}

function pad2(n){return n<10?'0'+n:''+n;}
function toISO(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function fromISO(s){ const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtDDMMMYYYY(d){ const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return pad2(d.getDate())+' '+months[d.getMonth()]+' '+d.getFullYear(); }
function fmtDDMMM(d){ const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return pad2(d.getDate())+' '+months[d.getMonth()]; }

// Indian financial year: 1 April through 31 March.
function financialYearKey(dateVal){
  const t=parseDT(dateVal);if(t===null)return null;
  const d=new Date(t);const start=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;
  return start+'-'+String(start+1).slice(2);
}
function financialYearFromKey(key){
  const start=parseInt(String(key).split('-')[0],10);
  if(!isFinite(start))return null;
  return {key:String(key),start:new Date(start,3,1),end:new Date(start+1,2,31),label:'1-Apr-'+start+' To 31-Mar-'+(start+1)};
}
function fyBounds(now){
  const key=financialYearKey(now);const fy=financialYearFromKey(key);
  return {start:fy.start,end:fy.end,label:key};
}

const FY_DATASETS={
  expense:{prop:'expense',dateKey:'date'}, expenseTrend:{prop:'expenseTrendRows',dateKey:'date'},
  payables:{prop:'payables',dateKey:'billDate'}, receivables:{prop:'receivables',dateKey:'billDate'},
  receipt:{prop:'receipt',dateKey:'date'}, payment:{prop:'payment',dateKey:'date'},
  sales:{prop:'salesRows',dateKey:'date'}, balanceVouchers:{prop:'balanceVouchers',dateKey:'date'}
};

function availableFinancialYears(){
  const keys=new Set();
  Object.keys(FY_DATASETS).forEach(name=>{
    const meta=FY_DATASETS[name];
    (S[meta.prop]||[]).forEach(r=>{const key=financialYearKey(r[meta.dateKey]);if(key)keys.add(key);});
  });
  return Array.from(keys).map(financialYearFromKey).filter(Boolean).sort((a,b)=>b.start-a.start);
}
function selectedFinancialYears(){
  const available=new Set(availableFinancialYears().map(f=>f.key));
  const selected=(S.filters&&Array.isArray(S.filters.fy)?S.filters.fy:[]).filter(k=>available.has(k));
  if(S.filters)S.filters.fy=selected;
  return selected;
}
function isFYSelected(dateVal){
  const selected=selectedFinancialYears();
  if(!selected.length)return true;
  const key=financialYearKey(dateVal);
  return key!==null&&selected.indexOf(key)!==-1;
}
function rowsForFinancialYears(rows,dateKey){
  const selected=selectedFinancialYears();
  if(!selected.length)return (rows||[]).slice();
  const wanted=new Set(selected);
  return (rows||[]).filter(r=>wanted.has(financialYearKey(r[dateKey])));
}
function dataForFY(name){
  const meta=FY_DATASETS[name];
  if(!meta)return [];
  return rowsForFinancialYears(S[meta.prop]||[],meta.dateKey);
}
function selectedFYLabel(){
  const selected=selectedFinancialYears();
  if(!selected.length)return 'All Financial Years';
  return selected.map(k=>financialYearFromKey(k).label).join(', ');
}
function selectedFYDayCount(){
  const selected=selectedFinancialYears();
  if(!selected.length)return 365;
  return selected.reduce((sum,key)=>{const fy=financialYearFromKey(key);return sum+Math.round((fy.end-fy.start)/86400000)+1;},0);
}
function selectedFYMonths(){
  let years=selectedFinancialYears();
  if(!years.length)years=availableFinancialYears().map(f=>f.key);
  const out=[];const months=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  years.slice().sort().forEach(key=>{
    const fy=financialYearFromKey(key);if(!fy)return;
    for(let i=0;i<12;i++){
      const d=new Date(fy.start.getFullYear(),fy.start.getMonth()+i,1);
      out.push({label:months[i]+' '+d.getFullYear(),y:d.getFullYear(),m:d.getMonth()});
    }
  });
  return out;
}

// Kept for date-based charts and table calculations.
function presetRange(key,base){
  const now=base?new Date(base):new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let from=today,to=today;
  if(key==='7D'){from=new Date(today);from.setDate(from.getDate()-6);}
  else if(key==='15D'){from=new Date(today);from.setDate(from.getDate()-14);}
  else if(key==='30D'){from=new Date(today);from.setDate(from.getDate()-29);}
  else if(key==='QTD'){from=new Date(today.getFullYear(),Math.floor(today.getMonth()/3)*3,1);}
  else if(key==='YTD'){from=fyBounds(today).start;}
  else if(key==='MTD'){from=new Date(today.getFullYear(),today.getMonth(),1);}
  return {from:toISO(from),to:toISO(to)};
}
function comparisonRange(fromISOStr,toISOStr){
  const from=fromISO(fromISOStr),to=fromISO(toISOStr),spanDays=Math.round((to-from)/86400000)+1;
  const prevTo=new Date(from);prevTo.setDate(prevTo.getDate()-1);const prevFrom=new Date(prevTo);prevFrom.setDate(prevFrom.getDate()-(spanDays-1));
  return {from:toISO(prevFrom),to:toISO(prevTo)};
}
function inRange(dateVal,fromISOStr,toISOStr){
  const t=parseDT(dateVal);if(t===null)return false;
  return t>=fromISO(fromISOStr).getTime()&&t<=fromISO(toISOStr).getTime()+86399999;
}
function pctChange(cur,prev){if(!prev)return cur?100:0;return((cur-prev)/Math.abs(prev))*100;}

function renderFilterBar(){
  const fys=availableFinancialYears();const selected=selectedFinancialYears();const all=!selected.length;
  const buttonText=all?'All Financial Years':(selected.length===1?financialYearFromKey(selected[0]).label:selected.length+' Financial Years Selected');
  return `<div class="fbar fy-only-bar">
    <div class="fbar-group fy-filter-group">
      <label>Financial Year</label>
      <div class="fy-multi">
        <button type="button" class="fy-multi-btn" data-action="fy-open">${esc(buttonText)} <span>▾</span></button>
        ${S.filters.fyOpen?`<div class="fy-menu">
          <label class="fy-option fy-all"><input type="checkbox" data-action="fy-all" ${all?'checked':''}> <span>All Financial Years</span></label>
          ${fys.length?fys.map(f=>`<label class="fy-option"><input type="checkbox" data-action="fy-toggle" data-fy="${esc(f.key)}" ${selected.indexOf(f.key)!==-1?'checked':''}> <span>${esc(f.label)}</span></label>`).join(''):`<div class="fy-empty">Date wala data load hone ke baad financial years yahan dikhenge.</div>`}
        </div>`:''}
      </div>
    </div>
    <div class="fy-selection-note">Showing: <b>${esc(selectedFYLabel())}</b></div>
    <div class="spacer"></div>
  </div>`;
}

function resetAllTablePages(){Object.keys(S.dt).forEach(k=>{S.dt[k].page=1;});}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');
  if(el&&el.getAttribute('data-action')==='fy-open'){S.filters.fyOpen=!S.filters.fyOpen;render();return;}
  if(el&&el.getAttribute('data-action')==='fy-all'){S.filters.fy=[];S.filters.fyOpen=true;resetAllTablePages();render();return;}
  if(el&&el.getAttribute('data-action')==='fy-toggle'){
    const key=el.getAttribute('data-fy');const selected=selectedFinancialYears().slice();const pos=selected.indexOf(key);
    if(pos===-1)selected.push(key);else selected.splice(pos,1);
    S.filters.fy=selected;S.filters.fyOpen=true;resetAllTablePages();render();return;
  }
  if(S.filters&&S.filters.fyOpen&&!e.target.closest('.fy-multi')){S.filters.fyOpen=false;render();}
});
</script>

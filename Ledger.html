<script>
/* ============================= LEDGER (party statement + print/PDF) =============================
 * Every party's full ledger statement is precomputed on the server ONCE, as part of
 * the 'balance' chunk during login / Sync with Tally (see buildAllLedgers_ in Code.gs),
 * and cached client-side in S.balanceLedgers. Switching the selected party is therefore
 * a pure, instant client-side lookup — NO server round-trip, no "please wait" delay.
 * getLedgerForParty() is only called as a fallback for a party that isn't in the cache
 * yet (e.g. added to the sheet after the last sync).
 */
function selectLedgerParty(name){
  S.ledger.selected=name;
  const cached=S.balanceLedgers&&S.balanceLedgers[name];
  if(cached){ S.ledger.detail=cached;S.ledger.loading=false;render();return; }
  // Fallback: not in the cached map (new party since last sync) — fetch just this one.
  S.ledger.detail=null;S.ledger.loading=true;render();
  runServer('getLedgerForParty',name).then(detail=>{
    S.ledger.detail=detail;S.balanceLedgers[name]=detail;
  }).catch(err=>{ showToast("Ledger load error: "+err.message,true); })
    .finally(()=>{ S.ledger.loading=false;render(); });
}

function renderLedgerPage(){
  const q=(S.ledger.search||'').toLowerCase();
  const parties=S.balanceParties.filter(p=>!q||p.name.toLowerCase().includes(q));
  // Sort: highest closing balance first (positive descending), then negatives
  // (ascending, i.e. less-negative before more-negative), then zeros last — per
  // explicit user instruction ("jiska amt max hai vo pehle aa jaye, jiska neg hai
  // fr vo aa jaye, or jinka 0 hai fr vo aa jaye").
  parties.sort((a,b)=>{
    const av=Number(a.closingBalance)||0,bv=Number(b.closingBalance)||0;
    const aGrp=av>0?0:av<0?1:2, bGrp=bv>0?0:bv<0?1:2;
    if(aGrp!==bGrp)return aGrp-bGrp;
    if(aGrp===0)return bv-av; // positive: highest first
    if(aGrp===1)return bv-av; // negative: closest to zero first (-500 before -2000)
    return a.name.localeCompare(b.name); // zeros: alphabetical
  });

  // Each party row is a SINGLE compact line: Name on the left, then Group/Phone +
  // balance all together on a second subtitle line — per explicit user instruction
  // ("current asset ke saath balance aa jaye phone ke baad mein aa jaye ek single
  // line mein").
  const partyRows=parties.map(p=>`
    <div class="party-row ${S.ledger.selected===p.name?'active':''}" data-action="select-party" data-name="${esc(p.name)}">
      <div class="pn">${esc(p.name)}</div>
      <div class="pg">${esc(p.group)}${p.mobile?' · '+esc(p.mobile):''} · <span class="pb-inline" style="color:${(Number(p.closingBalance)||0)<0?'var(--success)':'var(--ink)'};">${fmtINR(p.closingBalance)}</span></div>
    </div>`).join('');

  let detailHtml;
  if(S.ledger.loading){
    detailHtml=`<div class="ledger-empty"><div class="spinner" style="margin:0 auto 14px;"></div>Loading ledger…</div>`;
  } else if(!S.ledger.selected || !S.ledger.detail){
    detailHtml=`<div class="ledger-empty"><div class="big" style="font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);font-weight:600;margin-bottom:6px;">Select a party</div>Left list se koi party choose karein unka ledger statement dekhne ke liye.</div>`;
  } else {
    const d=S.ledger.detail;
    const h=d.header;
    const entryRows=d.entries.map(e=>`
      <tr>
        <td>${esc(e.date)}</td>
        <td>${esc(e.particular)}</td>
        <td>${esc(e.vchType)}</td>
        <td>${esc(e.vchNo)}</td>
        <td class="num">${e.debit?fmtNum(e.debit):''}</td>
        <td class="num">${e.credit?fmtNum(e.credit):''}</td>
        <td class="num">${fmtNum(Math.abs(e.balance))} ${e.balance>=0?'Dr':'Cr'}</td>
      </tr>`).join('');
    detailHtml=`
      <div class="ledger-toolbar">
        <div class="ledger-toolbar-info">
          <div class="co-name">${esc(h.name)}</div>
          <div class="co-sub">${esc(h.address||'')}${h.state?', '+esc(h.state):''}${h.pincode&&h.pincode!=='NA'?' - '+esc(h.pincode):''}</div>
          <div class="co-sub">${h.mobile?'Mobile: '+esc(h.mobile):''}${h.email&&h.email!=='NA'?' · Email: '+esc(h.email):''}</div>
          <div class="co-meta">
            <span><b>Group:</b> ${esc(h.group)} ${h.subgroup?'('+esc(h.subgroup)+')':''}</span>
            <span><b>Contact:</b> ${esc(h.contactPerson)||'-'}</span>
            <span><b>Credit Period:</b> ${esc(h.creditPeriod)||'-'}</span>
            <span><b>Credit Limit:</b> ${esc(h.creditLimit)||'-'}</span>
            <span><b>Bill-by-Bill:</b> ${esc(h.billByBill)||'-'}</span>
          </div>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-gold" data-action="ledger-print">🖨 Print / Download PDF</button>
      </div>
      <div class="ledger-scroll">
        <table class="ledger-table">
          <thead><tr>
            <th>Date</th><th>Particulars</th><th>Vch Type</th><th>Vch No</th>
            <th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th>
          </tr></thead>
          <tbody>
            <tr class="opening-row">
              <td>${esc(d.opening.date)}</td><td>${esc(d.opening.particular)}</td><td></td><td></td>
              <td class="num">${d.opening.debit?fmtNum(d.opening.debit):''}</td>
              <td class="num">${d.opening.credit?fmtNum(d.opening.credit):''}</td>
              <td class="num">${fmtNum(Math.abs(d.opening.balance))} ${d.opening.balance>=0?'Dr':'Cr'}</td>
            </tr>
            ${entryRows}
          </tbody>
          <tfoot><tr class="closing-row">
            <td>${esc(d.closing.date)}</td><td>${esc(d.closing.particular)}</td><td></td><td></td>
            <td class="num">${d.closing.debit?fmtNum(d.closing.debit):''}</td>
            <td class="num">${d.closing.credit?fmtNum(d.closing.credit):''}</td>
            <td class="num">${fmtNum(Math.abs(d.closing.balance))} ${d.closing.balance>=0?'Dr':'Cr'}</td>
          </tr></tfoot>
        </table>
      </div>`;
  }

  return `
    <div class="ledger-shell">
      <div class="ledger-party-list">
        <div class="ledger-search"><input type="text" placeholder="Search party…" data-action="ledger-search" value="${esc(S.ledger.search)}"></div>
        <div class="party-scroll">${partyRows||`<div class="empty-state"><div class="big">No parties</div></div>`}</div>
      </div>
      <div class="ledger-detail"><div class="ledger-wrap">${detailHtml}</div></div>
    </div>`;
}
</script>

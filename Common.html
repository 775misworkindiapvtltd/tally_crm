<script>
/* ============================= CONFIG =============================
 * APP_BUILD: bump this on every fix. Shown in the sidebar footer so you can
 * confirm at a glance whether your LIVE Apps Script deployment is actually
 * running the latest code — editing/saving files in the Apps Script editor
 * does NOT update your published /exec URL by itself. You must go to
 * Deploy > Manage deployments > (pencil/edit icon) > Version: New version
 * > Deploy, every time you paste in updated code. If the version number
 * shown in your app doesn't match the one below, that's why a fix "isn't
 * working" — it simply hasn't been deployed yet.
 */
const APP_BUILD = "2026-07-21.4 (multi-FY + smart-tables)";
const PAGE_SIZE_OPTIONS = [50,100,500,1000];
const AUTO_LOGOUT_TIME = "23:59";

/* ============================= STATE ============================= */
function dtState(){return{sort:null,dir:1,hidden:new Set(),filters:{},dateFilters:{},numFilters:{},filterOpen:null,widths:{},order:[],page:1,pageSize:50};}
// Table state is created lazily per grid the first time it's viewed. Whenever a fresh
// dtState() is created, immediately re-apply this user's remembered column
// hide/order/width/sort/page-size (see GRID_PREFS below) so a page always opens
// exactly the way the user last left it — even right after logging back in.
function tableState(key){
  if(!S.dt[key]){S.dt[key]=dtState();applyPersistedGridPrefs_(key);}
  return S.dt[key];
}

/* ============================= REMEMBERED GRID SETTINGS =============================
 * "If I hide some columns, next login those columns should stay hidden" — persisted
 * per signed-in user (so different logins on the same browser don't clash), covering
 * hidden columns, column order (drag/shift), column widths (resize), the active
 * sort column/direction, and rows-per-page. Deliberately does NOT persist active
 * text/date/number filters or the current page number — those are a one-time search,
 * not a layout preference, and persisting them could otherwise silently hide rows
 * the next time the user opens the same report. */
function gridPrefsStorageKey_(){return 'tally_grid_prefs_v1:'+dataCacheKey_();}
function loadGridPrefsCache_(){
  S._gridPrefsCache={};
  try{const raw=localStorage.getItem(gridPrefsStorageKey_());if(raw)S._gridPrefsCache=JSON.parse(raw)||{};}catch(e){S._gridPrefsCache={};}
}
function persistGridPrefs_(tableKey){
  if(!S.user)return;
  const st=S.dt[tableKey];if(!st)return;
  if(!S._gridPrefsCache)S._gridPrefsCache={};
  S._gridPrefsCache[tableKey]={hidden:Array.from(st.hidden||[]),order:(st.order||[]).slice(),widths:Object.assign({},st.widths||{}),sort:st.sort||null,dir:st.dir===-1?-1:1,pageSize:st.pageSize||50};
  try{localStorage.setItem(gridPrefsStorageKey_(),JSON.stringify(S._gridPrefsCache));}catch(e){console.warn('Could not save table preferences:',e);}
}
function applyPersistedGridPrefs_(tableKey){
  const p=S._gridPrefsCache&&S._gridPrefsCache[tableKey];if(!p)return;
  const st=S.dt[tableKey];if(!st)return;
  if(Array.isArray(p.hidden))st.hidden=new Set(p.hidden);
  if(Array.isArray(p.order))st.order=p.order.slice();
  if(p.widths&&typeof p.widths==='object')st.widths=Object.assign({},p.widths);
  if(p.sort)st.sort=p.sort;
  if(p.dir===1||p.dir===-1)st.dir=p.dir;
  if(p.pageSize&&PAGE_SIZE_OPTIONS.indexOf(p.pageSize)!==-1)st.pageSize=p.pageSize;
}

let S = {
  ready:false, loadError:"", user:null, page:null, syncing:false, sidebarOpen:false,
  expense:[], payables:[], receivables:[], receipt:[], payment:[], balanceParties:[], balanceVouchers:[], balanceLedgers:{}, salesRows:[], expenseTrendRows:[],
  users:[], missingSheets:[], diagnostics:{}, diagBannerDismissed:false,
  toast:null, loginError:"",
  dt:{ expense:dtState(), payables:dtState(), receivables:dtState(), receipt:dtState(), payment:dtState() },
  colMenuOpen:null, logoutAt:0,
  lastSync:'', lastSyncAt:0, lastSyncSource:'', cacheLoaded:false,
  ledger:{ search:'', selected:null, detail:null, loading:false },
  darkMode:false, fontSize:100,
  filters:null,
  followUpDone:{}, // client-side "marked as followed up" set (not persisted to sheet)
  ageingOpen:false, ageingMode:'all',
  map:{selectedState:'',zoom:1},
};

try{ S.darkMode=localStorage.getItem('tally_dark_mode')==='true'; if(S.darkMode)document.documentElement.classList.add('dark'); }catch(e){}
try{ const fs=parseInt(localStorage.getItem('tally_font_size'),10); if(fs>=80&&fs<=130){S.fontSize=fs;} }catch(e){}

/* ============================= APPS SCRIPT BRIDGE ============================= */
function runServer(fnName,arg){
  return new Promise((resolve,reject)=>{
    if(typeof google==='undefined'||!google.script||!google.script.run){
      reject(new Error("google.script.run not available — open this page via the Apps Script /exec URL."));return;
    }
    const onFailure=err=>reject(new Error((err&&err.message)||String(err)));
    const call=google.script.run.withSuccessHandler(resolve).withFailureHandler(onFailure);

    // Apps Script's google.script.run is a generated proxy, not a normal object.
    // Bracket-based dynamic invocation can therefore be undefined even
    // when the server function exists. Keep the public bridge explicit instead.
    switch(fnName){
      case 'getLoginData': call.getLoginData(); break;
      case 'getChunk': call.getChunk(arg); break;
      case 'getLedgerForParty': call.getLedgerForParty(arg); break;
      default: reject(new Error('Unsupported server function: '+fnName));
    }
  });
}

function applyDataPayload_(data){
  if(!data)return false;
  S.expense=Array.isArray(data.expense)?data.expense:[];
  S.payables=Array.isArray(data.payables)?data.payables:[];
  S.receivables=Array.isArray(data.receivables)?data.receivables:[];
  S.receipt=Array.isArray(data.receipt)?data.receipt:[];
  S.payment=Array.isArray(data.payment)?data.payment:[];
  S.balanceParties=Array.isArray(data.balanceParties)?data.balanceParties:[];
  S.balanceVouchers=Array.isArray(data.balanceVouchers)?data.balanceVouchers:[];
  S.balanceLedgers=(data.balanceLedgers&&typeof data.balanceLedgers==='object')?data.balanceLedgers:{};
  S.salesRows=Array.isArray(data.salesRows)?data.salesRows:[];
  S.expenseTrendRows=Array.isArray(data.expenseTrendRows)?data.expenseTrendRows:[];
  S.missingSheets=Array.isArray(data.missingSheets)?data.missingSheets:[];
  S.diagnostics=(data.diagnostics&&typeof data.diagnostics==='object')?data.diagnostics:{};
  return true;
}

function applyBootstrap(data){
  if(!applyDataPayload_(data))showToast("Server se khaali response aaya — Sync with Tally dabao.",true);
}

/* ============================= LOCAL DATA CACHE =============================
 * Sheet snapshots are stored locally per signed-in user. IndexedDB supports the larger
 * Tally datasets; localStorage is only a fallback when IndexedDB is unavailable. */
const DATA_CACHE_DB='finance360_data_cache';
const DATA_CACHE_STORE='snapshots';
const DATA_CACHE_VERSION=1;
const DATA_CACHE_LOCAL_PREFIX='finance360_data_cache_v1:';

function dataCacheKey_(){return String(S.user&&S.user.id||'anonymous').trim().toLowerCase();}
function formatSyncTime_(value){
  const d=new Date(Number(value)||Date.now()),pad=n=>n<10?'0'+n:''+n;
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' · '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function markSynced(source,time){
  const ts=Number(time)||Date.now();
  S.lastSyncAt=ts;S.lastSync=formatSyncTime_(ts);S.lastSyncSource=source||'live';
}
function dataCachePayload_(){
  return {expense:S.expense,payables:S.payables,receivables:S.receivables,receipt:S.receipt,payment:S.payment,
    balanceParties:S.balanceParties,balanceVouchers:S.balanceVouchers,balanceLedgers:S.balanceLedgers,
    salesRows:S.salesRows,expenseTrendRows:S.expenseTrendRows,missingSheets:S.missingSheets,diagnostics:S.diagnostics};
}
function dataCacheSnapshot_(){return {version:DATA_CACHE_VERSION,savedAt:S.lastSyncAt||Date.now(),data:dataCachePayload_()};}
function openDataCache_(){
  return new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined'){reject(new Error('IndexedDB unavailable'));return;}
    const req=indexedDB.open(DATA_CACHE_DB,DATA_CACHE_VERSION);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DATA_CACHE_STORE))req.result.createObjectStore(DATA_CACHE_STORE);};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open local cache'));
  });
}
async function readCachedSnapshot_(){
  const key=dataCacheKey_();
  try{
    const db=await openDataCache_();
    return await new Promise((resolve,reject)=>{
      const req=db.transaction(DATA_CACHE_STORE,'readonly').objectStore(DATA_CACHE_STORE).get(key);
      req.onsuccess=()=>{db.close();resolve(req.result||null);};req.onerror=()=>{db.close();reject(req.error);};
    });
  }catch(err){
    try{const raw=localStorage.getItem(DATA_CACHE_LOCAL_PREFIX+key);return raw?JSON.parse(raw):null;}catch(ignore){return null;}
  }
}
async function writeCachedSnapshot_(){
  if(!S.user||!hasAnyData())return false;
  const key=dataCacheKey_(),snapshot=dataCacheSnapshot_();
  try{
    const db=await openDataCache_();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(DATA_CACHE_STORE,'readwrite');tx.objectStore(DATA_CACHE_STORE).put(snapshot,key);
      tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};
    });
    return true;
  }catch(err){
    try{localStorage.setItem(DATA_CACHE_LOCAL_PREFIX+key,JSON.stringify(snapshot));return true;}catch(ignore){console.warn('Local cache could not be saved:',err);return false;}
  }
}
async function hydrateCachedData_(){
  const snapshot=await readCachedSnapshot_();
  if(!snapshot||snapshot.version!==DATA_CACHE_VERSION||!snapshot.savedAt||!applyDataPayload_(snapshot.data))return false;
  S.cacheLoaded=true;markSynced('cache',snapshot.savedAt);return true;
}

// Builds a plain-language list of problems found in the sheet (missing tabs, missing
// headers, tabs with zero data rows, Receipt/PAYMENT/Balance tabs with fewer columns
// than expected). Returns [] if everything looks fine.
function diagnosticIssues(){
  const d=S.diagnostics||{}; const issues=[];
  Object.keys(d).forEach(tab=>{
    const info=d[tab];
    if(!info.exists){ issues.push(`Tab "${tab}" not found — check the exact spelling/spacing of this sheet tab's name.`); return; }
    if(info.missingHeaders && info.missingHeaders.length){
      issues.push(`Tab "${tab}" is missing column header(s): ${info.missingHeaders.join(', ')} — check spelling/spacing in row 1.`);
    }
    if(info.columnCountOk===false){
      issues.push(`Tab "${tab}" has only ${info.columnCount} column(s), expected at least ${info.expectedMinCols} — some columns may be missing or shifted.`);
    }
    if(info.exists && info.dataRowCount===0 && (!info.missingHeaders||!info.missingHeaders.length)){
      issues.push(`Tab "${tab}" exists but has 0 data rows below the header.`);
    }
  });
  return issues;
}
function hasAnyData(){
  return S.expense.length||S.payables.length||S.receivables.length||S.receipt.length||S.payment.length||S.balanceParties.length||S.salesRows.length;
}

// BUG FIX (found after user report: dashboard shows all-Rs0 with NO diagnostics banner
// visible): the Data Diagnostics banner used to be gated on `!hasAnyData()`, but
// hasAnyData() ORs in S.balanceParties.length — and the Balance tab (the master party
// ledger) almost always has rows even when EXPENSE/PAYABLES/RECEIVABLES/SALES are
// empty or misconfigured. That made hasAnyData() return true and PERMANENTLY hid the
// banner, no matter how broken the other sheets were — exactly the reported symptom.
// Fix: show the banner whenever diagnosticIssues() finds ANY problem, independent of
// whether the Balance tab happens to have data. This is a strictly separate signal
// from the "still loading, show a spinner" case below.
function shouldShowDiagBanner(){
  return !S.syncing && !S.diagBannerDismissed && diagnosticIssues().length>0;
}

async function loadAll(){
  S.ready=false;render();
  try{
    const loginData=await runServer('getLoginData');
    S.users=(loginData&&loginData.users)||[];
    S.loadError="";
  }catch(err){ S.loadError=err.message; }
  S.ready=true;render();startClock();
}

// Load data one tab at a time to stay within the Apps Script response-size limit.
// The currently rendered cached snapshot stays visible until all live chunks finish;
// this avoids partial numbers, repeated page movement, and a table changing mid-scroll.
const CHUNK_KEYS=['receivables','payables','expense','expenseTrend','receipt','payment','sales','balance','diagnostics'];

async function loadChunks(){
  let completed=0;const livePayload={};
  for(const key of CHUNK_KEYS){
    try{
      const data=await runServer('getChunk',key);
      if(data===null||data===undefined)continue;
      switch(key){
        case 'expense':livePayload.expense=data||[];break;
        case 'expenseTrend':livePayload.expenseTrendRows=data||[];break;
        case 'payables':livePayload.payables=data||[];break;
        case 'receivables':livePayload.receivables=data||[];break;
        case 'receipt':livePayload.receipt=data||[];break;
        case 'payment':livePayload.payment=data||[];break;
        case 'sales':livePayload.salesRows=data||[];break;
        case 'balance':livePayload.balanceParties=data.balanceParties||[];livePayload.balanceVouchers=data.balanceVouchers||[];livePayload.balanceLedgers=data.balanceLedgers||{};break;
        case 'diagnostics':livePayload.diagnostics=data||{};break;
      }
      completed++;
    }catch(err){console.error('Chunk load error ['+key+']:',err.message);}
  }
  return {completed,livePayload};
}

function applyCompletedLiveSync_(result){
  if(!result.completed)return false;
  applyDataPayload_(Object.assign(dataCachePayload_(),result.livePayload));
  S.cacheLoaded=false;markSynced('live');return true;
}

async function loadHeavyData(skipInitialRender){
  S.syncing=true;S.diagBannerDismissed=false;
  if(!skipInitialRender)render();
  const result=await loadChunks();
  S.syncing=false;
  if(applyCompletedLiveSync_(result))await writeCachedSnapshot_();
  render();
}

async function refreshData(){
  S.syncing=true;S.diagBannerDismissed=false;render();
  const result=await loadChunks();
  S.syncing=false;
  if(applyCompletedLiveSync_(result)){
    await writeCachedSnapshot_();
    Object.keys(S.dt).forEach(k=>{S.dt[k].filters={};S.dt[k].dateFilters={};S.dt[k].numFilters={};S.dt[k].filterOpen=null;S.dt[k].page=1;});
    showToast("Sheet se latest data mil gaya.",false);
  }else{
    showToast("Live sync nahi hua — cached data hi dikh raha hai.",true);
  }
}

/* ============================= HELPERS ============================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";";});}
function fmtINR(n){
  n=Number(n)||0;
  const neg=n<0;n=Math.abs(n);
  const parts=n.toFixed(2).split('.');
  let x=parts[0];
  let lastThree=x.substring(x.length-3);
  let other=x.substring(0,x.length-3);
  if(other!=='') lastThree=','+lastThree;
  const formatted=other.replace(/\B(?=(\d{2})+(?!\d))/g,',')+lastThree;
  return (neg?'-':'')+'₹'+formatted;
}
function fmtINRCompact(n){ return fmtINR(n).replace(/\.00$/,''); }
function fmtNum(n){ n=Number(n)||0; return n.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function fmtPct(n){ n=Number(n)||0; return (n>=0?'+':'')+n.toFixed(1)+'%'; }

function parseDT(v){
  if(v==null)return null;
  const s=String(v).trim();if(!s)return null;
  const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const m=s.match(/^(\d{1,2})[-\/\s]([A-Za-z]{3,})[-\/\s](\d{4})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    const day=+m[1],mon=M[m[2].slice(0,3).toLowerCase()],yr=+m[3];
    if(mon===undefined)return null;
    const hh=+(m[4]||0),mm=+(m[5]||0),ss=+(m[6]||0);
    return new Date(yr,mon,day,hh,mm,ss).getTime();
  }
  const t=Date.parse(s);return isNaN(t)?null:t;
}
function isDateColumn(key){ return /timestamp|date/i.test(key); }

function showToast(msg,isErr){
  S.toast={msg,isErr};
  render();
  setTimeout(()=>{S.toast=null;const t=document.querySelector('.toast');if(t)t.remove();},3000);
}

/* ============================= AUTO-LOGOUT (NIGHT) ============================= */
function nextLogoutTs(){
  const parts=String(AUTO_LOGOUT_TIME).split(':');
  const h=parseInt(parts[0],10)||0, m=parseInt(parts[1],10)||0;
  const now=new Date();
  const t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
  if(t.getTime()<=now.getTime()) t.setDate(t.getDate()+1);
  return t.getTime();
}
function forceNightLogout(){
  void writeCachedSnapshot_();
  S.user=null;S.page=null;S.sidebarOpen=false;S.logoutAt=0;
  S.loginError="Raat ke auto-logout ke kaaran aap sign out ho gaye. Kripya dobara login karein.";
  render();
}

/* ============================= LIVE CLOCK ============================= */
function startClock(){
  setInterval(()=>{
    if(S.user && S.logoutAt && Date.now()>=S.logoutAt){ forceNightLogout(); return; }
  },1000);
}

/* ============================= LOGIN ============================= */
function renderLogin(){
  return `
  <div class="login-wrap"><div class="login-card">
    <div class="login-top"><div class="login-eyebrow">Finance 360° · Tally Integrated</div><h1>Finance Command Center</h1></div>
    <div class="login-body">
      ${S.loginError?`<div class="login-error">${esc(S.loginError)}</div>`:""}
      <form id="loginForm">
        <div class="field"><label>User ID</label><input type="text" id="loginId" autocomplete="username" placeholder="Enter your ID" required></div>
        <div class="field"><label>Password</label><input type="password" id="loginPw" autocomplete="current-password" placeholder="••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="login-hint">Credentials aapki <b>LOGIN PAGE</b> sheet mein hain — column B = ID, column C = Password. Login hone ke baad har user ko sabhi pages dikhenge.</div>
    </div>
  </div></div>`;
}
function firstAllowedPage(){ return NAV_ITEMS[0]?NAV_ITEMS[0].key:null; }
async function doLogin(id,pw){
  const u=S.users.find(x=>x.id.toLowerCase()===id.trim().toLowerCase()&&String(x.password)===pw);
  if(!u){S.loginError="Invalid user ID or password.";render();return;}
  S.user=u;S.loginError="";S.sidebarOpen=false;S.logoutAt=nextLogoutTs();S.filters=defaultFilterState();S.page=firstAllowedPage();
  S.cacheLoaded=false;S.lastSync='';S.lastSyncAt=0;S.lastSyncSource='';
  // Load this user's remembered column hide/order/width/sort/page-size settings, then
  // re-apply them onto the small set of grid states that were already created before
  // login (expense/payables/receivables/receipt/payment — see the S object literal
  // above). Every other grid picks up its saved prefs lazily via tableState() itself.
  loadGridPrefsCache_();
  Object.keys(S.dt).forEach(applyPersistedGridPrefs_);
  await hydrateCachedData_();
  // Render the saved snapshot immediately, then replace it once the complete live
  // sync finishes. The current page stays stable throughout the background sync.
  S.syncing=true;render();
  void loadHeavyData(true);
}

function alertCount(){
  const overdueRecv=dataForFY('receivables').filter(r=>Number(r.overdueDays)>0).length;
  const overduePay=dataForFY('payables').filter(r=>Number(r.overdueDays)>0).length;
  return overdueRecv+overduePay;
}

/* ============================= NAV ACTION =============================
 * Purely client-side page switch — no server round-trip on navigation anymore
 * (this was the main cause of slow/blank-feeling page switches; previously every
 * click re-fetched permissions from the LOGIN PAGE sheet before rendering).
 */
function navigateTo(pageKey){
  S.colMenuOpen=null;S.page=pageKey;S.sidebarOpen=false;render();
}

/* ============================= GENERIC GRID ENGINE ============================= */
// GRID_DEFS is populated in Grids.html: { key: {cols:[{key,label,width,pill,num,date}], data:()=>[...] } }
function renderGrid(tableKey){
  const def=GRID_DEFS[tableKey];const st=tableState(tableKey);let rows=def.data().slice();
  const compact=!!def.compact; // compact grids: no pagination UI, just a scrollable box, sort still works
  Object.entries(st.filters).forEach(([k,v])=>{
    if(!v)return;
    const col=def.cols.find(c=>c.key===k);
    if(col&&col.filterType==='select'){
      // Exact-match against one token of a (possibly concatenated) value, e.g. Sales
      // Report's Category column where one invoice can hold "A & B" — filterValues()
      // lets a column supply its own list of matchable tokens per row.
      const getValues=col.filterValues||(r=>[r[k]]);
      rows=rows.filter(r=>getValues(r).some(x=>String(x||'').toLowerCase()===v.toLowerCase()));
    } else {
      rows=rows.filter(r=>String(r[k]??"").toLowerCase().includes(v.toLowerCase()));
    }
  });
  Object.entries(st.dateFilters||{}).forEach(([k,range])=>{
    if(!range||(!range.from&&!range.to))return;
    const from=range.from?new Date(range.from+'T00:00:00').getTime():-Infinity;
    const to=range.to?new Date(range.to+'T23:59:59').getTime():Infinity;
    rows=rows.filter(r=>{const t=parseDT(r[k]);return t!==null&&t>=from&&t<=to;});
  });
  Object.entries(st.numFilters||{}).forEach(([k,range])=>{
    if(!range||(range.min===''||range.min==null)&&(range.max===''||range.max==null))return;
    const min=(range.min===''||range.min==null)?-Infinity:Number(range.min);
    const max=(range.max===''||range.max==null)?Infinity:Number(range.max);
    rows=rows.filter(r=>{const n=Number(r[k]);return !isNaN(n)&&n>=min&&n<=max;});
  });
  if(st.sort){
    const col=def.cols.find(c=>c.key===st.sort);
    const isDateCol=col&&col.date; const isNumCol=col&&col.num;
    rows.sort((a,b)=>{
      let x=a[st.sort],y=b[st.sort];
      if(isDateCol){
        const dx=parseDT(x),dy=parseDT(y);
        const ex=(dx===null),ey=(dy===null);
        if(ex&&ey)return 0; if(ex)return 1; if(ey)return -1;
        return (dx-dy)*st.dir;
      }
      if(isNumCol){
        const nx=Number(x)||0,ny=Number(y)||0;
        return (nx-ny)*st.dir;
      }
      x=String(x??'').toLowerCase();y=String(y??'').toLowerCase();
      if(x<y)return-1*st.dir;if(x>y)return 1*st.dir;return 0;
    });
  }
  const total=rows.length;const ps=compact?total||1:st.pageSize;const tp=Math.max(1,Math.ceil(total/ps));
  if(st.page>tp)st.page=tp;if(st.page<1)st.page=1;
  const si=compact?0:(st.page-1)*ps;const pageRows=compact?rows:rows.slice(si,si+ps);
  const baseKeys=def.cols.map(c=>c.key);
  if(!st.order.length)st.order=baseKeys.slice();
  st.order=st.order.filter(k=>baseKeys.indexOf(k)!==-1).concat(baseKeys.filter(k=>st.order.indexOf(k)===-1));
  const orderedCols=st.order.map(k=>def.cols.find(c=>c.key===k)).filter(Boolean);
  const visCols=orderedCols.filter(c=>!st.hidden.has(c.key));

  const dashboardReport=!!def.dashboardReport;
  const snoTh=`<th style="width:56px;min-width:56px;max-width:56px;"><div class="th-inner"><div class="th-row"><span class="th-label" style="cursor:default;">S.No</span></div></div></th>`;
  let hdr=snoTh+visCols.map(c=>{
    const w=st.widths[c.key]||c.width||150;const si2=st.sort===c.key?(st.dir===1?'▲':'▼'):'';const fo=st.filterOpen===c.key;
    let filterHtml='';
    if(fo){
      if(c.date){
        const df=(st.dateFilters&&st.dateFilters[c.key])||{from:'',to:''};
        filterHtml=`<div class="th-filter th-date-filter"><input type="date" aria-label="From date" data-action="date-from" data-table="${tableKey}" data-col="${c.key}" value="${esc(df.from||'')}"><span class="date-sep">to</span><input type="date" aria-label="To date" data-action="date-to" data-table="${tableKey}" data-col="${c.key}" value="${esc(df.to||'')}">${df.from||df.to?`<span class="dr-clear" title="Clear date range" data-action="clear-daterange" data-table="${tableKey}" data-col="${c.key}">✕</span>`:''}</div>`;
      }else if(c.filterType==='select'){
        const opts=(c.filterOptions?c.filterOptions(def.data()):[]);
        const cur=st.filters[c.key]||'';
        filterHtml=`<div class="th-filter"><select data-action="filter-select" data-table="${tableKey}" data-col="${c.key}"><option value="">All</option>${opts.map(o=>`<option value="${esc(o)}" ${cur===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
      }else if(c.filterType==='number-range'){
        const nf=(st.numFilters&&st.numFilters[c.key])||{min:'',max:''};
        filterHtml=`<div class="th-filter th-num-filter"><input type="number" inputmode="decimal" placeholder="Min" data-action="num-min" data-table="${tableKey}" data-col="${c.key}" value="${esc(nf.min===''||nf.min==null?'':nf.min)}"><span class="date-sep">to</span><input type="number" inputmode="decimal" placeholder="Max" data-action="num-max" data-table="${tableKey}" data-col="${c.key}" value="${esc(nf.max===''||nf.max==null?'':nf.max)}">${(nf.min!==''&&nf.min!=null)||(nf.max!==''&&nf.max!=null)?`<span class="dr-clear" title="Clear price range" data-action="clear-numrange" data-table="${tableKey}" data-col="${c.key}">✕</span>`:''}</div>`;
      }else filterHtml=`<div class="th-filter"><input type="text" placeholder="Filter…" data-action="filter" data-table="${tableKey}" data-col="${c.key}" value="${esc(st.filters[c.key]||'')}"></div>`;
    }
    const searchIcon=c.date?'📅':(c.filterType==='select'||c.filterType==='number-range')?'▾':'⌕';
    const searchTitle=c.date?'Filter by date range':c.filterType==='select'?'Filter this column':c.filterType==='number-range'?'Filter by price range':'Search this column';
    return `<th style="width:${w}px;min-width:${w}px;max-width:${w}px;" data-col="${c.key}">
      <div class="th-inner"><div class="th-row">
        <span class="th-label" data-action="sort" data-table="${tableKey}" data-col="${c.key}">${esc(c.label)}</span>
        <span class="sort-ic">${si2}</span>
        <span class="search-ic" title="${searchTitle}" data-action="togglesearch" data-table="${tableKey}" data-col="${c.key}">${searchIcon}</span>
      </div>
      ${filterHtml}
      <div class="resize-handle" data-action="resize" data-table="${tableKey}" data-col="${c.key}"></div>
      </div></th>`;
  }).join("");
  if(dashboardReport){
    hdr=visCols.map(c=>{
      const w=st.widths[c.key]||c.width||150;
      const reportWidth=c.reportWidth?`width:${c.reportWidth};min-width:0;max-width:none;`:`width:${w}px;min-width:${w}px;max-width:${w}px;`;
      const sortIcon=st.sort===c.key?(st.dir===1?'▲':'▼'):'';
      return `<th style="${reportWidth}" data-col="${c.key}"><div class="th-inner"><div class="th-row"><span class="th-label" data-action="sort" data-table="${tableKey}" data-col="${c.key}">${esc(c.label)}</span><span class="sort-ic">${sortIcon}</span></div></div></th>`;
    }).join('');
  }

  function cellVal(r,c){
    const v=r[c.key]==null?"":r[c.key];
    if(c.currency)return fmtINRCompact(v);
    if(c.num)return fmtNum(v);
    return v;
  }
  function dashboardReportCell_(r,c,rawValue,formattedValue){
    if(c.compactName){
      const marker=c.reportTone==='category'?`<span class="dreport-color-dot" style="background:${esc(r.color||'var(--accent)')};"></span>`:'';
      return `<span class="dreport-name" title="${esc(rawValue)}">${marker}<span class="dreport-ellipsis">${esc(formattedValue)}</span></span>`;
    }
    if(c.reportTone==='overdue'){
      const days=Number(rawValue)||0;
      const tone=days>60?'danger':days>20?'warning':'success';
      return `<span class="dreport-overdue ${tone}">${esc(formattedValue)}</span>`;
    }
    return `<span class="dreport-money ${esc(c.reportTone||'')}">${esc(formattedValue)}</span>`;
  }
  const bod=pageRows.length?pageRows.map((r,idx)=>{
    const reportCells=visCols.map(c=>{
      const raw=r[c.key]==null?"":r[c.key],v=cellVal(r,c),cls=[c.num?'num':'',dashboardReport?'dreport-cell':''].filter(Boolean).join(' ');
      const content=dashboardReport?dashboardReportCell_(r,c,raw,v):c.render?c.render(r,v,si+idx):c.pill&&r[c.key]?`<span class="code-pill">${esc(v)}</span>`:esc(v);
      // Title also placed directly on the <td> (not just the inner span) so the full
      // party/category name always shows on hover, no matter where over the cell the
      // cursor lands — this is what fixes the "hover doesn't show full name" report.
      const cellTitle=(dashboardReport&&c.compactName)?` title="${esc(raw)}"`:'';
      return `<td class="${cls}"${cellTitle}>${content}</td>`;
    }).join("");
    const sno=dashboardReport?'':`<td style="text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11.5px;">${si+idx+1}</td>`;
    return `<tr>${sno}${reportCells}</tr>`;
  }).join(""):`<tr><td colspan="${visCols.length+(dashboardReport?0:1)}"><div class="empty-state"><div class="big">No matching rows</div>Filters adjust karke dekho, ya abhi koi data nahi hai.</div></td></tr>`;
  const rf=total===0?0:si+1;const rt=Math.min(si+ps,total);

  const mcards=pageRows.length?pageRows.map((r,idx)=>renderMobileCard(tableKey,r,si+idx+1)).join(''):`<div class="empty-state"><div class="big">No matching rows</div></div>`;

  if(compact){
    // Compact mode (dashboard mini-tables): no pagination footer/toolbar, just a
    // fixed-height scrollable table. Sorting by clicking a header still works.
    return `<div class="dt-table-wrap compact${dashboardReport?` dashboard-report dashboard-report-${esc(def.reportType||'')}`:''}"><div class="dt-scroll"><table class="dt"><thead><tr>${hdr}</tr></thead><tbody>${bod}</tbody></table></div></div><div class="mcard-list">${mcards}</div>`;
  }

  return `
    <div class="dt-toolbar">
      <div class="count">${total} of ${def.data().length} rows</div>
      <button class="btn btn-ghost" data-action="syncnow" style="padding:7px 14px;">${S.syncing?'⟳ Refreshing…':'⟳ Refresh'}</button>
      <div class="dt-colmenu-wrap">
        <button class="btn btn-ghost" data-action="togglecolmenu" data-table="${tableKey}" style="padding:7px 14px;">Columns ▾</button>
        ${S.colMenuOpen===tableKey?`<div class="dt-colmenu"><div class="h">Show / hide / shift columns</div>${orderedCols.map((c,i)=>`<div class="dt-colmenu-row"><label><input type="checkbox" data-action="togglecol" data-table="${tableKey}" data-col="${c.key}" ${st.hidden.has(c.key)?'':'checked'}> <span>${esc(c.label)}</span></label><div class="col-shift"><button type="button" title="Shift left" data-action="movecol-left" data-table="${tableKey}" data-col="${c.key}" ${i===0?'disabled':''}>←</button><button type="button" title="Shift right" data-action="movecol-right" data-table="${tableKey}" data-col="${c.key}" ${i===orderedCols.length-1?'disabled':''}>→</button></div></div>`).join("")}</div>`:""}
      </div>
    </div>
    <div class="dt-table-wrap">
      <div class="dt-scroll"><table class="dt"><thead><tr>${hdr}</tr></thead><tbody>${bod}</tbody></table></div>
    </div>
    <div class="mcard-list">${mcards}</div>
    <div class="dt-pagination">
      <div class="pp">Rows per page: <select data-action="pagesize" data-table="${tableKey}">${PAGE_SIZE_OPTIONS.map(n=>`<option value="${n}" ${st.pageSize===n?'selected':''}>${n}</option>`).join("")}</select></div>
      <div>${total===0?'0':`${rf}–${rt}`} of ${total}</div>
      <div class="nav">
        <button data-action="pagefirst" data-table="${tableKey}" ${st.page<=1?'disabled':''}>«</button>
        <button data-action="pageprev" data-table="${tableKey}" ${st.page<=1?'disabled':''}>‹</button>
        <span class="pageinfo">${st.page} / ${tp}</span>
        <button data-action="pagenext" data-table="${tableKey}" ${st.page>=tp?'disabled':''}>›</button>
        <button data-action="pagelast" data-table="${tableKey}" ${st.page>=tp?'disabled':''}>»</button>
      </div>
    </div>`;
}

// Mobile card fallback renderer — each grid def can supply mcard(r) for a custom layout;
// otherwise falls back to a generic title/amount/grid card built from the column list.
function renderMobileCard(tableKey,r,sno){
  const def=GRID_DEFS[tableKey];
  if(def.mcard) return def.mcard(r,sno);
  const titleCol=def.cols[0];
  const amtCol=def.cols.find(c=>c.num);
  const rest=def.cols.filter(c=>c!==titleCol&&c!==amtCol).slice(0,6);
  return `<div class="mcard">
    <div class="mcard-top">
      <div><div class="mcard-title">${esc(r[titleCol.key]||'')}</div></div>
      ${amtCol?`<div class="mcard-amt">${fmtINR(r[amtCol.key])}</div>`:''}
    </div>
    <div class="mcard-grid">${rest.map(c=>`<div class="k">${esc(c.label)}</div><div class="v">${esc(r[c.key]||'')}</div>`).join('')}</div>
  </div>`;
}

/* ============================= EVENTS ============================= */
let resizeCtx=null,filterTimer=null;

document.addEventListener('submit',e=>{if(e.target&&e.target.id==='loginForm'){e.preventDefault();doLogin(document.getElementById('loginId').value,document.getElementById('loginPw').value);}});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.getAttribute('data-action')==='filter'){
    const t=el.getAttribute('data-table'),c=el.getAttribute('data-col');
    tableState(t).filters[c]=el.value;
    clearTimeout(filterTimer);
    filterTimer=setTimeout(()=>{S.dt[t].page=1;const pos=el.selectionStart;render();
      const ag=document.querySelector(`input[data-action="filter"][data-table="${t}"][data-col="${c}"]`);
      if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },350);
    return;
  }
  if(el.getAttribute('data-action')==='ledger-search'){
    S.ledger.search=el.value;
    clearTimeout(filterTimer);
    filterTimer=setTimeout(()=>{const pos=el.selectionStart;render();
      const ag=document.querySelector('input[data-action="ledger-search"]');
      if(ag){ag.focus();ag.setSelectionRange(pos,pos);}
    },250);
  }
});

document.addEventListener('change',e=>{
  const el=e.target,a=el.getAttribute('data-action');
  if(a==='pagesize'){const t=el.getAttribute('data-table');tableState(t).pageSize=parseInt(el.value,10);tableState(t).page=1;persistGridPrefs_(t);render();return;}
  if(a==='date-from'||a==='date-to'){
    const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t);
    if(!st.dateFilters[c])st.dateFilters[c]={from:'',to:''};
    st.dateFilters[c][a==='date-from'?'from':'to']=el.value;st.page=1;st.filterOpen=c;render();return;
  }
  if(a==='filter-select'){
    const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t);
    st.filters[c]=el.value;st.page=1;render();return;
  }
  if(a==='num-min'||a==='num-max'){
    const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t);
    if(!st.numFilters)st.numFilters={};
    if(!st.numFilters[c])st.numFilters[c]={min:'',max:''};
    st.numFilters[c][a==='num-min'?'min':'max']=el.value===''?'':Number(el.value);
    st.page=1;st.filterOpen=c;render();return;
  }
});

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.getAttribute('data-action');
  if(a==='open-sidebar'){S.sidebarOpen=true;render();return;}
  if(a==='close-sidebar'){S.sidebarOpen=false;render();return;}
  if(a==='toggle-theme'){
    S.darkMode=!S.darkMode;
    document.documentElement.classList.toggle('dark',S.darkMode);
    try{localStorage.setItem('tally_dark_mode',S.darkMode?'true':'false');}catch(e){}
    render();return;
  }
  if(a==='nav'){navigateTo(el.getAttribute('data-page'));return;}
  if(a==='ageing-nav-toggle'){S.ageingOpen=!S.ageingOpen;render();return;}
  if(a==='goto'){navigateTo(el.getAttribute('data-page'));return;}
  if(a==='logout'){void writeCachedSnapshot_();S.user=null;S.page=null;S.sidebarOpen=false;S.logoutAt=0;render();return;}
  if(a==='syncnow'){refreshData();return;}
  if(a==='dismiss-diag'){S.diagBannerDismissed=true;render();return;}
  if(a==='sort'){const t=el.getAttribute('data-table'),c=el.getAttribute('data-col');const st=tableState(t);if(st.sort===c)st.dir*=-1;else{st.sort=c;st.dir=1;}st.page=1;persistGridPrefs_(t);render();return;}
  if(a==='pagefirst'){tableState(el.getAttribute('data-table')).page=1;render();return;}
  if(a==='pageprev'){const st=tableState(el.getAttribute('data-table'));st.page=Math.max(1,st.page-1);render();return;}
  if(a==='pagenext'){tableState(el.getAttribute('data-table')).page++;render();return;}
  if(a==='pagelast'){tableState(el.getAttribute('data-table')).page=999999;render();return;}
  if(a==='togglesearch'){const t=el.getAttribute('data-table'),c=el.getAttribute('data-col');const st=tableState(t);
    st.filterOpen=st.filterOpen===c?null:c;render();if(st.filterOpen){const inp=document.querySelector(`input[data-table="${t}"][data-col="${c}"]`);if(inp)inp.focus();}return;}
  if(a==='clear-daterange'){const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t);delete st.dateFilters[c];st.page=1;st.filterOpen=c;render();return;}
  if(a==='clear-numrange'){const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t);if(st.numFilters)delete st.numFilters[c];st.page=1;st.filterOpen=c;render();return;}
  if(a==='togglecolmenu'){const t=el.getAttribute('data-table');S.colMenuOpen=S.colMenuOpen===t?null:t;render();return;}
  if(a==='togglecol'){const t=el.getAttribute('data-table'),c=el.getAttribute('data-col');const st=tableState(t);if(st.hidden.has(c))st.hidden.delete(c);else st.hidden.add(c);persistGridPrefs_(t);render();S.colMenuOpen=t;return;}
  if(a==='movecol-left'||a==='movecol-right'){
    const t=el.getAttribute('data-table'),c=el.getAttribute('data-col'),st=tableState(t),i=st.order.indexOf(c),j=a==='movecol-left'?i-1:i+1;
    if(i>=0&&j>=0&&j<st.order.length){const tmp=st.order[i];st.order[i]=st.order[j];st.order[j]=tmp;}persistGridPrefs_(t);render();S.colMenuOpen=t;return;
  }
  if(a==='select-party'){selectLedgerParty(el.getAttribute('data-name'));return;}
  if(a==='ledger-print'){window.print();return;}
});
document.addEventListener('click',e=>{if(!e.target.closest('.dt-colmenu-wrap')&&S.colMenuOpen){S.colMenuOpen=null;render();}});

document.addEventListener('mousedown',e=>{
  const el=e.target.closest('[data-action="resize"]');if(!el)return;
  const t=el.getAttribute('data-table'),c=el.getAttribute('data-col');const th=el.closest('th');
  el.classList.add('active');resizeCtx={t,c,el,startX:e.clientX,startW:th.getBoundingClientRect().width};e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!resizeCtx)return;const nw=Math.max(60,Math.round(resizeCtx.startW+(e.clientX-resizeCtx.startX)));
  const th=document.querySelector(`table.dt th[data-col="${resizeCtx.c}"]`);
  if(th){th.style.width=nw+'px';th.style.minWidth=nw+'px';th.style.maxWidth=nw+'px';}
});
document.addEventListener('mouseup',e=>{
  if(!resizeCtx)return;
  tableState(resizeCtx.t).widths[resizeCtx.c]=Math.max(60,Math.round(resizeCtx.startW+(e.clientX-resizeCtx.startX)));
  persistGridPrefs_(resizeCtx.t);
  resizeCtx.el.classList.remove('active');resizeCtx=null;render();
});

/* ============================= RENDER ============================= */
const PAGE_RENDERERS={};
function registerPage(key,fn){ PAGE_RENDERERS[key]=fn; }

function render(){
  const app=document.getElementById('app');
  if(!S.ready){app.innerHTML=`<div class="loading-screen"><div class="spinner"></div><div>Loading dashboard…</div></div>`;return;}
  if(S.loadError){app.innerHTML=`<div class="login-wrap"><div class="login-card"><div class="login-top"><div class="login-eyebrow">Setup</div><h1>Sheet load failed</h1></div><div class="login-body"><div class="login-error">${esc(S.loadError)}</div><div class="login-hint">1) Open via the Apps Script <b>/exec</b> URL. 2) Required tabs: LOGIN PAGE, EXPENSE, PAYABLES, RECEIVABLES, Receipt, PAYMENT, Balance. 3) Deploy access = "Anyone".</div><button class="btn btn-primary btn-block" style="margin-top:14px;" data-action="syncnow">Retry</button></div></div></div>`;return;}
  if(!S.user){app.innerHTML=renderLogin();return;}
  if(!S.filters)S.filters=defaultFilterState();
  // Root rendering replaces `.content`, so retain both the page and table positions.
  // This keeps the screen still while cached data is replaced by the completed live sync.
  const content=document.querySelector('.content');
  const savedContentScroll={left:content?content.scrollLeft:0,top:content?content.scrollTop:0};
  const dtScroll=document.querySelector('.dt-scroll');
  const savedDtScroll={left:dtScroll?dtScroll.scrollLeft:0,top:dtScroll?dtScroll.scrollTop:0};
  let inner="";
  if(S.syncing && !hasAnyData()){
    inner=`<div class="empty-state" style="padding-top:80px;"><div class="spinner" style="margin:0 auto 16px;"></div><div class="big">Loading data…</div><div style="margin-top:6px;">Aapka data background mein load ho raha hai, kuch seconds lagenge.</div></div>`;
  } else if(PAGE_RENDERERS[S.page]){
    inner=PAGE_RENDERERS[S.page]();
  } else if(S.page==='ledger'){
    inner=renderLedgerPage();
  } else if(GRID_DEFS[S.page]){
    inner=renderGrid(S.page);
  } else {
    inner=`<div class="empty-state"><div class="big">Select a page</div>Left mein menu se apna page choose karein.</div>`;
  }
  const issues=shouldShowDiagBanner()?diagnosticIssues():[];
  if(issues.length){
    inner=`<div class="login-error" style="margin-bottom:14px;position:relative;padding-right:32px;line-height:1.6;">
      <div style="font-weight:700;margin-bottom:6px;">⚠ Data Diagnostics — no data came back from your Google Sheet:</div>
      <ul style="margin:0 0 0 18px;padding:0;">${issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      <div style="margin-top:8px;font-size:11px;opacity:.85;">Fix the sheet, then click "Sync with Tally" in the sidebar — no need to redeploy the app.</div>
      <span data-action="dismiss-diag" style="position:absolute;top:10px;right:12px;cursor:pointer;font-weight:700;">✕</span>
    </div>${inner}`;
  }
  app.innerHTML=renderShell(inner);
  const restoreScroll=()=>{
    const content2=document.querySelector('.content');
    if(content2){content2.scrollLeft=savedContentScroll.left;content2.scrollTop=savedContentScroll.top;}
    const dtScroll2=document.querySelector('.dt-scroll');
    if(dtScroll2){dtScroll2.scrollLeft=savedDtScroll.left;dtScroll2.scrollTop=savedDtScroll.top;}
  };
  restoreScroll();
  setTimeout(()=>{paintCharts();if(S.page==='mapView'&&typeof paintIndiaMap==='function')paintIndiaMap();restoreScroll();},0);
}

loadAll();
</script>

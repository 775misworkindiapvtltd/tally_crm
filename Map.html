<script>
/* ============================= INDIA SALES MAP =============================
 * State-wise sales built from the SALES sheet's "state" column (see Code.gs
 * mapSalesRows_). Click a state to zoom in and see its city-wise breakdown
 * (SALES sheet's "city"/"district"/"place" column). Falls back to a plain
 * ranked list (no map shape) if the GeoJSON can't be fetched — e.g. no
 * internet in the browser viewing the /exec URL — so the feature still works.
 */
let INDIA_GEOJSON=null, indiaGeoLoadPromise=null, mapLoadError='';

// Maps free-text state values from the sheet to the exact "st_nm" property used
// by the GeoJSON, so typos/short forms/alternate spellings still match a shape.
const STATE_NAME_ALIASES={
  'ANDAMAN AND NICOBAR ISLANDS':'Andaman & Nicobar Island','ANDAMAN & NICOBAR ISLANDS':'Andaman & Nicobar Island',
  'ANDHRA PRADESH':'Andhra Pradesh','AP':'Andhra Pradesh',
  'ARUNACHAL PRADESH':'Arunanchal Pradesh','ARUNANCHAL PRADESH':'Arunanchal Pradesh',
  'ASSAM':'Assam','BIHAR':'Bihar','CHANDIGARH':'Chandigarh',
  'CHHATTISGARH':'Chhattisgarh','CHATTISGARH':'Chhattisgarh',
  'DADRA AND NAGAR HAVELI':'Dadara & Nagar Havelli','DAMAN AND DIU':'Daman & Diu',
  'GOA':'Goa','GUJARAT':'Gujarat','HARYANA':'Haryana',
  'HIMACHAL PRADESH':'Himachal Pradesh','HP':'Himachal Pradesh',
  'JAMMU AND KASHMIR':'Jammu & Kashmir','JAMMU & KASHMIR':'Jammu & Kashmir','J&K':'Jammu & Kashmir',
  'JHARKHAND':'Jharkhand','KARNATAKA':'Karnataka','KERALA':'Kerala','LAKSHADWEEP':'Lakshadweep',
  'MADHYA PRADESH':'Madhya Pradesh','MP':'Madhya Pradesh',
  'MAHARASHTRA':'Maharashtra','MANIPUR':'Manipur','MEGHALAYA':'Meghalaya','MIZORAM':'Mizoram',
  'NAGALAND':'Nagaland','DELHI':'NCT of Delhi','NEW DELHI':'NCT of Delhi','NCT OF DELHI':'NCT of Delhi',
  'ODISHA':'Odisha','ORISSA':'Odisha','PUDUCHERRY':'Puducherry','PONDICHERRY':'Puducherry',
  'PUNJAB':'Punjab','RAJASTHAN':'Rajasthan','SIKKIM':'Sikkim',
  'TAMIL NADU':'Tamil Nadu','TAMILNADU':'Tamil Nadu','TN':'Tamil Nadu',
  'TELANGANA':'Telangana','TRIPURA':'Tripura',
  'UTTAR PRADESH':'Uttar Pradesh','UP':'Uttar Pradesh',
  'UTTARAKHAND':'Uttarakhand','UTTRANCHAL':'Uttarakhand',
  'WEST BENGAL':'West Bengal','WB':'West Bengal'
};
function normalizeStateName_(raw){
  const key=String(raw||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!key)return '';
  if(STATE_NAME_ALIASES[key])return STATE_NAME_ALIASES[key];
  // fall back to a loose contains-match against known canonical names
  const canon=Object.values(STATE_NAME_ALIASES);
  const found=canon.find(c=>c.toUpperCase()===key);
  return found||raw;
}

// Multiple mirrors, tried in order — the first one that returns a valid
// FeatureCollection wins. Any single source going down (404/CORS/etc, exactly
// what happened with the old single hardcoded URL) no longer breaks the map.
const INDIA_GEOJSON_SOURCES=[
  'https://gist.githubusercontent.com/jbrobst/56c13bbbf9d97d187fea01ca62ea5112/raw/e388c4cae20aa53cb5090210a42ebb9b765c0a36/india_states.geojson',
  'https://cdn.jsdelivr.net/gh/udit-001/india-maps-data/geojson/india.geojson',
  'https://cdn.jsdelivr.net/gh/adarshbiradar/maps-geojson/geojson/india.geojson'
];
function ensureIndiaGeoJson(){
  if(INDIA_GEOJSON)return Promise.resolve(INDIA_GEOJSON);
  if(indiaGeoLoadPromise)return indiaGeoLoadPromise;
  indiaGeoLoadPromise=(async()=>{
    let lastErr=new Error('No map sources configured');
    for(const url of INDIA_GEOJSON_SOURCES){
      try{
        const r=await fetch(url);
        if(!r.ok) throw new Error('HTTP '+r.status+' from '+url);
        const gj=await r.json();
        if(!gj||!Array.isArray(gj.features)||!gj.features.length) throw new Error('Empty/invalid GeoJSON from '+url);
        INDIA_GEOJSON=gj;
        return gj;
      }catch(err){ lastErr=err; }
    }
    mapLoadError=lastErr.message;
    throw lastErr;
  })();
  return indiaGeoLoadPromise;
}
// Lets the user retry after every source failed (e.g. temporary network issue),
// instead of being stuck with the first failed attempt for the rest of the session.
function retryIndiaMap(){ INDIA_GEOJSON=null;indiaGeoLoadPromise=null;mapLoadError='';paintIndiaMap(); }

/* ============================= DATA AGGREGATION ============================= */
// Extract city name from an address string when no dedicated CITY column exists.
// Indian addresses typically end with: "..., City Name, State - Pincode" or
// "..., City Name - Pincode" or "..., City Name, Pincode". We grab the most
// likely city token: the part just before the pincode or state suffix.
function extractCityFromAddress_(address){
  if(!address)return '';
  let s=String(address).trim();
  // Remove trailing pincode (6 digits, optional dash/space prefix)
  s=s.replace(/[-\s]*\d{6}\s*$/,'').trim();
  // Remove trailing state name (if it matches known states)
  const stateNames=Object.values(STATE_NAME_ALIASES);
  const upper=s.toUpperCase();
  for(const st of stateNames){
    const stUp=st.toUpperCase();
    if(upper.endsWith(stUp)||upper.endsWith(', '+stUp)){
      s=s.slice(0,-(st.length)).replace(/,\s*$/,'').trim();
      break;
    }
  }
  // The last comma-separated segment is likely the city
  const parts=s.split(/[,\n]+/).map(p=>p.trim()).filter(Boolean);
  if(parts.length>=2){
    const last=parts[parts.length-1];
    // Skip if it's a PO Box/Plot/Floor/Sector kind of token
    if(!/^\d|^plot|^floor|^sector|^unit|^flat|^block|^house/i.test(last)&&last.length>2){
      return last.replace(/\s+/g,' ');
    }
  }
  return parts.length?parts[parts.length-1].replace(/\s+/g,' '):'';
}

function salesByState_(){
  const rows=dataForFY('sales'); const map={};
  rows.forEach(r=>{
    const raw=String(r.state||'').trim(); if(!raw)return;
    const canon=normalizeStateName_(raw);
    if(!map[canon])map[canon]={state:canon,amount:0,invoices:0,cities:{}};
    map[canon].amount+=Number(r.amount)||0; map[canon].invoices++;
    // City: use dedicated city field first; fallback to extracting from address
    const city=(String(r.city||'').trim()||extractCityFromAddress_(r.address))||'Unspecified';
    if(!map[canon].cities[city])map[canon].cities[city]={city,amount:0,invoices:0};
    map[canon].cities[city].amount+=Number(r.amount)||0; map[canon].cities[city].invoices++;
  });
  return map;
}
function cityRowsForState_(stateData){
  if(!stateData)return [];
  return Object.values(stateData.cities).sort((a,b)=>b.amount-a.amount);
}

// Short "₹58.7L / ₹2.98Cr" style label so the pin badge stays small on the map,
// while the full precise amount is still shown in the side list and tooltip.
function fmtCompactINR_(n){
  n=Number(n)||0;
  if(Math.abs(n)>=1e7) return '₹'+(n/1e7).toFixed(2)+'Cr';
  if(Math.abs(n)>=1e5) return '₹'+(n/1e5).toFixed(2)+'L';
  if(Math.abs(n)>=1e3) return '₹'+(n/1e3).toFixed(1)+'K';
  return fmtINR(n);
}

/* ============================= MAP KPI CARDS ============================= */
function renderMapKpiCards_(byState){
  const stateRows=Object.values(byState).sort((a,b)=>b.amount-a.amount);
  const totalSales=stateRows.reduce((s,r)=>s+r.amount,0);
  const statesWithSales=stateRows.filter(r=>r.amount>0).length;
  const topState=stateRows.length?stateRows[0]:null;
  const avgPerState=statesWithSales?totalSales/statesWithSales:0;
  return `<div class="map-kpi-strip">
    <div class="map-kpi-card"><div class="card-icon c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><div class="map-kpi-body"><span class="card-label">Total Sales</span><span class="card-value">${fmtINR(totalSales)}</span></div></div>
    <div class="map-kpi-card"><div class="card-icon c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="map-kpi-body"><span class="card-label">States with Sales</span><span class="card-value">${statesWithSales}</span></div></div>
    <div class="map-kpi-card"><div class="card-icon c-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="map-kpi-body"><span class="card-label">Top State</span><span class="card-value">${topState?esc(topState.state):'--'}</span><span class="card-sub">${topState?fmtINR(topState.amount):''}</span></div></div>
    <div class="map-kpi-card"><div class="card-icon c-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg></div><div class="map-kpi-body"><span class="card-label">Avg per State</span><span class="card-value">${fmtINR(avgPerState)}</span></div></div>
  </div>`;
}

/* ============================= TOP CUSTOMERS PER STATE ============================= */
function topCustomersForState_(stateName){
  const rows=dataForFY('sales');
  const customers={};
  rows.forEach(r=>{
    const raw=String(r.state||'').trim(); if(!raw)return;
    const canon=normalizeStateName_(raw);
    if(canon!==stateName)return;
    const name=String(r.invoiceTo||'').trim(); if(!name)return;
    const key=name.toLowerCase();
    if(!customers[key])customers[key]={name:name,amount:0,invoices:0};
    customers[key].amount+=Number(r.amount)||0;
    customers[key].invoices++;
  });
  return Object.values(customers).sort((a,b)=>b.amount-a.amount).slice(0,5);
}

/* ============================= CITY SORTABLE TABLE ============================= */
// S.map.citySortCol: 'city'|'amount'|'invoices'|'share', S.map.citySortDir: 1|-1
function renderCityTable_(cityRows, stateTotal){
  if(!S.map.citySortCol) S.map.citySortCol='amount';
  if(!S.map.citySortDir) S.map.citySortDir=-1;
  const col=S.map.citySortCol, dir=S.map.citySortDir;
  const sorted=cityRows.slice().sort((a,b)=>{
    if(col==='city') return dir*a.city.localeCompare(b.city);
    if(col==='share') return dir*((a.amount/(stateTotal||1))-(b.amount/(stateTotal||1)));
    return dir*((a[col]||0)-(b[col]||0));
  });
  const arrow=d=>d===1?'▲':'▼';
  const thClass=k=>col===k?'map-th-active':'';
  return `<div class="map-city-table-wrap"><table class="map-city-table">
    <thead><tr>
      <th class="${thClass('city')}" data-action="map-city-sort" data-col="city">City ${col==='city'?arrow(dir):''}</th>
      <th class="${thClass('amount')} num" data-action="map-city-sort" data-col="amount">Amount ${col==='amount'?arrow(dir):''}</th>
      <th class="${thClass('invoices')} num" data-action="map-city-sort" data-col="invoices">Invoices ${col==='invoices'?arrow(dir):''}</th>
      <th class="${thClass('share')} num" data-action="map-city-sort" data-col="share">% Share ${col==='share'?arrow(dir):''}</th>
    </tr></thead>
    <tbody>${sorted.map(c=>{
      const pct=stateTotal?(c.amount/stateTotal*100):0;
      return `<tr><td>${esc(c.city)}</td><td class="num">${fmtINR(c.amount)}</td><td class="num">${c.invoices}</td><td class="num">${pct.toFixed(1)}%</td></tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

/* ============================= SEARCH STATE ============================= */
function renderMapSearchBox_(){
  const q=S.map.searchQuery||'';
  return `<div class="map-search-box"><input type="text" class="map-search-input" placeholder="Search state..." value="${esc(q)}" data-action="map-search-input" /><span class="map-search-icon">🔍</span></div>`;
}

/* ============================= RENDER ============================= */
function renderMapView(){
  const byState=salesByState_();
  const stateRows=Object.values(byState).sort((a,b)=>b.amount-a.amount);
  const totalAmt=stateRows.reduce((s,r)=>s+r.amount,0)||1;
  const selState=S.map.selectedState;
  const selData=selState?byState[selState]:null;
  const cityRows=selData?cityRowsForState_(selData):[];
  const topCustomers=selState?topCustomersForState_(selState):[];

  // Filter states by search query
  const searchQ=(S.map.searchQuery||'').toLowerCase();
  const filteredStates=searchQ?stateRows.filter(s=>s.state.toLowerCase().includes(searchQ)):stateRows;

  return `
  ${renderFilterBar()}
  ${renderMapKpiCards_(byState)}
  <div class="map-shell">
    <div class="map-panel">
      <div class="map-toolbar">
        <div class="map-title">${selState?esc(selState):'India Sales Map'}</div>
        ${renderMapSearchBox_()}
        <div class="map-zoom-controls">
          ${selState?`<button class="btn btn-ghost" data-action="map-back">\u2190 All India</button>`:''}
          <button class="btn btn-ghost" data-action="map-zoom" data-dir="in" title="Zoom in">+</button>
          <button class="btn btn-ghost" data-action="map-zoom" data-dir="out" title="Zoom out">\u2212</button>
          <button class="btn btn-ghost" data-action="map-zoom" data-dir="reset" title="Reset zoom">\u2934</button>
        </div>
      </div>
      <div class="map-canvas-wrap" id="mapCanvasWrap">
        <div class="empty-state"><div class="spinner" style="margin:0 auto 12px;"></div><div class="big">Loading map\u2026</div></div>
      </div>
      <div class="map-legend">
        <span>Low</span><div class="map-legend-bar"></div><span>High</span>
        <span style="margin-left:auto;color:var(--muted);">Click a state to see city-wise sales</span>
      </div>
    </div>
    <div class="map-side">
      <div class="panel-title" style="background:transparent;border:0;padding:0 0 10px;">${selState?`Cities in ${esc(selState)}`:'Top States by Sales'}</div>
      <div class="map-list">
        ${selState?
          (cityRows.length?renderCityTable_(cityRows, selData.amount):`<div class="empty-state"><div class="big">No city data</div>Is state ke liye SALES sheet mein city/district column nahi mila.</div>`)
          :
          (filteredStates.length?filteredStates.map(s=>`<div class="map-list-row" data-action="map-select-state" data-state="${esc(s.state)}"><div class="mlr-name">${esc(s.state)}</div><div class="mlr-track"><div class="mlr-fill" style="width:${Math.max(4,s.amount/totalAmt*100)}%;"></div></div><div class="mlr-val">${fmtINR(s.amount)}</div></div>`).join(''):`<div class="empty-state"><div class="big">${searchQ?'No matching states':'No state data'}</div>${searchQ?'Try a different search term.':'SALES sheet mein State column nahi mila ya khaali hai.'}</div>`)
        }
      </div>
      ${selState&&topCustomers.length?`
      <div class="panel-title" style="background:transparent;border:0;padding:10px 0 6px;border-top:1px solid var(--line-light);margin-top:10px;">Top Customers in ${esc(selState)}</div>
      <div class="map-customers-list">${topCustomers.map((c,i)=>`<div class="map-cust-row"><span class="map-cust-rank">${i+1}</span><span class="map-cust-name" title="${esc(c.name)}">${esc(c.name)}</span><span class="map-cust-amt">${fmtINR(c.amount)}</span><span class="map-cust-inv">${c.invoices} inv</span></div>`).join('')}</div>`:''}
    </div>
  </div>`;
}
registerPage('mapView',renderMapView);

/* ============================= SVG DRAWING ============================= */
// Minimal GeoJSON (Polygon/MultiPolygon, lon/lat) -> SVG path converter — no
// external geo library needed. Equirectangular projection is fine at country scale.
function geoPathD_(geometry,project){
  const ring2d=ring=>'M'+ring.map(([lon,lat])=>project(lon,lat).join(',')).join('L')+'Z';
  if(geometry.type==='Polygon') return geometry.coordinates.map(ring2d).join(' ');
  if(geometry.type==='MultiPolygon') return geometry.coordinates.map(poly=>poly.map(ring2d).join(' ')).join(' ');
  return '';
}
function geometryBounds_(geometry){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const scan=ring=>ring.forEach(([lon,lat])=>{ if(lon<minX)minX=lon; if(lon>maxX)maxX=lon; if(lat<minY)minY=lat; if(lat>maxY)maxY=lat; });
  if(geometry.type==='Polygon') geometry.coordinates.forEach(scan);
  else if(geometry.type==='MultiPolygon') geometry.coordinates.forEach(poly=>poly.forEach(scan));
  return {minX,minY,maxX,maxY};
}

// Polygon centroid (shoelace-weighted), used to place each state's "location pin"
// INSIDE its actual shape instead of at the plain bounding-box center (which can
// land outside oddly-shaped states). Falls back to a plain point average for
// degenerate rings (near-zero area) so it never divides by zero.
function ringArea2_(ring){
  let a=0;
  for(let i=0;i<ring.length-1;i++){ const x1=ring[i][0],y1=ring[i][1],x2=ring[i+1][0],y2=ring[i+1][1]; a+=x1*y2-x2*y1; }
  return a/2;
}
function ringCentroid_(ring){
  let cx=0,cy=0,area=0;
  for(let i=0;i<ring.length-1;i++){
    const x1=ring[i][0],y1=ring[i][1],x2=ring[i+1][0],y2=ring[i+1][1];
    const cross=x1*y2-x2*y1;
    area+=cross; cx+=(x1+x2)*cross; cy+=(y1+y2)*cross;
  }
  area/=2;
  if(Math.abs(area)<1e-9){
    let sx=0,sy=0; ring.forEach(p=>{sx+=p[0];sy+=p[1];});
    return [sx/ring.length,sy/ring.length];
  }
  return [cx/(6*area),cy/(6*area)];
}
function geometryCentroidLonLat_(geometry){
  if(geometry.type==='Polygon') return ringCentroid_(geometry.coordinates[0]);
  if(geometry.type==='MultiPolygon'){
    // Use the largest sub-polygon (e.g. mainland vs. small offshore islands) so the
    // pin lands on the main landmass rather than an average that could fall in the sea.
    let best=null,bestArea=-1;
    geometry.coordinates.forEach(poly=>{
      const a=Math.abs(ringArea2_(poly[0]));
      if(a>bestArea){bestArea=a;best=poly[0];}
    });
    return best?ringCentroid_(best):[0,0];
  }
  return [0,0];
}

// Evenly spaced grid of points inside a screen-space box — used to place city pins
// for the selected state. Uses heavy inward padding (30%) so pins stay well within
// the visible state shape rather than landing in the bounding box corners that may
// fall outside the actual irregular state boundary.
function gridPositions_(n,x0,y0,x1,y1){
  if(n<=0)return [];
  const cols=Math.max(1,Math.ceil(Math.sqrt(n)));
  const rows=Math.max(1,Math.ceil(n/cols));
  const padX=(x1-x0)*0.35, padY=(y1-y0)*0.35;
  const gx0=x0+padX, gx1=x1-padX, gy0=y0+padY, gy1=y1-padY;
  const stepX=cols>1?(gx1-gx0)/(cols-1):0, stepY=rows>1?(gy1-gy0)/(rows-1):0;
  const pts=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols;
    pts.push([cols>1?gx0+c*stepX:(gx0+gx1)/2, rows>1?gy0+r*stepY:(gy0+gy1)/2]);
  }
  return pts;
}

// City marker (state drill-down) — shows amount badge on top, city name below
// the pin in a readable label. More visually attractive than the state marker.
function cityMarkerSvg_(x,y,amount,cityName){
  const label=fmtCompactINR_(amount);
  const labelW=Math.max(42,label.length*6.6+16), labelH=18, r=7;
  const nameLabel=String(cityName||'').length>18?cityName.slice(0,16)+'…':cityName;
  const nameW=Math.max(40,nameLabel.length*5.5+12);
  return `<g class="map-marker map-city-marker">
    <rect x="${(x-labelW/2).toFixed(1)}" y="${(y-r-labelH-4).toFixed(1)}" width="${labelW.toFixed(1)}" height="${labelH}" rx="6" fill="#065F46" opacity="0.94"></rect>
    <text x="${x.toFixed(1)}" y="${(y-r-labelH-4+labelH/2+3.8).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff" font-family="'JetBrains Mono',monospace">${esc(label)}</text>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="#10B981" stroke="#ffffff" stroke-width="2.5"></circle>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#ffffff"></circle>
    <rect x="${(x-nameW/2).toFixed(1)}" y="${(y+r+3).toFixed(1)}" width="${nameW.toFixed(1)}" height="14" rx="4" fill="#ffffff" stroke="#D1D5DB" stroke-width="0.5" opacity="0.95"></rect>
    <text x="${x.toFixed(1)}" y="${(y+r+3+10.5).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="600" fill="#065F46" font-family="'Inter',sans-serif">${esc(nameLabel)}</text>
    <title>${esc(cityName)}: ${fmtINR(amount)}</title>
  </g>`;
}

// One "location pin + amount badge" marker. State markers are clickable (drill into
// that state's cities, same as clicking the shape); city markers are display-only
// since there's no further drill-down level.
function markerSvg_(x,y,amount,name,clickable,colorHex){
  const label=fmtCompactINR_(amount);
  const labelW=Math.max(38,label.length*6.4+14), labelH=17, r=8.5;
  const clickAttr=clickable?`data-action="map-select-state" data-state="${esc(name)}"`:'';
  // Compact state name (max 12 chars) shown below the pin
  const shortName=String(name||'').length>12?name.slice(0,10)+'…':name;
  const nameW=Math.max(36,shortName.length*5.2+10);
  return `<g class="map-marker" ${clickAttr} style="cursor:${clickable?'pointer':'default'};">
    <rect x="${(x-labelW/2).toFixed(1)}" y="${(y-r-labelH-3).toFixed(1)}" width="${labelW.toFixed(1)}" height="${labelH}" rx="5" fill="#111729" opacity="0.92"></rect>
    <text x="${x.toFixed(1)}" y="${(y-r-labelH-3+labelH/2+3.4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff" font-family="'JetBrains Mono',monospace">${esc(label)}</text>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${colorHex}" stroke="#ffffff" stroke-width="2"></circle>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#ffffff"></circle>
    <rect x="${(x-nameW/2).toFixed(1)}" y="${(y+r+2).toFixed(1)}" width="${nameW.toFixed(1)}" height="12" rx="3" fill="#ffffff" stroke="#E5E7EB" stroke-width="0.5" opacity="0.9"></rect>
    <text x="${x.toFixed(1)}" y="${(y+r+2+9).toFixed(1)}" text-anchor="middle" font-size="7" font-weight="600" fill="#1E3A5F" font-family="'Inter',sans-serif">${esc(shortName)}</text>
    <title>${esc(name)}: ${fmtINR(amount)}</title>
  </g>`;
}

function paintIndiaMap(){
  const wrap=document.getElementById('mapCanvasWrap'); if(!wrap)return;
  wrap.innerHTML=`<div class="empty-state"><div class="spinner" style="margin:0 auto 12px;"></div><div class="big">Loading map…</div></div>`;
  ensureIndiaGeoJson().then(gj=>drawIndiaMap_(gj)).catch(()=>{
    wrap.innerHTML=`<div class="empty-state"><div class="big">Map shapes unavailable</div>${esc(mapLoadError||'Internet se GeoJSON load nahi ho paya.')}<br>State list side mein still available hai — wahan se bhi city-wise data dekh sakte hain.<br><button class="btn btn-ghost" style="margin-top:12px;" data-action="map-retry">⟳ Retry loading map</button></div>`;
  });
}

function drawIndiaMap_(gj){
  const wrap=document.getElementById('mapCanvasWrap'); if(!wrap)return;
  const byState=salesByState_();
  const amounts=Object.values(byState).map(s=>s.amount);
  const maxAmt=Math.max(1,...amounts);
  const W=920,H=920; // bigger canvas — more room for the map + pin markers

  // Whole-country bounds across every feature, used for the default (non-zoomed) view.
  let bounds={minX:Infinity,minY:Infinity,maxX:-Infinity,maxY:-Infinity};
  gj.features.forEach(f=>{
    const b=geometryBounds_(f.geometry);
    bounds.minX=Math.min(bounds.minX,b.minX);bounds.minY=Math.min(bounds.minY,b.minY);
    bounds.maxX=Math.max(bounds.maxX,b.maxX);bounds.maxY=Math.max(bounds.maxY,b.maxY);
  });

  const selState=S.map.selectedState;
  let viewBounds=bounds;
  if(selState){
    const feat=gj.features.find(f=>{const p=f.properties||{};return (p.st_nm||p.ST_NM||p.NAME_1||p.name||p.State_Name||'')===selState;});
    if(feat) viewBounds=geometryBounds_(feat.geometry);
  }
  const pad=(viewBounds.maxX-viewBounds.minX)*0.06||0.3;
  const vb={minX:viewBounds.minX-pad,minY:viewBounds.minY-pad,maxX:viewBounds.maxX+pad,maxY:viewBounds.maxY+pad};
  const spanX=vb.maxX-vb.minX||1, spanY=vb.maxY-vb.minY||1;
  const scale=Math.min(W/spanX,H/spanY);
  const project=(lon,lat)=>[ (lon-vb.minX)*scale, H-(lat-vb.minY)*scale ]; // flip Y (lat increases northward)

  const colorFor=amt=>{
    if(!amt) return '#E7EAF2';
    const t=Math.sqrt(amt/maxAmt); // sqrt so mid-range states aren't washed out
    const r=Math.round(233-(233-30)*t), g=Math.round(240-(240-90)*t), b=Math.round(254-(254-220)*t);
    return `rgb(${r},${g},${b})`;
  };

  const paths=gj.features.map(f=>{
    // Different mirrors use different property casing for the state name
    // (st_nm / ST_NM / NAME_1 / name) — check all of them so any source works.
    const p=f.properties||{};
    const name=p.st_nm||p.ST_NM||p.NAME_1||p.name||p.State_Name||'';
    const data=byState[name];
    const d=geoPathD_(f.geometry,project);
    const isSel=name===selState;
    const searchQ=(S.map.searchQuery||'').toLowerCase();
    const isSearchMatch=searchQ&&name.toLowerCase().includes(searchQ);
    const strokeColor=isSel?'#111729':isSearchMatch?'#F08A1D':'#ffffff';
    const strokeW=isSel?2:isSearchMatch?2.5:1;
    return `<path d="${d}" fill="${colorFor(data?data.amount:0)}" stroke="${strokeColor}" stroke-width="${strokeW}" data-action="map-select-state" data-state="${esc(name)}" class="map-state-path${isSearchMatch?' map-search-highlight':''}"><title>${esc(name)}${data?': '+fmtINR(data.amount):': No sales data'}</title></path>`;
  }).join('');

  // Location pin + total-sales badge markers. All-India view: one pin per state
  // that has any sales. Zoomed-into-a-state view: one pin per city in that state
  // (grid-placed inside the state's bounding box, since per-city coordinates
  // aren't available — only state-level shapes exist in the GeoJSON).
  let markers='';
  if(!selState){
    markers=gj.features.map(f=>{
      const p=f.properties||{};
      const name=p.st_nm||p.ST_NM||p.NAME_1||p.name||p.State_Name||'';
      const data=byState[name];
      if(!data||!data.amount)return '';
      const [lon,lat]=geometryCentroidLonLat_(f.geometry);
      const [x,y]=project(lon,lat);
      return markerSvg_(x,y,data.amount,name,true,'#1E5ADC');
    }).join('');
  }else{
    const selData=byState[selState];
    const cityRows=selData?cityRowsForState_(selData):[];
    const shown=cityRows.slice(0,6); // top 6 by amount; rest visible in side table
    if(shown.length){
      // Use the ACTUAL state feature's bounds (not the padded viewBox) so pins
      // stay INSIDE the state shape even for irregular states like UP.
      const feat=gj.features.find(f=>{const p=f.properties||{};return (p.st_nm||p.ST_NM||p.NAME_1||p.name||p.State_Name||'')===selState;});
      const stateBounds=feat?geometryBounds_(feat.geometry):vb;
      const tl=project(stateBounds.minX,stateBounds.maxY), br=project(stateBounds.maxX,stateBounds.minY);
      const pts=gridPositions_(shown.length,tl[0],tl[1],br[0],br[1]);
      markers=shown.map((c,i)=>cityMarkerSvg_(pts[i][0],pts[i][1],c.amount,c.city)).join('');
    }
  }

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="india-map-svg" style="transform:scale(${S.map.zoom||1}) translate(${S.map.panX||0}px,${S.map.panY||0}px);transform-origin:center;">${paths}${markers}</svg>`;

  wrap.querySelectorAll('.map-state-path').forEach(p=>{
    p.addEventListener('mouseenter',()=>p.classList.add('hover'));
    p.addEventListener('mouseleave',()=>p.classList.remove('hover'));
  });

  // Pan/drag: hold mouse button and drag to move the map around
  const svg=wrap.querySelector('.india-map-svg');
  if(svg){
    let dragging=false,startX=0,startY=0,startPanX=0,startPanY=0;
    svg.addEventListener('mousedown',ev=>{
      if(ev.target.closest('[data-action]'))return; // don't interfere with state clicks
      dragging=true;startX=ev.clientX;startY=ev.clientY;
      startPanX=S.map.panX||0;startPanY=S.map.panY||0;
      svg.style.cursor='grabbing';ev.preventDefault();
    });
    svg.addEventListener('mousemove',ev=>{
      if(!dragging)return;
      const dx=ev.clientX-startX,dy=ev.clientY-startY;
      const zoom=S.map.zoom||1;
      S.map.panX=startPanX+dx/zoom;S.map.panY=startPanY+dy/zoom;
      svg.style.transform=`scale(${zoom}) translate(${S.map.panX}px,${S.map.panY}px)`;
    });
    const stopDrag=()=>{if(dragging){dragging=false;svg.style.cursor='grab';}};
    svg.addEventListener('mouseup',stopDrag);
    svg.addEventListener('mouseleave',stopDrag);
    svg.style.cursor='grab';
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el)return;
  const a=el.getAttribute('data-action');
  if(a==='map-select-state'){
    S.map.selectedState=el.getAttribute('data-state');S.map.zoom=1;S.map.citySortCol='amount';S.map.citySortDir=-1;render();return;
  }
  if(a==='map-back'){ S.map.selectedState='';S.map.zoom=1;S.map.panX=0;S.map.panY=0;render();return; }
  if(a==='map-retry'){ retryIndiaMap();return; }
  if(a==='map-city-sort'){
    const col=el.getAttribute('data-col');
    if(S.map.citySortCol===col) S.map.citySortDir=(S.map.citySortDir||(-1))*-1;
    else { S.map.citySortCol=col; S.map.citySortDir=col==='city'?1:-1; }
    render();return;
  }
  if(a==='map-zoom'){
    const dir=el.getAttribute('data-dir');
    if(dir==='in')S.map.zoom=Math.min(3,(S.map.zoom||1)+0.25);
    else if(dir==='out')S.map.zoom=Math.max(0.5,(S.map.zoom||1)-0.25);
    else {S.map.zoom=1;S.map.panX=0;S.map.panY=0;}
    const svg=document.querySelector('.india-map-svg');
    if(svg){ svg.style.transform=`scale(${S.map.zoom}) translate(${S.map.panX||0}px,${S.map.panY||0}px)`; return; }
    render();
  }
});
// Search state input handler (uses input event, not click)
document.addEventListener('input',e=>{
  if(e.target.classList.contains('map-search-input')){
    S.map.searchQuery=e.target.value;
    render();
  }
});
</script>

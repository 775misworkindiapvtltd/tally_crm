<style>
:root{
  --sidebar:#111729;--sidebar-hover:#1A2238;--sidebar-active:#202B47;--sidebar-line:#232C42;--sidebar-sub:#7C87A3;
  --bg:#F3F5FA;--surface:#FFFFFF;--ink:#151A2C;--ink-secondary:#4B5570;--muted:#8992AA;
  --line:#E7EAF2;--line-light:#EEF0F7;
  --blue:#2E6BF2;--blue-tint:#E9F0FE;--blue-dark:#1E4FC4;
  --green:#16A34A;--green-tint:#E7F7ED;
  --red:#E23A3A;--red-tint:#FCEAEA;
  --orange:#F08A1D;--orange-tint:#FDF0DE;
  --purple:#7C5CFC;--purple-tint:#EFEAFF;
  --teal:#0DA1A0;--teal-tint:#E2F6F5;
  --indigo:#4C5FE0;--indigo-tint:#EAEDFC;
  --gold:#B4862B;--gold-tint:#F6ECD6;
  --recv:#2E6BF2;--recv-tint:#E9F0FE;--pay:#F08A1D;--pay-tint:#FDF0DE;
  --danger:#E23A3A;--danger-tint:#FCEAEA;--success:#16A34A;--success-tint:#E7F7ED;
  --accent:#2E6BF2;--accent-dark:#1E4FC4;--accent-tint:#E9F0FE;--accent-tint2:#F5F8FF;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
/* Fixes "swiping left/right with two fingers logs me out": on trackpads/touchpads,
   a horizontal two-finger swipe over page content that has no horizontal scroll of
   its own is interpreted by the browser as a back/forward navigation gesture. That
   reloads the whole single-page app, wiping the in-memory login state and dropping
   the user back to the login screen — it was never really "logging out", the whole
   page was reloading. overscroll-behavior-x:none tells the browser not to trigger
   that navigation gesture from within our own scroll containers (a matching
   overscroll-behavior-x is also set on .content/.dt-scroll below, since the gesture
   is triggered from whichever element the swipe actually happens over). Session
   persistence (see persistSessionUserId_/loadAll() in Common.html) is the second,
   belt-and-suspenders half of the fix, in case any browser reload still slips through.*/
html,body{overscroll-behavior-x:none;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;transition:background .3s,color .3s;overflow:hidden;}
html.dark{
  --sidebar:#0A0E1A;--sidebar-hover:#141A2C;--sidebar-active:#1B2338;--sidebar-line:#1C2336;
  --bg:#0B0F1A;--surface:#131A2B;--ink:#E7EAF4;--ink-secondary:#A6AEC4;--muted:#6D7690;
  --line:#212A42;--line-light:#1A2236;
  --blue-tint:#16233F;--green-tint:#132A1F;--red-tint:#2C1717;--orange-tint:#2C2013;--purple-tint:#211C3A;--teal-tint:#112826;--indigo-tint:#1B2040;
  --recv-tint:#16233F;--pay-tint:#2C2013;--danger-tint:#2C1717;--success-tint:#132A1F;
  --accent:#4C82FF;--accent-dark:#7CA3FF;--accent-tint:#16233F;--accent-tint2:#141C30;--gold-tint:#2A2518;
}
html.dark .login-wrap{background:linear-gradient(145deg,#05070C 0%,#0A0E1A 50%,#111729 100%);}
html.dark .login-card{background:var(--surface);box-shadow:0 40px 80px -30px rgba(0,0,0,.8);}
html.dark .field input,html.dark .fbar select,html.dark .fbar input{background:#0B0F1A;border-color:var(--line);color:var(--ink);}
html.dark .field input:focus{background:#080B12;border-color:var(--accent);}
html.dark .topbar{background:var(--surface);border-color:var(--line);}
html.dark .content{background:var(--bg);}
html.dark .card,html.dark .panel,html.dark .fbar,html.dark .dt-table-wrap,html.dark .ledger-wrap,html.dark .ledger-party-list{background:var(--surface);border-color:var(--line);}
html.dark table.dt tbody td,html.dark table.ledger-table tbody td{border-color:var(--line-light);color:var(--ink);}
html.dark table.dt tbody tr:nth-child(even),html.dark table.ledger-table tbody tr:nth-child(even){background:#101627;}
html.dark table.dt tbody tr:hover{background:var(--accent-tint);}
html.dark .dt-pagination{background:var(--surface);border-color:var(--line);color:var(--ink-secondary);}
html.dark .dt-pagination select{background:#141B2C;border-color:#232C42;color:var(--ink);}
html.dark .dt-pagination .nav button{background:#141B2C;border-color:#232C42;color:var(--ink-secondary);}
html.dark .btn-ghost{border-color:var(--line);color:var(--ink-secondary);}
html.dark .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint);}
html.dark .topbar-controls{background:var(--surface);border-color:var(--line);}
html.dark .topbar-controls button{color:var(--ink-secondary);}
html.dark .party-row:hover,html.dark .party-row.active{background:var(--accent-tint);}
html.dark .bottom-nav{background:var(--sidebar);border-color:var(--sidebar-line);}
html.dark .qa-btn{background:var(--surface);border-color:var(--line);}
html.dark .mini-table tbody tr:nth-child(even){background:#101627;}

#app{height:100vh;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
input,select,button{font-family:inherit;font-size:13px;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#CCD0DC;border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

.loading-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);background:var(--bg);}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- LOGIN ---------- */
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#111729 0%,#1A2238 50%,#202B47 100%);padding:20px;overflow-y:auto;}
.login-card{width:400px;max-width:100%;background:var(--surface);border-radius:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);overflow:hidden;}
.login-top{background:linear-gradient(135deg,#111729,#202B47);color:#EDF0F8;padding:32px 34px 26px;border-bottom:3px solid var(--accent);}
.login-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#7CA3FF;text-transform:uppercase;}
.login-top h1{font-size:22px;margin:8px 0 0;font-weight:600;letter-spacing:-.01em;color:#fff;}
.login-body{padding:30px 34px 34px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.field input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:#FAFBFD;color:var(--ink);transition:border .15s,box-shadow .15s;}
.field input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint);}
.btn{border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;}
.btn:active{transform:scale(.98);}
.btn-primary,.btn-gold{background:linear-gradient(135deg,#3B78F5,var(--blue-dark));color:#fff;box-shadow:0 2px 8px rgba(46,107,242,.3);}
.btn-primary:hover,.btn-gold:hover{box-shadow:0 4px 14px rgba(46,107,242,.4);filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.btn-block{width:100%;justify-content:center;}
.login-error{background:var(--danger-tint);color:var(--danger);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-weight:500;}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:14px;}
.login-hint b{color:var(--ink);}

/* ---------- SHELL / NAV ---------- */
.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:236px;flex:none;background:var(--sidebar);color:var(--sidebar-sub);display:flex;flex-direction:column;height:100vh;border-right:1px solid var(--sidebar-line);transition:transform .25s ease;}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--sidebar-line);display:flex;align-items:flex-start;justify-content:space-between;}
.brand-inner{display:flex;align-items:center;gap:10px;}
.brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4C5FE0,#7C5CFC);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px;flex:none;}
.brand-icon span{background:rgba(255,255,255,.85);border-radius:2px;}
.brand-text .eyebrow{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:#F3F5FC;letter-spacing:-.01em;}
.brand-text .eyebrow sup{font-size:9px;color:#7C87A3;}
.brand-text h1{font-size:9.5px;margin:1px 0 0;color:#7C87A3;font-weight:600;letter-spacing:.02em;text-transform:none;}
.sidebar-close{display:none;border:none;background:transparent;color:var(--sidebar-sub);font-size:18px;cursor:pointer;padding:4px 8px;}
.nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-group-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#525C78;font-weight:700;padding:14px 10px 5px 12px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:#AAB2C8;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,color .12s;position:relative;}
.nav-item .n-ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;opacity:.9;}
.nav-item:hover{background:var(--sidebar-hover);color:#F0F2FA;}
.nav-item.active{background:var(--sidebar-active);color:#FFFFFF;}
.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:16px;text-align:center;}
.nav-empty{font-size:10.5px;color:#525C78;padding:8px 10px;font-style:italic;}
.sidebar-foot{padding:12px 14px 14px;border-top:1px solid var(--sidebar-line);}
.sidebar-foot .su{font-size:9.5px;color:#525C78;margin-bottom:8px;}
.logout-btn{font-size:11px;color:#8E97AF;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;transition:all .12s;}
.logout-btn:hover{background:var(--sidebar-hover);color:#F0F2FA;}
.sync-btn{width:100%;justify-content:center;margin-top:6px;padding:9px;font-size:12px;}
.sync-status{margin-top:8px;display:flex;flex-direction:column;gap:2px;font-size:9.5px;line-height:1.25;color:#7C87A3;}
.sync-status .sync-state{font-weight:600;color:#AAB2C8;}.sync-status b{font-size:10.5px;color:#D7DCEA;font-weight:700;}.sync-status .sync-source{color:#6E7893;}
.sidebar-overlay{display:none;}

.main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;flex:none;}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
.hamburger{display:none;border:none;background:transparent;cursor:pointer;color:var(--ink-secondary);font-size:18px;padding:4px 6px;}
.topbar-left .tb-title h2{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.topbar-left .tb-title .sub{font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px;}
/* Live sync status pill next to the page title — green while a background refresh
   is running, then swaps to a plain "Last Refreshed on ..." pill once it finishes,
   per explicit user instruction (screenshot showed a green "REFRESHING" highlight
   next to the title, replaced by the last-refreshed time once data lands). */
.tb-refresh-pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.tb-refresh-pill.refreshing{background:var(--success-tint);color:var(--success);}
.tb-refresh-pill.done{background:var(--accent-tint2);color:var(--ink-secondary);}
.tb-refresh-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;animation:tb-refresh-pulse 1s ease-in-out infinite;}
@keyframes tb-refresh-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.topbar-right{display:flex;align-items:center;gap:14px;}
.tb-search{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--muted);font-size:12px;min-width:180px;}
.topbar-controls{display:flex;align-items:center;gap:2px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:2px 4px;}
.topbar-controls button{border:none;background:transparent;cursor:pointer;padding:5px 7px;border-radius:4px;font-size:13px;color:var(--ink-secondary);font-weight:700;transition:all .12s;line-height:1;position:relative;}
.topbar-controls button:hover{background:var(--accent-tint);color:var(--accent-dark);}
.tb-icon-btn{position:relative;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-secondary);}
.tb-icon-btn:hover{background:var(--accent-tint2);color:var(--accent-dark);}
.tb-icon-btn .dot{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;text-align:center;}
.topbar-welcome{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.topbar-welcome b{color:var(--ink);font-weight:700;font-size:12px;}
.topbar-welcome span{font-size:10px;color:var(--muted);}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#4C5FE0);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:12px;flex:none;}
.content{padding:6px 8px 12px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;overscroll-behavior-x:none;}
/* Text size control (A- / A / A+ / A++) — sits top-right in the topbar, next to the
   dark/light toggle. "A" (100%, normal website font) is the default the first time
   the app opens since it reads best in dense tables, per explicit user instruction;
   the chosen size is remembered afterwards via localStorage (see Common.html). The
   active preset is highlighted the same way the dark/light toggle button is. */
.topbar-fontsize{display:flex;align-items:center;gap:2px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:2px;flex:none;}
.topbar-fontsize button{border:none;background:transparent;cursor:pointer;padding:5px 8px;border-radius:4px;font-size:11px;font-weight:700;color:var(--ink-secondary);transition:all .12s;line-height:1;font-family:'Inter',system-ui,sans-serif;}
.topbar-fontsize button:hover{background:var(--accent-tint);color:var(--accent-dark);}
.topbar-fontsize button.active{background:var(--accent);color:#fff;}
/* Receivable/Payable Ageing switch — moved back OUT of the topbar and into the
   page body per explicit user instruction (renders as its own row ABOVE the All
   Data/Ageing Wise mode tabs — see .ageing-kind-tabs below, and kindTabs in
   renderAgeing() in Receivables.html). The old topbar-only placement is gone. */

.toast{position:fixed;top:16px;right:16px;z-index:100;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;animation:toast-in .22s cubic-bezier(.2,.8,.4,1);background:var(--success-tint);color:var(--success);border:1px solid #BEE3C9;}
@keyframes toast-in{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
.toast.err{background:var(--danger-tint);color:var(--danger);border-color:#F3C6C3;}

/* ---------- FILTER BAR ---------- */
.fbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;flex:none;}
.fbar-group{display:flex;flex-direction:column;gap:4px;min-width:110px;}
.fbar-group label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.fbar select,.fbar input[type="date"],.fbar input[type="text"]{padding:7px 10px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;min-width:100px;}
.fbar select:focus,.fbar input:focus{outline:none;border-color:var(--accent);}
.fbar-daterange{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-secondary);font-weight:600;}
.fbar-daterange input{min-width:118px;cursor:pointer;}
.fbar-presets{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:8px;padding:3px;}
.fbar-presets button{border:none;background:transparent;padding:6px 11px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--ink-secondary);cursor:pointer;transition:all .12s;}
.fbar-presets button:hover{color:var(--accent-dark);}
.fbar-presets button.active{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(46,107,242,.35);}
.fbar-compare{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink-secondary);cursor:pointer;user-select:none;padding:7px 4px;}
.fbar-compare input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.fbar .spacer{flex:1;}
.fbar-btn-filters{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.fbar-btn-filters:hover{background:var(--accent-dark);}
.compare-note{font-size:10.5px;color:var(--muted);padding:2px 4px 0;}
.fy-only-bar{align-items:center;position:relative;z-index:12;gap:10px;padding-top:9px;padding-bottom:9px;flex-wrap:nowrap;}
.fy-inline-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.fy-multi{position:relative;flex:0 1 270px;min-width:190px;}
.fy-multi-btn{width:100%;min-width:0;padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fy-multi-btn:hover{border-color:var(--accent);}
.fy-menu{position:absolute;left:0;top:calc(100% + 6px);z-index:80;min-width:280px;max-height:300px;overflow:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 16px 45px rgba(0,0,0,.16);padding:8px;}
.fy-option{display:flex!important;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;cursor:pointer;font-size:11px!important;color:var(--ink-secondary)!important;text-transform:none!important;letter-spacing:0!important;}
.fy-option:hover{background:var(--accent-tint2);}.fy-option input{accent-color:var(--accent);}.fy-all{border-bottom:1px solid var(--line-light);margin-bottom:4px;font-weight:700;}
.fy-empty{padding:12px;color:var(--muted);font-size:10.5px;line-height:1.5;}.fy-selection-note{font-size:10.5px;color:var(--muted);padding-bottom:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fy-selection-note b{color:var(--ink-secondary);}
.nav-parent .nav-chevron{margin-left:auto;font-size:16px;}.nav-children{padding-left:16px}.nav-children .nav-item{font-size:11.5px;padding-top:7px;padding-bottom:7px;}
.view-toggle{display:inline-flex;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px;margin-bottom:14px;gap:3px;}
.view-toggle button{border:0;background:transparent;color:var(--ink-secondary);padding:8px 16px;border-radius:6px;font-weight:700;cursor:pointer;}.view-toggle button.active{background:var(--accent);color:#fff;}.ageing-summary-cards{grid-template-columns:repeat(3,1fr);}

/* ---------- AGEING PARTY PIVOT (party-in-middle, overdue-left, not-yet-due-right) ---------- */
.apv-searchbar{display:flex;align-items:center;gap:10px;flex:none;}
.apv-searchbar input{flex:none;width:220px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:12px;}
.apv-searchbar input:focus{outline:none;border-color:var(--accent);}
.apv-count{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
/* Column widths/padding trimmed down (was 110px per bucket / 240px name / 150px
   total ≈1270px total table width) so the whole pivot — sidebar + table — fits on
   one screen without horizontal scrolling on a 13"-14" laptop, per explicit user
   instruction ("lot of extra space in columns... so that including table it fits
   in one screen of my mac and other laptops too"). New total ≈1050px. */
table.apv-table{table-layout:fixed;}
table.apv-table thead tr.apv-totals-row th{display:none;} /* keep header cell semantics but hide duplicate; totals rendered as td row */
table.apv-table thead .apv-totals-row td{position:sticky;top:0;z-index:5;background:#F5F8FF;color:var(--ink);font-family:Tahoma,Geneva,sans-serif;font-weight:700;font-size:11px;text-align:center;padding:6px 5px;border-bottom:1px solid var(--line);letter-spacing:-0.5px;}
table.apv-table thead .apv-totals-row td.apv-name{background:var(--surface);}
table.apv-table thead .apv-totals-row td.apv-tot-name{background:var(--surface);color:var(--muted);font-family:inherit;font-size:9px;letter-spacing:.06em;}
table.apv-table thead tr:not(.apv-totals-row) th{position:sticky;top:31px;z-index:4;background:#1E4FC4;color:#fff;text-align:center;padding:0;cursor:pointer;border-right:1px solid rgba(255,255,255,.15);}
table.apv-table thead tr:not(.apv-totals-row) th.apv-name{background:var(--surface);color:var(--ink);}
/* Header label stays CENTER-aligned (per explicit user instruction: "header center
   align he rehne dena") — only the body cells below change alignment. */
table.apv-table thead .apv-th-inner{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 6px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:normal;overflow-wrap:break-word;line-height:1.2;}
table.apv-table thead th.apv-name .apv-th-inner{color:var(--ink);}
table.apv-table thead th.apv-sorted{background:#163C9E;}
table.apv-table thead th.apv-name.apv-sorted{background:var(--accent-tint);}
table.apv-table thead .apv-sort-ic{font-size:8.5px;flex:none;}
/* Party Name body cells: LEFT-aligned per explicit user instruction ("i want this
   section to be left aligned"), while the header above stays centered (unchanged). */
table.apv-table tbody td.apv-name{font-weight:700;color:var(--ink);text-align:left;padding:6px 10px;background:var(--accent-tint2);border-left:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
table.apv-table tbody td.apv-cell{text-align:right;font-family:Tahoma,Geneva,sans-serif;font-size:11px;padding:6px 8px;letter-spacing:-0.5px;}
table.apv-table tbody td.apv-cell.apv-od{color:#B4231E;background:#FEF4F3;}
table.apv-table tbody td.apv-cell.apv-nd{color:#0E7C3F;background:#F2FBF6;}
table.apv-table tbody td.apv-cell.apv-total{color:var(--ink);font-weight:700;background:var(--accent-tint2);}
table.apv-table tbody td.apv-cell.apv-zero{color:#C7CCDA;background:transparent;}
table.apv-table tbody tr:hover td{filter:brightness(0.97);}
table.apv-table tbody td.apv-cell.apv-zero:hover{filter:none;}

/* Ageing kind tabs (Receivable/Payable Ageing) + mode tabs (All Data/Ageing Wise) —
   both rows are left-aligned (align-self:flex-start on .view-toggle already does
   this) and the mode-tabs row shares ONE line with the party search box so nothing
   pushes onto an extra line, per explicit user instruction. */
/* Row 1 above the mode tabs — Receivable Ageing Summary / Payable Ageing Summary
   switch, moved here from the topbar per explicit user instruction ("Receivable
   Ageing Summary and payable ageing summary button, All Data/Ageing Wise inke
   button se pehel aa jaye...basically in second line"). Kept compact/small like
   the mode tabs below it, not the larger default .view-toggle size, so this extra
   row stays neat and doesn't eat vertical space. */
.ageing-kind-tabs{padding:3px;gap:2px;margin-bottom:8px;}
.ageing-kind-tabs button{padding:6px 14px;font-size:11.5px;border-radius:5px;}
.ageing-mode-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.ageing-mode-bar .view-toggle{margin-bottom:0;}
/* Refresh + Columns for the embedded receivablesDashboard grid (All Data tab) —
   folded into this same row (right-aligned, small font) instead of that grid
   rendering its own separate toolbar row underneath, per explicit user instruction
   ("refresh and column bhi ismi me right me adjust ho jaaye...ye ek line ka screen
   bacha lega"). */
.ageing-dash-controls{display:flex;align-items:center;gap:8px;flex:none;}
.ageing-dash-controls .btn{padding:5px 12px;font-size:11.5px;}
/* All Data / Ageing Wise — shrunk to a smaller, denser pill than the default
   .view-toggle (used elsewhere for e.g. Sales/Duration) so it reads as a compact
   professional control that doesn't consume extra vertical space, per explicit
   user instruction ("All data, aging ka button size and text ko small kar
   sakte hai...so that it looks neat and professional looking dashboard"). */
.ageing-mode-tabs{padding:3px;gap:2px;}
.ageing-mode-tabs button{padding:6px 12px;font-size:11.5px;border-radius:5px;}
.ageing-page-cards{margin-bottom:6px;gap:8px;}
/* Ageing KPI cards — a really thin single-row layout (icon on the left, label +
   value + sub packed tightly to its right on ONE line where it fits) instead of
   the taller icon-on-top/value-below stack every other .card uses — even thinner
   than the Main Dashboard's own kpi-strip cards, per explicit user instruction
   ("kpi kards...koi aur layout hoga to chalega, i want really thin layout for
   these...that will save my screen"). */
.ageing-kpi-card{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:default;}
.ageing-kpi-card:hover{box-shadow:0 1px 3px rgba(0,0,0,.03);transform:none;}
.ageing-kpi-card .card-icon{width:24px;height:24px;border-radius:6px;flex:none;}
.ageing-kpi-card .card-icon svg{width:12px;height:12px;}
.ageing-kpi-body{min-width:0;flex:1;}
.ageing-kpi-card .card-label{font-size:8px;display:block;margin-bottom:1px;}
.ageing-kpi-vs{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.ageing-kpi-card .card-value{font-size:13px;line-height:1;}
.ageing-kpi-card .card-sub{font-size:9px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- SALES REPORT — DURATION (CATEGORY/PARTY NAME/STATE) PIVOT ---------- */
/* Toolbar row: row-count + Refresh + Sales/Duration toggle ALL on one line. The
   Sales/Duration toggle itself now sits on the LEFT on the master Sales grid (see
   .report-switcher-toolbar — GRID_DEFS.salesReport.reportTabs in Grids.html), per
   explicit user instruction ("sales and duration left me dikha do"). This
   right-aligning rule is scoped to ONLY the bespoke Duration/category pivot's own
   toolbar below (.sales-cat-toolbar), which keeps its previous established layout
   (row count + Refresh on the left, the toggle on the right) unchanged. */
/* Sales/Duration toggle, Mode toggle (Monthly/Yearly/Custom Range) all sit on the
   SAME toolbar row now (Sales/Duration on the left, mode pills next, count+Refresh
   pushed to the right) per explicit user instruction. Height reduced per explicit
   user instruction ("point 1 and point 2 ka height kum kardo"). */
.sales-cat-toolbar{flex-wrap:wrap;gap:6px;margin-bottom:6px;}
/* Sales/Duration toggle — always compact (same thin size on BOTH the Sales grid's
   report-switcher toolbar AND the Duration pivot's sales-cat-toolbar), per explicit
   user instruction ("image 1 and image 2 jo size button hai vo same nahi hai,
   jismein patla hai vo wala karna hai dono mein"). */
.sales-report-view-toggle{padding:2px!important;gap:2px!important;margin:0!important;}
.sales-report-view-toggle button{padding:5px 12px!important;font-size:11px!important;border-radius:5px!important;}
.sales-cat-toolbar .sales-cat-mode-toggle{margin:0;flex:none;padding:2px;gap:2px;}
.sales-cat-toolbar .sales-cat-mode-toggle button{padding:5px 12px;font-size:11px;border-radius:5px;}
.sales-cat-toolbar .sales-cat-range-multi{margin:0;flex:none;}
.sales-cat-toolbar .sales-cat-range-multi .fy-multi-btn{padding:5px 12px;font-size:11px;border-radius:5px;}
/* Duration pivot's "Custom Range" control — an FY-style button + popover (reusing
   the app-wide .fy-multi/.fy-multi-btn/.fy-menu look from the main Financial Year
   filter) instead of two bare date inputs sitting directly in the toolbar, per
   explicit user instruction ("Customer range financial year button chaiye rather
   than input boxes"). */
.sales-cat-range-multi{flex:0 1 240px;min-width:170px;}
.sales-cat-range-menu{padding:12px;min-width:260px;}
.sales-cat-range-menu .sales-cat-daterange{margin-bottom:0;}
/* Removes the default .view-toggle margin-bottom so the Sales/Duration toggle sits
   flush within a single-line toolbar row instead of pushing extra space below it —
   same reasoning as .ageing-mode-bar .view-toggle{margin-bottom:0;} elsewhere. */
.report-switcher-toolbar .view-toggle{margin-bottom:0;}
.sales-cat-mode-toggle{margin-bottom:0;}
.sales-cat-daterange{margin-bottom:0;}
.sales-cat-wrap table.dt.scp-table{table-layout:fixed;}
/* The Duration pivot's own .dt-scroll must have a bounded height so IT (not the
   page-level .content) becomes the scroll container — this is what makes
   position:sticky on the <thead> cells actually work (sticky only activates relative
   to the NEAREST scrolling ancestor). calc(100vh - 170px) leaves room for the topbar
   + toolbar row above, per explicit user instruction ("header freeze nahi hue hai
   niche ka table ho gya hai"). */
.sales-cat-wrap .dt-scroll{max-height:calc(100vh - 170px);overflow:auto;}
/* Override .dt-table-wrap's overflow:hidden on the sales-cat-wrap specifically —
   sticky positioning inside the scroll container doesn't work if a parent clips. */
.dt-table-wrap.sales-cat-wrap{overflow:visible;}
/* box-sizing:border-box ensures that when the column resize handler reads
   getBoundingClientRect().width (which includes border+padding) and writes it back
   as style.width, the column stays at the exact same visual width instead of
   drifting by the border/padding amount each time, per explicit user instruction
   ("col resize properly nahi ho rha hai...exact jagah pe fit nahi hota hai"). */
table.scp-table th,table.scp-table td{box-sizing:border-box;}
/* LEFT-FREEZE: S.No, Total, % Amt, and Category/Party Name columns stay pinned on
   the left when scrolling horizontally through the month/year period columns, per
   explicit user instruction ("ye right scroll mein hide na ho freeze ho jaye").
   The actual left:Xpx values are computed inline from the current column widths in
   Finance.html (since the user can resize columns) — CSS just sets position:sticky
   and the z-index layering. */
table.scp-table .scp-sno{position:sticky;z-index:3;}
table.scp-table .scp-total{position:sticky;z-index:3;}
table.scp-table .scp-pct{position:sticky;z-index:3;}
table.scp-table .scp-cat{position:sticky;z-index:3;border-right:2px solid var(--line)!important;}
/* Header row cells need higher z-index since they're BOTH sticky-top AND sticky-left */
table.scp-table thead .scp-sno,table.scp-table thead .scp-total,table.scp-table thead .scp-pct,table.scp-table thead .scp-cat{z-index:6;}
/* Body cells need a solid background so scrolled content doesn't show through */
table.scp-table tbody td.scp-sno,table.scp-table tbody td.scp-total,table.scp-table tbody td.scp-pct,table.scp-table tbody td.scp-cat{background:var(--surface);}
table.scp-table tbody tr:nth-child(even) td.scp-sno,table.scp-table tbody tr:nth-child(even) td.scp-total,table.scp-table tbody tr:nth-child(even) td.scp-pct,table.scp-table tbody tr:nth-child(even) td.scp-cat{background:#FAFBFD;}
/* Totals row frozen cells — need z-index higher than both regular sticky-top and
   regular sticky-left so the intersection (top-left corner) always stays on top */
table.scp-table thead tr.scp-totals-row td.scp-sno,table.scp-table thead tr.scp-totals-row td.scp-total,table.scp-table thead tr.scp-totals-row td.scp-pct,table.scp-table thead tr.scp-totals-row td.scp-cat{z-index:9;background:#F5F8FF;}
table.scp-table thead tr.scp-totals-row td{position:sticky;top:0;z-index:5;background:#F5F8FF;color:var(--ink);font-family:Tahoma,Geneva,sans-serif;font-weight:700;font-size:11px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-light);white-space:nowrap;letter-spacing:-0.5px;}
table.scp-table thead tr.scp-totals-row td.scp-cat{text-align:left;color:var(--muted);font-family:inherit;font-size:9.5px;letter-spacing:.06em;background:var(--surface);}
table.scp-table thead tr.scp-totals-row td.scp-sno{background:var(--surface);}
table.scp-table thead tr:not(.scp-totals-row) th{position:sticky;top:37px;z-index:4;background:#1E4FC4;color:#fff;text-align:right;padding:0;cursor:pointer;border-right:1px solid rgba(255,255,255,.15);}
table.scp-table thead th.scp-cat,table.scp-table thead th.scp-sno{text-align:left;background:var(--surface);color:var(--ink);cursor:default;}
/* Frozen header cells (both sticky-top + sticky-left) need higher z-index so they
   layer above BOTH the body cells AND the non-frozen header cells when scrolling
   in both directions simultaneously */
table.scp-table thead tr:not(.scp-totals-row) th.scp-sno,table.scp-table thead tr:not(.scp-totals-row) th.scp-total,table.scp-table thead tr:not(.scp-totals-row) th.scp-pct,table.scp-table thead tr:not(.scp-totals-row) th.scp-cat{z-index:8;}
.scp-th-inner{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:9px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:normal;word-break:normal;overflow-wrap:break-word;line-height:1.2;position:relative;}
table.scp-table th.scp-cat .scp-th-inner{justify-content:flex-start;}
/* Dimension header dropdown (Category/Party Name/State) — sits inline with the
   sort arrow, styled to read as part of the dark header row rather than a plain
   form control, so switching the grouping dimension doesn't break the header's look. */
.scp-dim-inner{gap:6px;}
.scp-dim-select{flex:1;min-width:0;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:4px;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 4px;cursor:pointer;}
.scp-dim-select option{background:var(--surface);color:var(--ink);}
.scp-dim-select:hover,.scp-dim-select:focus{border-color:rgba(255,255,255,.6);outline:none;}
.scp-sort-ic{font-size:9px;flex:none;}
.scp-sort-ic[data-action]{cursor:pointer;}
.scp-resize{position:absolute;right:-4px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:5;}
.scp-resize:hover{background:rgba(255,255,255,.25);}
table.scp-table th.scp-cat .scp-resize:hover{background:rgba(46,107,242,.25);}
table.scp-table tbody td.scp-cell{text-align:right;font-family:Tahoma,Geneva,sans-serif;font-size:11px;padding:10px 10px;border-right:1px solid var(--line-light);letter-spacing:-0.5px;vertical-align:middle;height:40px;}
/* Period (month/year) amount cells: must never wrap mid-number — when the column is
   resized narrower than the value, the font shrinks instead of wrapping, per explicit
   user instruction ("amount wrap na ho uska font chota ho jaye in case agar col size
   chota hai to"). Using Tahoma (very tight comma glyph — no visible space around
   commas unlike Verdana/JetBrains Mono) + negative letter-spacing for extra
   tightness, per explicit user instruction ("46,000 ye font aisa use karo ki comma
   ke baad space na dikhe"). */
table.scp-table tbody td.scp-cell.scp-period,
table.scp-table thead tr.scp-totals-row td.scp-period{white-space:nowrap;overflow:hidden;text-overflow:clip;font-family:Tahoma,Geneva,sans-serif;font-size:clamp(8px,1.1vw,11px);font-weight:600;letter-spacing:-0.5px;}
table.scp-table tbody td.scp-cell.scp-total,
table.scp-table thead tr.scp-totals-row td.scp-total{white-space:nowrap;font-family:Tahoma,Geneva,sans-serif;font-weight:700;letter-spacing:-0.5px;}
table.scp-table tbody td.scp-cell.scp-cat{text-align:left;font-weight:700;color:var(--ink);font-family:inherit;background:var(--accent-tint2);}
table.scp-table tbody td.scp-cell.scp-total{font-weight:700;color:var(--ink);background:var(--accent-tint2);}
/* % Amt column — each row's share of the grand total, sitting between Total and
   the dimension column per explicit user instruction. Lighter weight than Total so
   the absolute amount still reads as the primary figure. */
table.scp-table tbody td.scp-cell.scp-pct{color:var(--muted);font-weight:600;background:var(--accent-tint2);}
table.scp-table thead tr.scp-totals-row td.scp-pct{color:var(--ink-secondary);}
table.scp-table tbody td.scp-cell.scp-sno{font-weight:600;}
table.scp-table tbody td.scp-cell.scp-zero{color:#C7CCDA;}
table.scp-table tbody tr:nth-child(even) td.scp-cell:not(.scp-cat):not(.scp-total):not(.scp-pct):not(.scp-sno){background:#FAFBFD;}
table.scp-table tbody tr:hover td{filter:brightness(0.97);}

/* ---------- INDIA MAP VIEW ---------- */
.map-shell{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;flex:1;min-height:0;}
.map-shell{min-height:700px;}
.map-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.map-toolbar{padding:12px 16px;border-bottom:1px solid var(--line-light);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.map-title{font-weight:700;font-size:13.5px;color:var(--ink);}
.map-zoom-controls{display:flex;align-items:center;gap:6px;}
.map-zoom-controls .btn{padding:6px 12px;font-size:12px;}
.map-canvas-wrap{flex:1;min-height:640px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;}
.india-map-svg{width:100%;height:100%;max-height:900px;transition:transform .2s ease;}
.map-state-path{cursor:pointer;transition:opacity .12s;}
.map-state-path:hover,.map-state-path.hover{opacity:.75;stroke:#111729 !important;stroke-width:2 !important;}
.map-marker:hover circle:first-of-type{filter:brightness(1.15);}
.map-legend{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line-light);font-size:10.5px;color:var(--muted);font-weight:600;}
.map-legend-bar{width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,#E7EAF2,#1E5ADC);}
.map-side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.map-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.map-list-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;}
.map-list-row:hover{background:var(--accent-tint2);}
.mlr-name{width:120px;flex:none;font-size:11.5px;font-weight:600;color:var(--ink-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mlr-track{flex:1;height:10px;background:var(--line-light);border-radius:5px;overflow:hidden;}
.mlr-fill{height:100%;background:linear-gradient(90deg,var(--accent),#1E5ADC);border-radius:5px;}
.mlr-val{width:90px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ink);}
@media (max-width:980px){.map-shell{grid-template-columns:1fr;}.map-canvas-wrap{min-height:420px;}}

/* ---------- KPI CARDS ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.03);cursor:pointer;transition:box-shadow .15s,transform .1s;}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.07);transform:translateY(-1px);}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
.card-icon svg{width:18px;height:18px;}
.card-icon.c-green{background:var(--green-tint);color:var(--green);}
.card-icon.c-orange{background:var(--orange-tint);color:var(--orange);}
.card-icon.c-blue{background:var(--blue-tint);color:var(--blue);}
.card-icon.c-red{background:var(--red-tint);color:var(--red);}
.card-icon.c-purple{background:var(--purple-tint);color:var(--purple);}
.card-icon.c-teal{background:var(--teal-tint);color:var(--teal);}
.card-icon.c-indigo{background:var(--indigo-tint);color:var(--indigo);}
.card-icon.recv{background:var(--recv-tint);color:var(--recv);}
.card-icon.pay{background:var(--pay-tint);color:var(--pay);}
.card-icon.exp{background:var(--danger-tint);color:var(--danger);}
.card-icon.net{background:var(--success-tint);color:var(--success);}
.card-label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.card-value{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--ink);}
.card-sub{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:4px;}
.card-sub .chip{display:inline-flex;align-items:center;gap:2px;font-weight:700;}
.card-sub .chip.up{color:var(--green);}
.card-sub .chip.down{color:var(--red);}
.card-sub.up{color:var(--danger);}
.card-sub.down{color:var(--success);}

.kpi-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:14px;}
.kpi-strip .card{padding:12px 13px;}
.kpi-strip .card-icon{width:30px;height:30px;border-radius:8px;}
.kpi-strip .card-icon svg{width:15px;height:15px;}
.kpi-strip .card-label{font-size:9px;}
.kpi-strip .card-value{font-size:15.5px;}
.kpi-strip .card-top{margin-bottom:7px;}

.dash-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:14px;}
.dash-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.dash-row4{display:grid;grid-template-columns:1.25fr 1.25fr 1.2fr .9fr;gap:14px;margin-bottom:14px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.panel-title{padding:12px 16px;border-bottom:1px solid var(--line-light);font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.panel-title .pt-actions{display:flex;align-items:center;gap:8px;}
.panel-title a{font-size:10.5px;font-weight:600;color:var(--accent-dark);text-decoration:none;cursor:pointer;white-space:nowrap;}
.panel-title select{font-size:11px;font-weight:600;border:1.5px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);color:var(--ink-secondary);cursor:pointer;}
.panel-body{padding:14px 16px;flex:1;min-height:0;}
.panel-foot{padding:10px 16px;border-top:1px solid var(--line-light);font-size:11.5px;color:var(--accent-dark);display:flex;align-items:center;justify-content:space-between;font-weight:600;}

.mini-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-light);font-size:12px;gap:10px;}
.mini-row:last-child{border-bottom:0;}
.mini-row .nm{font-weight:600;color:var(--ink);}
.mini-row .sub{font-size:10.5px;color:var(--muted);}
.mini-row .amt{font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap;}
.mini-row .amt.recv{color:var(--recv);}
.mini-row .amt.pay{color:var(--pay);}
.mini-row .lft{display:flex;align-items:center;gap:9px;min-width:0;}
.mini-row .mode-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent-tint2);color:var(--accent-dark);flex:none;}

.bar-chart{display:flex;flex-direction:column;gap:10px;}
.bar-item{display:flex;align-items:center;gap:10px;}
.bar-item .b-label{width:90px;font-size:10.5px;color:var(--muted);font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:14px;background:var(--line-light);border-radius:7px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),#5B8CFA);}
.bar-fill.recv{background:linear-gradient(90deg,var(--recv),#7FA8F5);}
.bar-fill.pay{background:linear-gradient(90deg,var(--pay),#F5B15E);}
.bar-item .b-val{width:88px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--ink);flex:none;}

/* Ageing buckets (Receivable/Payable Ageing Snapshot): the bucket range label
   ("0-30 Days" etc) must stay on ONE line in a small bold font, with the amount
   sitting BELOW it in a lighter grey — per the reference screenshot. There are
   always exactly 4 buckets from ageingBuckets() (0-30/31-60/61-90/90+), so the
   grid is 4 columns, not 5 — the old repeat(5,1fr) left a dead unused column of
   white space to the right of every row. */
.age-buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.age-bucket{background:var(--accent-tint2);border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;}
.age-bucket .ab-label{font-size:10px;font-weight:700;color:var(--ink-secondary);letter-spacing:.01em;white-space:nowrap;}
.age-bucket .ab-val{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px;white-space:nowrap;}
.age-bucket.danger{background:var(--danger-tint);}
.age-bucket.danger .ab-val{color:var(--danger);}

/* ---------- CHARTS ---------- */
.chart-wrap{position:relative;width:100%;height:220px;}
.chart-wrap.sm{height:160px;}
.chart-wrap.donut{height:150px;}
.donut-panel-body{display:flex;align-items:center;gap:12px;}
.donut-panel-body .chart-wrap{flex:none;width:128px;height:128px;}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:7px;}
.donut-legend .dl-row{display:flex;align-items:center;gap:8px;font-size:11.5px;}
.donut-legend .dl-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.donut-legend .dl-label{flex:1;color:var(--ink-secondary);font-weight:600;}
.donut-legend .dl-val{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);}
.donut-legend .dl-pct{color:var(--muted);font-size:10px;width:34px;text-align:right;}

/* Sales Topline follows the compact donut-and-legend layout from the dashboard
   reference: an obvious total in the donut, then one clean colour-coded row per
   category. The vertical layout keeps every value visible in its narrow column. */
.sales-topline-panel{min-width:0;}
.sales-topline-title{align-items:flex-start;line-height:1.45;}
.sales-topline-title>span:first-child{min-width:0;}
.sales-topline-period{flex:none;margin-top:-2px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:9px;line-height:1.1;font-weight:700;color:var(--muted);white-space:nowrap;}
.sales-topline-period::after{content:'⌄';margin-left:4px;color:var(--accent-dark);}
.sales-topline-body{padding:9px 16px 5px;display:flex;flex-direction:column;align-items:stretch;gap:5px;}
.sales-topline-chart{align-self:center;flex:none;width:88px;height:88px;}
.sales-topline-summary{display:flex;align-items:center;justify-content:center;gap:7px;padding:0 0 1px;text-transform:uppercase;letter-spacing:.04em;font-size:8.5px;font-weight:700;color:var(--muted);}
.sales-topline-summary strong{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0;color:var(--ink);white-space:nowrap;}
.sales-topline-legend{display:flex;flex-direction:column;gap:0;}
.sales-topline-row{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;column-gap:10px;padding:4px 0;border-bottom:1px solid var(--line-light);min-height:21px;font-size:10px;line-height:1.2;}
.sales-topline-row:last-child{border-bottom:0;}
.sales-topline-category{display:flex;align-items:center;gap:7px;min-width:0;color:var(--ink-secondary);font-weight:700;}
.sales-topline-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.sales-topline-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sales-topline-amount{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap;text-align:right;}
.sales-topline-foot{justify-content:center;padding:6px 16px!important;}
.sales-topline-foot a{color:var(--accent-dark);font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer;}
.sales-topline-foot a span{margin-left:4px;font-size:13px;line-height:0;vertical-align:-1px;}
.donut-center-total{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;}
.donut-center-total .dt-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink);}
.donut-center-total .dt-lbl{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}

.cashflow-list{display:flex;flex-direction:column;gap:11px;}
.cf-item{display:flex;align-items:center;gap:10px;}
.cf-item .cf-label{width:100px;font-size:11px;color:var(--ink-secondary);font-weight:600;flex:none;}
.cf-track{flex:1;height:16px;background:var(--line-light);border-radius:5px;overflow:hidden;}
.cf-fill{height:100%;border-radius:5px;}
.cf-fill.blue{background:var(--blue);}
.cf-fill.green{background:var(--green);}
.cf-fill.red{background:var(--red);}
.cf-item .cf-val{width:110px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;flex:none;}
.cf-item .cf-val.pos{color:var(--green);}
.cf-item .cf-val.neg{color:var(--red);}
.cf-net{margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;}
.cf-net .lbl{font-size:12px;font-weight:700;color:var(--ink);}
.cf-net .val{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--green);}

/* ---------- MINI DATA TABLES (dashboard panels) ---------- */
.mini-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.mini-table thead th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line-light);}
.mini-table thead th.num{text-align:right;}
.mini-table tbody td{padding:8px 10px;border-bottom:1px solid var(--line-light);color:var(--ink-secondary);}
.mini-table tbody td.num{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ink);}
.mini-table tbody td.nm{font-weight:700;color:var(--ink);}
.mini-table tbody tr:last-child td{border-bottom:0;}
.mini-table tbody tr:hover{background:var(--accent-tint2);}
.status-badge{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:12px;display:inline-block;white-space:nowrap;}
.status-badge.overdue{background:var(--danger-tint);color:var(--danger);}
.status-badge.due-soon{background:var(--orange-tint);color:var(--orange);}
.status-badge.current{background:var(--success-tint);color:var(--success);}
.status-badge.paid{background:var(--success-tint);color:var(--success);}
.mini-cat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-light);}
.mini-cat-row:last-child{border-bottom:0;}
.mini-cat-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.mini-cat-row .mc-label{flex:none;width:110px;font-size:11.5px;font-weight:600;color:var(--ink-secondary);}
.mini-cat-row .mc-track{flex:1;height:8px;background:var(--line-light);border-radius:4px;overflow:hidden;}
.mini-cat-row .mc-fill{height:100%;border-radius:4px;}
.mini-cat-row .mc-amt{width:78px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;flex:none;}
.mini-cat-row .mc-pct{width:40px;text-align:right;font-size:10px;color:var(--muted);flex:none;}
.mini-total-row{display:flex;justify-content:space-between;padding-top:10px;margin-top:2px;border-top:1.5px solid var(--line);font-weight:700;font-size:12px;color:var(--ink);}

/* ---------- QUICK ACTIONS ---------- */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all .12s;text-align:center;}
.qa-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px);}
.qa-btn .qa-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.qa-btn .qa-ic svg{width:16px;height:16px;}
.qa-btn span.qa-txt{font-size:10.5px;font-weight:700;color:var(--ink-secondary);}

/* ---------- DATA GRID (generic engine) ----------
   Toolbar (row-count + Refresh + Columns) and the pagination footer below the
   table were both carrying noticeably more top/bottom breathing room than the
   rest of the compact dashboard — per explicit user instruction ("228 of 228
   rows, refresh columns ke neeche bhi bahut space hai"), both are tightened here
   so every grid page reads denser/more professional and saves vertical space. */
.dt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex:none;flex-wrap:wrap;}
/* Every grid's toolbar (not just the report-switcher pages) no longer shows the
   "N of N rows" count, per explicit user instruction ("jitni bhi table hai isme
   39 of 39 rows remove kar do"). Refresh + Columns now sit together on the RIGHT
   side of the toolbar row via .report-switcher-right (reused here for consistency
   with the report-switcher toolbar layout), instead of Refresh sitting on the left
   next to a row count. def.toolbarExtra() content (e.g. Sales Report's own
   Sales/Duration toggle) stays on the left. */
.dt-toolbar-plain{justify-content:space-between;}
/* Report-switcher toolbar — used on Customer List/Receipt List/Follow Up
   List/Credit Notes (see GRID_DEFS[key].reportTabs in Grids.html) and Collection
   Analysis (rendered directly above its cards in Receivables.html). Per explicit
   user instruction: the "N of N rows" count is dropped, the tab buttons that jump
   to any of the 5 Receivables reports come first (left), and Refresh + Columns sit
   together in the right corner, after the tabs. */
.report-switcher-toolbar{justify-content:space-between;}
.report-switcher-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.report-switcher-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.report-switcher-tab{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-secondary);padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;}
.report-switcher-tab .rst-ic{width:14px;height:14px;display:inline-flex;flex:none;}
.report-switcher-tab .rst-ic svg{width:14px;height:14px;}
.report-switcher-tab:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.report-switcher-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.dt-toolbar .count{font-size:11.5px;color:var(--muted);font-weight:500;}
.dt-colmenu-wrap{position:relative;margin-left:auto;}
.dt-colmenu{position:absolute;right:0;top:38px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:12px;min-width:270px;max-height:420px;overflow:auto;z-index:20;}
.dt-colmenu .h{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:700;margin-bottom:8px;}
.dt-colmenu label{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 4px;cursor:pointer;border-radius:4px;}
.dt-colmenu label:hover{background:var(--accent-tint2);}
.dt-colmenu-row{display:flex;align-items:center;gap:8px;border-radius:5px;}.dt-colmenu-row>label{flex:1;min-width:0}.dt-colmenu-row>label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.col-shift{display:flex;gap:3px}.col-shift button{width:25px;height:25px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink-secondary);cursor:pointer}.col-shift button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.col-shift button:disabled{opacity:.25;cursor:default;}
.dt-table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.dt-table-wrap.compact{flex:none;height:390px;}
.dt-table-wrap.compact .dt-scroll{max-height:390px;}
/* Dashboard mini reports: dense screenshot-like tables, no S.No column, clipped
   names with native hover titles, and a permanent vertical scroll gutter. */
.dashboard-report-panel{min-width:0;}
/* Height tuned to show ~5 data rows before the scrollbar kicks in (31px header +
   5 * ~28px rows ≈ 174px); anything beyond row 5 is reachable via the scrollbar.
   Expense by Category rarely has more than 6 rows, so it gets a shorter box —
   Top Customers/Top Vendors get a taller one so they read as the primary tables. */
.dt-table-wrap.compact.dashboard-report{height:180px;border:0;border-radius:0;box-shadow:none;overflow:hidden;}
.dt-table-wrap.compact.dashboard-report .dt-scroll{max-height:180px;overflow-y:scroll;overflow-x:hidden;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-customers,.dt-table-wrap.compact.dashboard-report.dashboard-report-vendors{height:236px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-customers .dt-scroll,.dt-table-wrap.compact.dashboard-report.dashboard-report-vendors .dt-scroll{max-height:236px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-expenses{height:156px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-expenses .dt-scroll{max-height:156px;}
.dt-table-wrap.compact.dashboard-report table.dt{width:100%;table-layout:fixed;}
/* Same light-blue header theme for all three dashboard mini reports (Top Customers,
   Top Vendors, Expense by Category) — no dark navy background. Header text/sort icon
   are centered (both horizontally within the column and vertically within the cell)
   to match the reference screenshot instead of the generic grid's left-aligned label. */
.dt-table-wrap.compact.dashboard-report table.dt thead th{background:var(--accent-tint);border-right:1px solid var(--line);vertical-align:middle;}
/* Headers were getting visually clipped ("Outstanding (₹)"/"Overdue Days" cut off)
   because the label was forced to one line with ellipsis at a very tight width.
   Fix: let the label wrap onto two lines and grow the header row height to fit —
   nothing is ever hidden now, at the cost of a couple extra px of header height. */
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-inner{padding:6px 6px;min-height:34px;justify-content:center;align-items:center;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-row{gap:3px;justify-content:center;width:100%;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-label{font-size:8px;line-height:1.15;letter-spacing:.02em;white-space:normal;overflow:visible;text-overflow:unset;overflow-wrap:break-word;word-break:normal;color:var(--accent-dark);font-weight:700;text-align:center;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .sort-ic{font-size:7px;width:auto;color:var(--accent-dark);flex:none;}
.dt-table-wrap.compact.dashboard-report table.dt tbody td{padding:6px 7px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;border-right:0;}
.dt-table-wrap.compact.dashboard-report table.dt tbody tr:nth-child(even){background:#FAFBFD;}
.dt-table-wrap.compact.dashboard-report table.dt tbody tr:hover{background:var(--accent-tint2);}
.dreport-name{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%;overflow:hidden;color:var(--ink);font-weight:650;}
.dreport-ellipsis{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dreport-color-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dreport-money{font-family:'JetBrains Mono',monospace;font-weight:700;}
.dashboard-report-customers .dreport-money.recv{color:var(--recv);}.dashboard-report-vendors .dreport-money.pay{color:var(--pay);}.dashboard-report-expenses .dreport-money.expense{color:var(--purple);}
.dreport-overdue{font-family:'JetBrains Mono',monospace;font-weight:800;}.dreport-overdue.success{color:var(--success);}.dreport-overdue.warning{color:var(--orange);}.dreport-overdue.danger{color:var(--danger);}
.dashboard-report-panel .panel-foot{font-size:10.5px;padding:8px 12px;}
.dashboard-report-panel .panel-title{font-size:12px;padding:10px 12px;}
/* Receivables Dashboard's full invoice grid lives beneath the visual summary.
   It deliberately keeps its own vertical scroll area while retaining the shared
   flexible-grid controls: every header sorts/searches/filters, and Columns opens
   the persisted hide/show, reorder, and resize options. */
/* The receivablesDashboard table (embedded inside the Ageing Summary "All Data"
   tab) uses flex:1 so it fills available content height when there are enough rows,
   but does NOT force a fixed height that would leave visible blank space below
   short page counts, per explicit user instruction ("niche blank aise achha nahi
   lag rha hai"). max-height ensures a very long page doesn't push the table beyond
   one viewport. */
.recv-dashboard-table{min-height:0;display:flex;flex-direction:column;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.recv-dashboard-table .dt-toolbar{margin:0 0 6px;gap:8px;}
.recv-dashboard-table .dt-toolbar .count{font-size:11px;}
.recv-dashboard-table .dt-toolbar .btn{padding:6px 11px!important;font-size:11px;}
.recv-dashboard-table .dt-table-wrap{flex:1;min-height:0;}
.recv-dashboard-table .dt-scroll{overflow:auto;}
.recv-dashboard-table table.dt thead th .th-inner{padding:6px 10px;gap:3px;min-height:31px;}
.recv-dashboard-table table.dt thead th .th-label{font-size:9px;line-height:1.15;letter-spacing:.05em;}
.recv-dashboard-table table.dt thead th .sort-ic{font-size:8px;}
.recv-dashboard-table table.dt thead th .search-ic{font-size:10px;}
.recv-dashboard-table table.dt tbody td{padding:6px 10px;font-size:11.5px;line-height:1.25;}
.recv-dashboard-table .dt-pagination{padding:7px 10px;font-size:11px;}
.recv-dashboard-table .dt-pagination select,.recv-dashboard-table .dt-pagination .nav button{font-size:11px;padding:4px 8px;}
.dt-scroll{flex:1;overflow:auto;min-height:0;overscroll-behavior-x:none;}
table.dt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;}
table.dt thead th{position:sticky;top:0;background:#111729;color:#D7DCEA;z-index:4;padding:0;border-right:1px solid #232C42;overflow:hidden;}
table.dt thead th .th-inner{padding:9px 12px;display:flex;flex-direction:column;gap:5px;position:relative;min-height:36px;}
table.dt thead th .th-row{display:flex;align-items:center;gap:6px;}
table.dt thead th .th-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:normal;overflow-wrap:break-word;line-height:1.3;}
/* Small grey subtitle line under a header label — e.g. Sales Report's "Amount"
   header showing "With GST"/"W/o GST" beneath it instead of the old "Total Price
   (Incl. GST)"/"Amount (Excl. GST)" full-length labels, per explicit user
   instruction. The sub-grid variant below overrides this with an even smaller size. */
table.dt thead th .th-sub{display:block;margin-top:2px;color:#9BB1E5;font-size:8.5px;font-weight:600;line-height:1.1;letter-spacing:0;text-transform:none;}
table.dt thead th .th-total{display:block;margin-top:2px;color:#9BB1E5;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;line-height:1.1;letter-spacing:0;text-transform:none;}
table.dt thead th .sort-ic{font-size:9px;color:var(--accent);width:10px;flex:none;}
/* Sales Report deliberately exposes a sort arrow on every header, including
   unsorted columns, and the arrow is clickable just like the header label. */
table.dt thead th .sort-ic.sort-ready{cursor:pointer;color:#9BB1E5;opacity:.9;}
table.dt thead th .sort-ic.sort-ready:hover{color:#FFF;opacity:1;}
table.dt thead th .search-ic{margin-left:auto;cursor:pointer;color:#6B7280;flex:none;font-size:11px;transition:color .15s;}
table.dt thead th .search-ic:hover{color:var(--accent);}
table.dt thead th .th-filter input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3552;background:#0A0E1A;color:#E7EAF4;font-size:11.5px;}
table.dt thead th .th-filter select{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3552;background:#0A0E1A;color:#E7EAF4;font-size:11.5px;cursor:pointer;}
table.dt thead th .th-date-filter,table.dt thead th .th-num-filter{display:grid;grid-template-columns:1fr 22px 1fr 20px;align-items:center;gap:3px;min-width:245px;}
table.dt thead th .th-date-filter input[type="date"]{min-width:0;padding:4px 3px;color-scheme:dark;font-size:10px;}
table.dt thead th .th-num-filter input[type="number"]{min-width:0;padding:4px 6px;background:#0A0E1A;color:#E7EAF4;border:1px solid #2D3552;border-radius:5px;font-size:11px;}
table.dt thead th .th-date-filter .date-sep,table.dt thead th .th-num-filter .date-sep{text-align:center;font-size:9px;color:#8992AA;}
table.dt thead th .dr-clear{cursor:pointer;color:#F87171;text-align:center;font-size:11px;font-weight:700;}
table.dt thead th .th-filter input::placeholder{color:#5A6070;}
table.dt thead th .resize-handle{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;}
table.dt thead th .resize-handle:hover,table.dt thead th .resize-handle.active{background:rgba(46,107,242,.5);}
table.dt tbody td{padding:8px 12px;border-bottom:1px solid var(--line-light);border-right:1px solid #F2F0EA;font-size:12.5px;white-space:normal;word-break:break-word;vertical-align:middle;overflow-wrap:anywhere;}
/* Columns explicitly flagged nowrap:true (e.g. Sales Report's Invoice No) always
   stay on ONE line — clipped with an ellipsis rather than wrapping onto a second
   line, per explicit user instruction ("invoice number bhi ek he row me dikhe"). */
table.dt tbody td.nowrap{white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:ellipsis;}
table.dt tbody tr:nth-child(even){background:#FAFBFD;}
table.dt tbody tr:hover{background:var(--accent-tint2);}
table.dt tbody td.num{font-family:Tahoma,Geneva,sans-serif;text-align:right;letter-spacing:-0.5px;}
/* Heatmap cell (e.g. Sales Report's Amount column) — background/text color are set
   inline per-cell via heatmapCellStyle_() in Common.html (darker for high values,
   near-white for low values, per explicit user instruction "heat map...high on
   dark...then light light"). The <td>'s own inline background already paints over
   its parent <tr>'s even-row/hover background, so no extra override is needed here
   — this rule just adds a soft transition and a subtle border so adjacent heat
   cells stay visually separated even when they're a similar shade. */
table.dt tbody td.heatmap-cell{transition:background .15s;border-right:1px solid rgba(255,255,255,.4);}
/* Sales Report expandable master/detail rows. */
.exp-toggle-cell{text-align:center;padding:0!important;}
.exp-toggle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;background:var(--accent);font-size:13px;font-weight:700;line-height:1;cursor:pointer;user-select:none;box-shadow:0 1px 3px rgba(46,107,242,.35);transition:all .12s;}
.exp-toggle:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 3px 8px rgba(46,107,242,.4);}
.exp-toggle.open{background:var(--accent-dark);}
/* Inline expand toggle sits directly to the LEFT of a cell's own value, on the SAME
   line (Sales Report's Invoice No column), instead of stacked above it or taking a
   separate dedicated "+" column — per explicit user instruction ("i want it to be
   on left of invoice number, in small size"). The host <td> uses a simple inline-flex
   wrapper inside (not display:flex on the <td> itself, which would break the cell's
   vertical centering within tall multi-line rows), so the toggle chip and the value
   sit side-by-side while the <td> still vertically centers within the <tr>. */
td.exp-toggle-host{vertical-align:middle;}
td.exp-toggle-host .exp-toggle-host-inner{display:inline-flex;align-items:center;gap:5px;}
.exp-toggle-host-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.exp-toggle-inline{flex:none;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;color:#fff;background:var(--accent);font-size:10px;font-weight:700;line-height:1;cursor:pointer;user-select:none;box-shadow:0 1px 2px rgba(46,107,242,.35);transition:all .12s;}
.exp-toggle-inline:hover{background:var(--accent-dark);}
.exp-toggle-inline.open{background:var(--accent-dark);}
/* The master row that's currently expanded stays visually highlighted while its
   detail card is open, per explicit user instruction ("jo row expand ke hai vo
   highlighted dikhe"). */
table.dt tbody tr.exp-row-open{background:var(--accent-tint)!important;}
table.dt tbody tr.exp-row-open td{border-bottom-color:var(--accent-tint);}
html.dark table.dt tbody tr.exp-row-open{background:var(--accent-tint)!important;}
/* Generic row highlight — independent of the expand/collapse feature above. Used
   by Follow Up List: after saving the "Mark/Edit Follow Up" popup, every row for
   that same company stays highlighted, per explicit user instruction ("jab click
   karen to jo row click ke hai vo highlight ho jaye...teeno me ye update ho
   jaye"). A slightly warmer tint than .exp-row-open so the two don't read as the
   exact same state if a grid ever needed both. */
table.dt tbody tr.row-highlighted{background:var(--gold-tint)!important;}
table.dt tbody tr.row-highlighted td{border-bottom-color:var(--gold-tint);}
html.dark table.dt tbody tr.row-highlighted{background:var(--gold-tint)!important;}
/* The whole expanded strip gets soft padding + a subtle tinted backdrop behind the
   card so the card itself reads as "floating" above the row it belongs to — this is
   the "elegant box" look requested, as opposed to the plain nested table before. */
.exp-detail-row td{background:var(--bg);padding:8px 16px 12px!important;border-bottom:2px solid var(--line);}
.exp-detail-wrap{max-width:100%;}
/* The "Line items for Invoice X..." label row was removed (see
   renderSalesReportDetail_ in Grids.html) — the highlighted parent row above now
   conveys which invoice this card belongs to, so the card's own top padding is
   tightened since there's no label to give it breathing room from. Padding trimmed
   further (was 10px 12px 12px) — with the sub-grid's own toolbar row also gone now
   (see .dt-table-wrap.sub-grid above), this card should hug the line items tightly
   instead of leaving a visible gap above the table, per explicit user instruction. */
.sr-detail-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(20,30,60,.08);overflow:hidden;padding:4px 8px 8px;}
.muted-cell{color:var(--muted);font-style:italic;}
/* Sub-grid (the expanded detail table itself): light-blue header with dense,
   easy-to-scan line items. Amount GST context is intentionally demoted into a
   small light subtitle so it does not make the header row tall. */
/* Per explicit user instruction, the sub-grid no longer gets its OWN toolbar row at
   all (see toolbarHtml in renderGrid() — subGrid always skips it now) — that whole
   row was the main source of top white space above an already-compact card. The
   "Columns ▾" control instead floats as a small overlay pinned to the table box's
   own top-right corner (position:relative on .dt-table-wrap.sub-grid below), so it
   costs zero extra vertical space instead of a full row. */
.dt-table-wrap.sub-grid{position:relative;border-radius:9px;box-shadow:none;}
.dt-colmenu-wrap.sub-grid-overlay{position:absolute;top:5px;right:6px;z-index:6;}
.dt-colmenu-wrap.sub-grid-overlay .btn{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.dt-table-wrap.sub-grid table.dt thead th{background:var(--accent-tint);border-right:1px solid var(--line);}
/* Header row height + label size trimmed further (was min-height:30px, two lines of
   text/subtitle) so the header takes up as little vertical space as possible above
   the actual line items — per explicit user instruction ("sub table has lot of
   white space...on top due to column stuff...isko kam kar do"). The Amount
   With-GST/W-o-GST subtitle stays but tightened; the resize-handle/search-ic in the
   far-right-most header (where the floating Columns ▾ overlay sits) gets a little
   right padding so the overlay button doesn't visually collide with them. */
.dt-table-wrap.sub-grid table.dt thead th .th-inner{padding:3px 8px;gap:0;min-height:24px;}
.dt-table-wrap.sub-grid table.dt thead th .th-label{color:var(--accent-dark);font-size:9px;font-weight:700;line-height:1.1;letter-spacing:.03em;}
.dt-table-wrap.sub-grid table.dt thead th .th-sub{display:block;margin-top:0;color:#7894C8;font-size:7.5px;font-weight:700;line-height:1;letter-spacing:0;text-transform:none;}
.dt-table-wrap.sub-grid table.dt thead th .th-total{display:block;margin-top:0;color:#94A4C6;font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;line-height:1;letter-spacing:0;text-transform:none;}
.dt-table-wrap.sub-grid table.dt thead th:last-child .th-row{padding-right:26px;}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic{color:var(--accent-dark);}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic.sort-ready{color:#6E93E8;}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic.sort-ready:hover{color:var(--accent-dark);}
.dt-table-wrap.sub-grid table.dt thead th .search-ic{color:var(--accent-dark);opacity:.7;}
.dt-table-wrap.sub-grid table.dt thead th .search-ic:hover{opacity:1;}
.dt-table-wrap.sub-grid table.dt tbody td{font-size:12px;line-height:1.25;padding:6px 10px;}
.dt-table-wrap.sub-grid table.dt tbody td.nowrap{white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:ellipsis;}
.dt-table-wrap.sub-grid table.dt tbody tr:nth-child(even){background:var(--accent-tint2);}
.dt-pagination.sub-grid{padding:7px 10px;font-size:10.5px;}
.code-pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-dark);background:var(--accent-tint);border-radius:5px;padding:3px 8px;display:inline-block;}
.pill-danger{color:var(--danger);background:var(--danger-tint);}
.pill-success{color:var(--success);background:var(--success-tint);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);margin-bottom:6px;font-weight:600;}
.dt-pagination{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none;background:var(--surface);border-top:1px solid var(--line);padding:7px 14px;font-size:11.5px;color:var(--muted);font-weight:500;}
.dt-pagination .pp{display:flex;align-items:center;gap:8px;}
.dt-pagination select{padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;}
.dt-pagination .nav{display:flex;align-items:center;gap:4px;margin-left:auto;}
.dt-pagination .nav button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink-secondary);font-size:12px;transition:all .12s;}
.dt-pagination .nav button:disabled{opacity:.35;cursor:default;}
.dt-pagination .nav button:not(:disabled):hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dt-pagination .pageinfo{font-weight:600;color:var(--ink-secondary);white-space:nowrap;}

/* ---------- MOBILE CARD LIST (alt view of a grid on small screens) ---------- */
.mcard-list{display:none;flex-direction:column;gap:10px;}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.mcard-title{font-weight:700;font-size:13px;color:var(--ink);}
.mcard-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.mcard-amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;white-space:nowrap;}
.mcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px;}
.mcard-grid .k{color:var(--muted);}
.mcard-grid .v{color:var(--ink);font-weight:600;text-align:right;}

/* ---------- LEDGER ---------- */
.ledger-shell{display:flex;gap:14px;flex:1;min-height:0;}
.ledger-party-list{width:280px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
.ledger-search{padding:10px 12px;border-bottom:1px solid var(--line-light);flex:none;}
.ledger-search input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:12.5px;}
.party-scroll{flex:1;overflow-y:auto;}
.party-row{padding:10px 14px;border-bottom:1px solid var(--line-light);cursor:pointer;transition:background .12s;}
.party-row:hover{background:var(--accent-tint2);}
.party-row.active{background:var(--accent-tint);border-left:3px solid var(--accent);}
.party-row .pn{font-size:12.5px;font-weight:600;color:var(--ink);}
.party-row .pg{font-size:10px;color:var(--muted);margin-top:2px;}
/* Balance sits inline on the SAME line as Group/Phone (joined by a " · " dot
   separator) instead of its own third line, per explicit user instruction
   ("current asset ke saath balance aa jaye phone ke baad mein aa jaye ek single
   line mein"). */
.party-row .pb-inline{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;}
.ledger-detail{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
.ledger-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.ledger-toolbar{padding:10px 16px;border-bottom:1px solid var(--line-light);display:flex;align-items:flex-start;gap:10px;flex:none;}
.ledger-toolbar .spacer{flex:1;}
.ledger-toolbar-info{min-width:0;}
.ledger-toolbar-info .co-name{font-weight:700;font-size:13px;color:var(--ink);}
.ledger-toolbar-info .co-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.ledger-toolbar-info .co-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:10px;color:var(--ink-secondary);}
.ledger-toolbar-info .co-meta b{color:var(--muted);font-weight:700;}
.ledger-scroll{flex:1;overflow:auto;padding:0;position:relative;}
/* Sticky header + sticky footer (closing balance row) — the table header stays
   pinned at the top and the closing balance row stays pinned at the bottom while
   the data rows scroll between them, per explicit user instruction ("header scroll
   mein na gaye ho...closing wala bhi fix rahe...uske under data upar niche ho"). */
table.ledger-table{width:100%;border-collapse:separate;border-spacing:0;}
table.ledger-table thead th{position:sticky;top:0;z-index:2;background:#1E4FC4;color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.ledger-table thead th.num{text-align:right;}

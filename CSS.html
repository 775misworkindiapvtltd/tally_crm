/* ---------- REPORTS HUB ---------- */
/* Reports page groups every report tile under a section heading — "All Reports"
   (existing set, now also including Sales Report + Expense Report which moved in
   from the sidebar) and "More Reports" (new report ideas added per explicit user
   instruction "add all reports u suggested"). */
.reports-section{margin-bottom:22px;}
.reports-section:last-child{margin-bottom:0;}
.reports-section-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line-light);}

/* ---------- QUICK ACTIONS ---------- */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all .12s;text-align:center;}
.qa-btn:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px);}
.qa-btn .qa-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
.qa-btn .qa-ic svg{width:16px;height:16px;}
.qa-btn span.qa-txt{font-size:10.5px;font-weight:700;color:var(--ink-secondary);}

/* ---------- DATA GRID (generic engine) ----------
   Toolbar (row-count + Refresh + Columns) and the pagination footer below the
   table were both carrying noticeably more top/bottom breathing room than the
   rest of the compact dashboard — per explicit user instruction ("228 of 228
   rows, refresh columns ke neeche bhi bahut space hai"), both are tightened here
   so every grid page reads denser/more professional and saves vertical space. */
.dt-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex:none;flex-wrap:wrap;}
/* Every grid's toolbar (not just the report-switcher pages) no longer shows the
   "N of N rows" count, per explicit user instruction ("jitni bhi table hai isme
   39 of 39 rows remove kar do"). Refresh + Columns now sit together on the RIGHT
   side of the toolbar row via .report-switcher-right (reused here for consistency
   with the report-switcher toolbar layout), instead of Refresh sitting on the left
   next to a row count. def.toolbarExtra() content (e.g. Sales Report's own
   Sales/Duration toggle) stays on the left. */
.dt-toolbar-plain{justify-content:space-between;}
/* Report-switcher toolbar — used on Customer List/Receipt List/Follow Up
   List/Credit Notes (see GRID_DEFS[key].reportTabs in Grids.html) and Collection
   Analysis (rendered directly above its cards in Receivables.html). Per explicit
   user instruction: the "N of N rows" count is dropped, the tab buttons that jump
   to any of the 5 Receivables reports come first (left), and Refresh + Columns sit
   together in the right corner, after the tabs. */
.report-switcher-toolbar{justify-content:space-between;}
.report-switcher-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.report-switcher-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.report-switcher-tab{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-secondary);padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap;}
.report-switcher-tab .rst-ic{width:14px;height:14px;display:inline-flex;flex:none;}
.report-switcher-tab .rst-ic svg{width:14px;height:14px;}
.report-switcher-tab:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.report-switcher-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.dt-toolbar .count{font-size:11.5px;color:var(--muted);font-weight:500;}
.dt-colmenu-wrap{position:relative;margin-left:auto;}
.dt-colmenu{position:absolute;right:0;top:38px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:12px;min-width:270px;max-height:420px;overflow:auto;z-index:20;}
.dt-colmenu .h{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;font-weight:700;margin-bottom:8px;}
.dt-colmenu label{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 4px;cursor:pointer;border-radius:4px;}
.dt-colmenu label:hover{background:var(--accent-tint2);}
.dt-colmenu-row{display:flex;align-items:center;gap:8px;border-radius:5px;}.dt-colmenu-row>label{flex:1;min-width:0}.dt-colmenu-row>label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.col-shift{display:flex;gap:3px}.col-shift button{width:25px;height:25px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink-secondary);cursor:pointer}.col-shift button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.col-shift button:disabled{opacity:.25;cursor:default;}
.dt-table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.dt-table-wrap.compact{flex:none;height:390px;}
.dt-table-wrap.compact .dt-scroll{max-height:390px;}
/* Dashboard mini reports: dense screenshot-like tables, no S.No column, clipped
   names with native hover titles, and a permanent vertical scroll gutter. */
.dashboard-report-panel{min-width:0;}
/* Height tuned to show ~5 data rows before the scrollbar kicks in (31px header +
   5 * ~28px rows ≈ 174px); anything beyond row 5 is reachable via the scrollbar.
   Expense by Category rarely has more than 6 rows, so it gets a shorter box —
   Top Customers/Top Vendors get a taller one so they read as the primary tables. */
.dt-table-wrap.compact.dashboard-report{height:180px;border:0;border-radius:0;box-shadow:none;overflow:hidden;}
.dt-table-wrap.compact.dashboard-report .dt-scroll{max-height:180px;overflow-y:scroll;overflow-x:hidden;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-customers,.dt-table-wrap.compact.dashboard-report.dashboard-report-vendors{height:236px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-customers .dt-scroll,.dt-table-wrap.compact.dashboard-report.dashboard-report-vendors .dt-scroll{max-height:236px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-expenses{height:156px;}
.dt-table-wrap.compact.dashboard-report.dashboard-report-expenses .dt-scroll{max-height:156px;}
.dt-table-wrap.compact.dashboard-report table.dt{width:100%;table-layout:fixed;}
/* Same light-blue header theme for all three dashboard mini reports (Top Customers,
   Top Vendors, Expense by Category) — no dark navy background. Header text/sort icon
   are centered (both horizontally within the column and vertically within the cell)
   to match the reference screenshot instead of the generic grid's left-aligned label. */
.dt-table-wrap.compact.dashboard-report table.dt thead th{background:var(--accent-tint);border-right:1px solid var(--line);vertical-align:middle;}
/* Headers were getting visually clipped ("Outstanding (₹)"/"Overdue Days" cut off)
   because the label was forced to one line with ellipsis at a very tight width.
   Fix: let the label wrap onto two lines and grow the header row height to fit —
   nothing is ever hidden now, at the cost of a couple extra px of header height. */
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-inner{padding:6px 6px;min-height:34px;justify-content:center;align-items:center;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-row{gap:3px;justify-content:center;width:100%;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .th-label{font-size:8px;line-height:1.15;letter-spacing:.02em;white-space:normal;overflow:visible;text-overflow:unset;overflow-wrap:break-word;word-break:normal;color:var(--accent-dark);font-weight:700;text-align:center;}
.dt-table-wrap.compact.dashboard-report table.dt thead th .sort-ic{font-size:7px;width:auto;color:var(--accent-dark);flex:none;}
.dt-table-wrap.compact.dashboard-report table.dt tbody td{padding:6px 7px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;border-right:0;}
.dt-table-wrap.compact.dashboard-report table.dt tbody tr:nth-child(even){background:#FAFBFD;}
.dt-table-wrap.compact.dashboard-report table.dt tbody tr:hover{background:var(--accent-tint2);}
.dreport-name{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%;overflow:hidden;color:var(--ink);font-weight:650;}
.dreport-ellipsis{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dreport-color-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dreport-money{font-family:'JetBrains Mono',monospace;font-weight:700;}
.dashboard-report-customers .dreport-money.recv{color:var(--recv);}.dashboard-report-vendors .dreport-money.pay{color:var(--pay);}.dashboard-report-expenses .dreport-money.expense{color:var(--purple);}
.dreport-overdue{font-family:'JetBrains Mono',monospace;font-weight:800;}.dreport-overdue.success{color:var(--success);}.dreport-overdue.warning{color:var(--orange);}.dreport-overdue.danger{color:var(--danger);}
.dashboard-report-panel .panel-foot{font-size:10.5px;padding:8px 12px;}
.dashboard-report-panel .panel-title{font-size:12px;padding:10px 12px;}
/* Receivables Dashboard's full invoice grid lives beneath the visual summary.
   It deliberately keeps its own vertical scroll area while retaining the shared
   flexible-grid controls: every header sorts/searches/filters, and Columns opens
   the persisted hide/show, reorder, and resize options. */
/* The receivablesDashboard table (embedded inside the Ageing Summary "All Data"
   tab) uses flex:1 so it fills available content height when there are enough rows,
   but does NOT force a fixed height that would leave visible blank space below
   short page counts, per explicit user instruction ("niche blank aise achha nahi
   lag rha hai"). max-height ensures a very long page doesn't push the table beyond
   one viewport. */
.recv-dashboard-table{flex:1;min-height:0;display:flex;flex-direction:column;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.recv-dashboard-table .dt-toolbar{margin:0 0 6px;gap:8px;flex:none;}
.recv-dashboard-table .dt-toolbar .count{font-size:11px;}
.recv-dashboard-table .dt-toolbar .btn{padding:6px 11px!important;font-size:11px;}
.recv-dashboard-table .dt-table-wrap{flex:1;min-height:0;}
.recv-dashboard-table .dt-scroll{overflow:auto;max-height:none;}
.recv-dashboard-table .dt-pagination{flex:none;}
.recv-dashboard-table table.dt thead th .th-inner{padding:6px 10px;gap:3px;min-height:31px;}
.recv-dashboard-table table.dt thead th .th-label{font-size:9px;line-height:1.15;letter-spacing:.05em;}
.recv-dashboard-table table.dt thead th .sort-ic{font-size:8px;}
.recv-dashboard-table table.dt thead th .search-ic{font-size:10px;}
.recv-dashboard-table table.dt tbody td{padding:6px 10px;font-size:11.5px;line-height:1.25;}
.recv-dashboard-table .dt-pagination{padding:7px 10px;font-size:11px;}
.recv-dashboard-table .dt-pagination select,.recv-dashboard-table .dt-pagination .nav button{font-size:11px;padding:4px 8px;}
.dt-scroll{flex:1;overflow:auto;min-height:0;overscroll-behavior-x:none;}
/* ---------- RECEIPT LIST VIEWPORT-FIT PROTOTYPE ----------
   This shell is deliberately scoped to Receipt List only. It consumes the complete
   zoom-compensated content height, leaves the toolbar fixed, and allocates every
   remaining pixel to one bordered table panel. */
.receipt-grid-shell{display:flex;flex-direction:column;flex:1;height:100%;min-height:0;overflow:hidden;}
.receipt-grid-shell .dt-toolbar{flex:none;}
.receipt-grid-table-wrap{display:flex;flex-direction:column;flex:1;min-height:0;border-radius:10px 10px 0 0;overflow:hidden;}
.receipt-grid-table-wrap>.dt-scroll{flex:1;min-height:0;max-height:none;overflow:auto;background:var(--surface);}
.receipt-grid-table-wrap>.dt-pagination{flex:none;margin-top:0;}
.receipt-reset-filters{padding:5px 12px!important;font-size:11.5px!important;}
.receipt-reset-filters:disabled{opacity:.42;cursor:default;}
/* Applied filters must be obvious without reopening each header control. */
/* Filter-active state uses the darker --accent-dark tone (still the same color
   family as the resting --accent header, just visibly deeper) plus a translucent
   white underline instead of a fixed navy+cyan combo, so it reads correctly no
   matter which Appearance color scheme is active. */
table.dt thead th.filter-active{background:var(--accent-dark);box-shadow:inset 0 -3px rgba(255,255,255,.7);}
table.dt thead th.filter-active .search-ic{color:#FFFFFF;}
/* Date/Timestamp column's 📅 icon turns active-colored once a range is applied,
   same visual language as filter-active above, but scoped to just the icon since
   the date column no longer has its own inline th-filter row to also highlight. */
table.dt thead th .search-ic.date-filter-active{color:rgba(255,255,255,.9);}

/* ---------- CALENDAR DATE-RANGE POPUP (shared across every date/timestamp column) ----------
 * Appended directly to <body> as #drPopupRoot (see DateRange.html) — position:fixed
 * so .dt-scroll's overflow and the sticky <thead> can never clip it, and it always
 * renders above every other panel regardless of which grid/page it was opened from. */
#drPopupRoot{position:fixed;z-index:200;display:none;}
.dr-popup-inner{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px -10px rgba(15,23,42,.35);overflow:hidden;width:max-content;}
.dr-body{display:flex;}
.dr-presets{display:flex;flex-direction:column;min-width:150px;padding:10px 8px;border-right:1px solid var(--line-light);background:var(--bg);gap:2px;}
.dr-preset{text-align:left;border:none;background:transparent;padding:9px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-secondary);cursor:pointer;transition:all .12s;}
.dr-preset:hover{background:var(--accent-tint2);color:var(--accent-dark);}
.dr-preset.active{background:var(--accent);color:#fff;}
.dr-cals{display:flex;padding:14px 16px;gap:22px;}
.dr-cal{width:230px;}
.dr-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;}
.dr-cal-title{font-size:12.5px;font-weight:700;color:var(--ink);flex:1;text-align:center;}
.dr-nav{border:1px solid var(--line);background:var(--surface);color:var(--ink-secondary);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;}
.dr-nav:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dr-nav-spacer{width:24px;flex:none;display:inline-block;}
.dr-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.dr-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.dr-day{display:flex;align-items:center;justify-content:center;height:28px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ink-secondary);cursor:pointer;background:transparent;}
.dr-day:hover{background:var(--accent-tint2);}
.dr-day-outside{color:var(--muted);opacity:.45;}
.dr-day-today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.dr-day-inrange{background:var(--accent-tint);border-radius:0;color:var(--accent-dark);}
.dr-day-edge{background:var(--accent);color:#fff;font-weight:700;}
.dr-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-top:1px solid var(--line-light);background:var(--bg);}
.dr-range-text{font-size:11.5px;font-weight:700;color:var(--ink-secondary);white-space:nowrap;}
.dr-footer-actions{display:flex;gap:8px;flex:none;}
.dr-footer-actions .btn{padding:6px 14px;font-size:11.5px;}
html.dark .dr-popup-inner{background:var(--surface);border-color:var(--line);}
html.dark .dr-presets{background:#0B0F1A;border-color:var(--line);}
html.dark .dr-footer{background:#0B0F1A;}
html.dark .dr-nav{background:var(--surface);border-color:var(--line);color:var(--ink-secondary);}
@media (max-width:700px){
  .dr-body{flex-direction:column;}
  .dr-presets{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line-light);}
  .dr-cals{flex-direction:column;gap:14px;}
  .dr-cal{width:100%;}
}

/* .dt-scroll is THE scroll container that makes thead position:sticky work.
   It MUST have a bounded height (flex:1 inside a height-constrained flex parent,
   OR an explicit max-height) — without that, sticky has no scrolling ancestor to
   stick within and the header scrolls away with the content. */
.dt-scroll{flex:1;overflow:auto;min-height:0;max-height:calc(100vh - 160px);overscroll-behavior-x:none;}

table.dt{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;}
/* Every grid header on every page now uses --accent (the active Appearance color
   scheme) instead of a hardcoded dark navy — same color as the view-toggle/
   fbar-presets "active" buttons the user pointed at ("jaise appearance color ke
   hai isme jo buttons ke color hai waise hi"), per explicit user instruction ("jitne
   bhi tab hai sabke header same color ke kardo"). The border uses a translucent
   white overlay instead of a fixed hex so it stays legible against ANY accent
   color, not just the original blue. */
table.dt thead th{position:sticky;top:0;background:var(--accent);color:#fff;z-index:4;padding:0;border-right:1px solid rgba(255,255,255,.18);overflow:hidden;}
/* Header cell content is vertically centered top-to-bottom (not just left/right)
   across every grid on every page, per explicit user instruction ("header top n
   bottom se center allign karna hai - use for all pages"). justify-content acts on
   the column flex's main (vertical) axis here. */
table.dt thead th .th-inner{padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;position:relative;min-height:36px;}
table.dt thead th .th-row{display:flex;align-items:center;gap:6px;}
table.dt thead th .th-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none;white-space:normal;overflow-wrap:break-word;line-height:1.3;}
/* Small grey subtitle line under a header label — e.g. Sales Report's "Amount"
   header showing "With GST"/"W/o GST" beneath it instead of the old "Total Price
   (Incl. GST)"/"Amount (Excl. GST)" full-length labels, per explicit user
   instruction. The sub-grid variant below overrides this with an even smaller size. */
/* Subtitle/sort-arrow colors switched from a fixed light-blue hex to a translucent
   white overlay — a fixed light-blue read fine against the old navy header but
   would clash against warmer/lighter accent colors (orange, gold, pink, etc). */
table.dt thead th .th-sub{display:block;margin-top:2px;color:rgba(255,255,255,.78);font-size:8.5px;font-weight:600;line-height:1.1;letter-spacing:0;text-transform:none;}
table.dt thead th .th-total{display:block;margin-top:2px;color:rgba(255,255,255,.78);font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;line-height:1.1;letter-spacing:0;text-transform:none;}
table.dt thead th .sort-ic{font-size:9px;color:#fff;width:10px;flex:none;opacity:.85;}
/* Sales Report deliberately exposes a sort arrow on every header, including
   unsorted columns, and the arrow is clickable just like the header label. */
table.dt thead th .sort-ic.sort-ready{cursor:pointer;color:rgba(255,255,255,.78);opacity:.9;}
table.dt thead th .sort-ic.sort-ready:hover{color:#FFF;opacity:1;}
table.dt thead th .search-ic{margin-left:auto;cursor:pointer;color:#6B7280;flex:none;font-size:11px;transition:color .15s;}
table.dt thead th .search-ic:hover{color:var(--accent);}
table.dt thead th .th-filter input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3552;background:#0A0E1A;color:#E7EAF4;font-size:11.5px;}
table.dt thead th .th-filter select{width:100%;padding:5px 8px;border-radius:5px;border:1px solid #2D3552;background:#0A0E1A;color:#E7EAF4;font-size:11.5px;cursor:pointer;}
table.dt thead th .th-num-filter{display:grid;grid-template-columns:1fr 22px 1fr 20px;align-items:center;gap:3px;min-width:245px;}
table.dt thead th .th-num-filter input[type="number"]{min-width:0;padding:4px 6px;background:#0A0E1A;color:#E7EAF4;border:1px solid #2D3552;border-radius:5px;font-size:11px;}
table.dt thead th .th-num-filter .date-sep{text-align:center;font-size:9px;color:#8992AA;}
table.dt thead th .dr-clear{cursor:pointer;color:#F87171;text-align:center;font-size:11px;font-weight:700;}
table.dt thead th .th-filter input::placeholder{color:#5A6070;}
table.dt thead th .resize-handle{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;}
table.dt thead th .resize-handle:hover,table.dt thead th .resize-handle.active{background:rgba(255,255,255,.3);}
table.dt tbody td{padding:8px 12px;border-bottom:1px solid var(--line-light);border-right:1px solid #F2F0EA;font-size:calc(12.5px * var(--data-scale));white-space:normal;word-break:break-word;vertical-align:middle;overflow-wrap:anywhere;}
/* Columns explicitly flagged nowrap:true (e.g. Sales Report's Invoice No) always
   stay on ONE line — clipped with an ellipsis rather than wrapping onto a second
   line, per explicit user instruction ("invoice number bhi ek he row me dikhe"). */
table.dt tbody td.nowrap{white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:ellipsis;}
table.dt tbody tr:nth-child(even){background:#FAFBFD;}
table.dt tbody tr:hover{background:var(--accent-tint2);}
table.dt tbody td.num{font-family:Tahoma,Geneva,sans-serif;text-align:right;letter-spacing:-0.5px;}
/* Heatmap cell (e.g. Sales Report's Amount column) — background/text color are set
   inline per-cell via heatmapCellStyle_() in Common.html (darker for high values,
   near-white for low values, per explicit user instruction "heat map...high on
   dark...then light light"). The <td>'s own inline background already paints over
   its parent <tr>'s even-row/hover background, so no extra override is needed here
   — this rule just adds a soft transition and a subtle border so adjacent heat
   cells stay visually separated even when they're a similar shade. */
table.dt tbody td.heatmap-cell{transition:background .15s;border-right:1px solid rgba(255,255,255,.4);}
/* Sales Report expandable master/detail rows. */
.exp-toggle-cell{text-align:center;padding:0!important;}
.exp-toggle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#fff;background:var(--accent);font-size:13px;font-weight:700;line-height:1;cursor:pointer;user-select:none;box-shadow:0 1px 3px var(--color-primary-glow);transition:all .12s;}
.exp-toggle:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 3px 8px var(--color-primary-glow);}
.exp-toggle.open{background:var(--accent-dark);}
/* Inline expand toggle sits directly to the LEFT of a cell's own value, on the SAME
   line (Sales Report's Invoice No column), instead of stacked above it or taking a
   separate dedicated "+" column — per explicit user instruction ("i want it to be
   on left of invoice number, in small size"). The host <td> uses a simple inline-flex
   wrapper inside (not display:flex on the <td> itself, which would break the cell's
   vertical centering within tall multi-line rows), so the toggle chip and the value
   sit side-by-side while the <td> still vertically centers within the <tr>. */
td.exp-toggle-host{vertical-align:middle;}
td.exp-toggle-host .exp-toggle-host-inner{display:inline-flex;align-items:center;gap:5px;}
.exp-toggle-host-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.exp-toggle-inline{flex:none;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;color:#fff;background:var(--accent);font-size:10px;font-weight:700;line-height:1;cursor:pointer;user-select:none;box-shadow:0 1px 2px var(--color-primary-glow);transition:all .12s;}
.exp-toggle-inline:hover{background:var(--accent-dark);}
.exp-toggle-inline.open{background:var(--accent-dark);}
/* The master row that's currently expanded stays visually highlighted while its
   detail card is open, per explicit user instruction ("jo row expand ke hai vo
   highlighted dikhe"). */
table.dt tbody tr.exp-row-open{background:var(--accent-tint)!important;}
table.dt tbody tr.exp-row-open td{border-bottom-color:var(--accent-tint);}
html.dark table.dt tbody tr.exp-row-open{background:var(--accent-tint)!important;}
/* Generic row highlight — independent of the expand/collapse feature above. Used
   by Follow Up List: after saving the "Mark/Edit Follow Up" popup, every row for
   that same company stays highlighted, per explicit user instruction ("jab click
   karen to jo row click ke hai vo highlight ho jaye...teeno me ye update ho
   jaye"). A slightly warmer tint than .exp-row-open so the two don't read as the
   exact same state if a grid ever needed both. */
table.dt tbody tr.row-highlighted{background:var(--gold-tint)!important;}
table.dt tbody tr.row-highlighted td{border-bottom-color:var(--gold-tint);}
html.dark table.dt tbody tr.row-highlighted{background:var(--gold-tint)!important;}
/* The whole expanded strip gets soft padding + a subtle tinted backdrop behind the
   card so the card itself reads as "floating" above the row it belongs to — this is
   the "elegant box" look requested, as opposed to the plain nested table before. */
.exp-detail-row td{background:var(--bg);padding:8px 16px 12px!important;border-bottom:2px solid var(--line);}
.exp-detail-wrap{max-width:100%;}
/* The "Line items for Invoice X..." label row was removed (see
   renderSalesReportDetail_ in Grids.html) — the highlighted parent row above now
   conveys which invoice this card belongs to, so the card's own top padding is
   tightened since there's no label to give it breathing room from. Padding trimmed
   further (was 10px 12px 12px) — with the sub-grid's own toolbar row also gone now
   (see .dt-table-wrap.sub-grid above), this card should hug the line items tightly
   instead of leaving a visible gap above the table, per explicit user instruction. */
.sr-detail-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(20,30,60,.08);overflow:hidden;padding:4px 8px 8px;}
.muted-cell{color:var(--muted);font-style:italic;}
/* Sub-grid (the expanded detail table itself): light-blue header with dense,
   easy-to-scan line items. Amount GST context is intentionally demoted into a
   small light subtitle so it does not make the header row tall. */
/* Per explicit user instruction, the sub-grid no longer gets its OWN toolbar row at
   all (see toolbarHtml in renderGrid() — subGrid always skips it now) — that whole
   row was the main source of top white space above an already-compact card. The
   "Columns ▾" control instead floats as a small overlay pinned to the table box's
   own top-right corner (position:relative on .dt-table-wrap.sub-grid below), so it
   costs zero extra vertical space instead of a full row. */
.dt-table-wrap.sub-grid{position:relative;border-radius:9px;box-shadow:none;}
.dt-colmenu-wrap.sub-grid-overlay{position:absolute;top:5px;right:6px;z-index:6;}
.dt-colmenu-wrap.sub-grid-overlay .btn{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.dt-table-wrap.sub-grid table.dt thead th{background:var(--accent-tint);border-right:1px solid var(--line);}
/* Header row height + label size trimmed further (was min-height:30px, two lines of
   text/subtitle) so the header takes up as little vertical space as possible above
   the actual line items — per explicit user instruction ("sub table has lot of
   white space...on top due to column stuff...isko kam kar do"). The Amount
   With-GST/W-o-GST subtitle stays but tightened; the resize-handle/search-ic in the
   far-right-most header (where the floating Columns ▾ overlay sits) gets a little
   right padding so the overlay button doesn't visually collide with them. */
.dt-table-wrap.sub-grid table.dt thead th .th-inner{padding:3px 8px;gap:0;min-height:24px;justify-content:center;}
.dt-table-wrap.sub-grid table.dt thead th .th-label{color:var(--accent-dark);font-size:9px;font-weight:700;line-height:1.1;letter-spacing:.03em;}
.dt-table-wrap.sub-grid table.dt thead th .th-sub{display:block;margin-top:0;color:#7894C8;font-size:7.5px;font-weight:700;line-height:1;letter-spacing:0;text-transform:none;}
.dt-table-wrap.sub-grid table.dt thead th .th-total{display:block;margin-top:0;color:#94A4C6;font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;line-height:1;letter-spacing:0;text-transform:none;}
.dt-table-wrap.sub-grid table.dt thead th:last-child .th-row{padding-right:26px;}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic{color:var(--accent-dark);}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic.sort-ready{color:#6E93E8;}
.dt-table-wrap.sub-grid table.dt thead th .sort-ic.sort-ready:hover{color:var(--accent-dark);}
.dt-table-wrap.sub-grid table.dt thead th .search-ic{color:var(--accent-dark);opacity:.7;}
.dt-table-wrap.sub-grid table.dt thead th .search-ic:hover{opacity:1;}
.dt-table-wrap.sub-grid table.dt tbody td{font-size:calc(12px * var(--data-scale));line-height:1.25;padding:6px 10px;}
.dt-table-wrap.sub-grid table.dt tbody td.nowrap{white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:ellipsis;}
.dt-table-wrap.sub-grid table.dt tbody tr:nth-child(even){background:var(--accent-tint2);}
.dt-pagination.sub-grid{padding:7px 10px;font-size:10.5px;}
.code-pill{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:var(--accent-dark);background:var(--accent-tint);border-radius:5px;padding:3px 8px;display:inline-block;}
.pill-danger{color:var(--danger);background:var(--danger-tint);}
.pill-success{color:var(--success);background:var(--success-tint);}
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);}
.empty-state .big{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink-secondary);margin-bottom:6px;font-weight:600;}
/* margin-top:auto is the standard flexbox "sticky footer" trick: inside a flex
   COLUMN parent (.content-zoom, or a page-section like .recv-dashboard-table that
   is itself display:flex;flex-direction:column), this pushes the pagination bar
   — and only the pagination bar — down to consume every bit of extra vertical
   space above it, so it always sits flush against the bottom of the visible
   screen/section on ANY screen size (a 14" laptop or a 30" monitor), instead of
   floating right below a short table with a visible empty gap underneath it. If
   the page's content is tall enough to need scrolling, this has no visible effect
   (there's no extra space left to absorb) and the pagination simply appears right
   after the table as before. Per explicit user instruction ("pagenations always
   at the bottom no matter what the screen size is, screen karta hua nahi hona
   chahiye"). */
.dt-pagination{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none;margin-top:auto;background:var(--surface);border-top:1px solid var(--line);padding:7px 14px;font-size:11.5px;color:var(--muted);font-weight:500;}
.dt-pagination .pp{display:flex;align-items:center;gap:8px;}
.dt-pagination .pp label{white-space:nowrap;}
.dt-pagination select{padding:5px 10px;border:1.5px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:var(--ink);}
.dt-pagination .page-range{white-space:nowrap;}
.dt-pagination .nav{display:flex;flex:none;align-items:center;gap:4px;margin-left:auto;padding:0;overflow:visible;}
.dt-pagination .nav button{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink-secondary);font-size:12px;transition:all .12s;}
.dt-pagination .nav button:disabled{opacity:.35;cursor:default;}
.dt-pagination .nav button:not(:disabled):hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-tint2);}
.dt-pagination .pageinfo{font-weight:600;color:var(--ink-secondary);white-space:nowrap;}
/* Compact professional footer for Receipt List: page size and range stay left;
   navigation owns the far-right corner. Fixed control dimensions prevent the
   footer from wasting vertical space at any content zoom. */
.receipt-pagination{min-height:36px;padding:3px 10px;gap:14px;border-top:1px solid var(--line);}
.receipt-pagination select{height:28px;padding:2px 24px 2px 8px;font-size:11px;}
.receipt-pagination .nav{gap:3px;}
.receipt-pagination .nav button{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border-radius:6px;font-size:13px;line-height:1;}
.receipt-pagination .pageinfo{min-width:58px;text-align:center;font-size:11px;}

/* ---------- MOBILE CARD LIST (alt view of a grid on small screens) ---------- */
.mcard-list{display:none;flex-direction:column;gap:10px;}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.mcard-title{font-weight:700;font-size:13px;color:var(--ink);}
.mcard-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
.mcard-amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;white-space:nowrap;}
.mcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:11px;}
.mcard-grid .k{color:var(--muted);}
.mcard-grid .v{color:var(--ink);font-weight:600;text-align:right;}

/* ---------- LEDGER ---------- */
.ledger-shell{display:flex;gap:14px;flex:1;min-height:0;}
.ledger-party-list{width:280px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
.ledger-search{padding:10px 12px;border-bottom:1px solid var(--line-light);flex:none;}
.ledger-search input{width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-size:12.5px;}
.party-scroll{flex:1;overflow-y:auto;}
.party-row{padding:10px 14px;border-bottom:1px solid var(--line-light);cursor:pointer;transition:background .12s;}
.party-row:hover{background:var(--accent-tint2);}
.party-row.active{background:var(--accent-tint);border-left:3px solid var(--accent);}
.party-row .pn{font-size:12.5px;font-weight:600;color:var(--ink);}
.party-row .pg{font-size:10px;color:var(--muted);margin-top:2px;}
/* Balance sits inline on the SAME line as Group/Phone (joined by a " · " dot
   separator) instead of its own third line, per explicit user instruction
   ("current asset ke saath balance aa jaye phone ke baad mein aa jaye ek single
   line mein"). */
.party-row .pb-inline{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;}
.ledger-detail{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
.ledger-wrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.ledger-toolbar{padding:10px 16px;border-bottom:1px solid var(--line-light);display:flex;align-items:flex-start;gap:10px;flex:none;}
.ledger-toolbar .spacer{flex:1;}
.ledger-toolbar-info{min-width:0;}
.ledger-toolbar-info .co-name{font-weight:700;font-size:13px;color:var(--ink);}
.ledger-toolbar-info .co-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.ledger-toolbar-info .co-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:10px;color:var(--ink-secondary);}
.ledger-toolbar-info .co-meta b{color:var(--muted);font-weight:700;}
.ledger-scroll{flex:1;overflow:auto;padding:0;position:relative;}
/* Sticky header + sticky footer (closing balance row) — the table header stays
   pinned at the top and the closing balance row stays pinned at the bottom while
   the data rows scroll between them, per explicit user instruction ("header scroll
   mein na gaye ho...closing wala bhi fix rahe...uske under data upar niche ho"). */
table.ledger-table{width:100%;border-collapse:separate;border-spacing:0;}
/* Same Appearance-accent header color as every other grid — was a hardcoded blue,
   per explicit user instruction ("jitne bhi tab hai sabke header same color ke
   kardo"). */
table.ledger-table thead th{position:sticky;top:0;z-index:2;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.ledger-table thead th.num{text-align:right;}
table.ledger-table tfoot td{position:sticky;bottom:0;z-index:2;background:var(--accent-tint);font-weight:700;color:var(--ink);padding:8px 10px;border-top:2px solid var(--accent);font-size:11.5px;}
table.ledger-table tfoot td.num{text-align:right;font-family:'JetBrains Mono',monospace;}
table.ledger-table tbody td{padding:7px 10px;border-bottom:1px solid var(--line-light);font-size:calc(11.5px * var(--data-scale));}
table.ledger-table tbody td.num{text-align:right;font-family:'JetBrains Mono',monospace;}
table.ledger-table tbody tr.opening-row{background:var(--accent-tint2);font-weight:600;}
table.ledger-table tbody tr:nth-child(even){background:#FAFBFD;}
/* NOTE: this used to have a SECOND, duplicate `table.ledger-table{...}` rule block
   right here (with border-collapse:collapse, a plain non-sticky thead/tbody, and
   dead classes .ledger-co-head/.ledger-title-bar/.ledger-party-info that no longer
   exist anywhere in Ledger.html's markup). Being LATER in the file, that dead block
   was silently overriding the real, correct rules above it — border-collapse:
   collapse in particular breaks position:sticky on <thead>/<tfoot> entirely, which
   is exactly why the header/footer kept scrolling with the rows instead of staying
   frozen. Removed here, per explicit user instruction ("party ledger me pdf table
   me header and footer should freeze...currently when i am scrolling they are
   also gets scrolled. freeze it."). */
.ledger-empty{padding:70px 20px;text-align:center;color:var(--muted);}
/* Print-only company/party header row — sits inside <thead> (see Ledger.html) so it
   repeats on every printed page automatically; hidden entirely on screen since the
   on-screen .ledger-toolbar-info above already shows the same info there. */
.ledger-print-header-row{display:none;}
.ledger-print-header{padding:2px 0 10px;}
.ledger-print-co-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:800;color:var(--ink);}
.ledger-print-co-sub{font-size:11px;color:var(--ink-secondary);margin-top:2px;}
.ledger-print-co-meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:10.5px;color:var(--ink-secondary);}
.ledger-print-co-meta span b{font-weight:700;}

/* ---------- PLACEHOLDER / SIMPLE PAGES ---------- */
.simple-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;}
.kv-grid .kv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-light);font-size:12.5px;}
.kv-grid .kv-row .k{color:var(--muted);font-weight:600;}
.kv-grid .kv-row .v{font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace;}
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--surface);}
.alert-item .a-ic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;}
.alert-item .a-body{flex:1;}
.alert-item .a-title{font-weight:700;font-size:12.5px;color:var(--ink);}
.alert-item .a-desc{font-size:11.5px;color:var(--ink-secondary);margin-top:2px;}
.alert-item .a-time{font-size:10px;color:var(--muted);margin-top:4px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line-light);}
.settings-row:last-child{border-bottom:0;}
.settings-row .s-label{font-weight:600;font-size:12.5px;color:var(--ink);}
.settings-row .s-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;}
.toggle.on{background:var(--accent);}
.toggle .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .knob{left:18px;}

/* ---------- MODAL POPUP (Follow Up List's "Mark/Edit Follow Up" popup) ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-card{background:var(--surface);border-radius:12px;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);width:380px;max-width:100%;overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-light);}
.modal-head h3{font-size:13.5px;font-weight:700;color:var(--ink);}
.modal-x{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px;padding:2px 4px;}
.modal-x:hover{color:var(--ink);}
.modal-body{padding:16px 18px;}
.modal-body .field{margin-bottom:14px;}
.modal-body .field:last-child{margin-bottom:0;}
.modal-body textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#FAFBFD;color:var(--ink);font-family:inherit;font-size:12.5px;resize:vertical;}
.modal-body textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-tint);}
.modal-body input[type="date"]{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#FAFBFD;color:var(--ink);font-size:12.5px;}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-light);}
.modal-foot .btn{padding:8px 16px;font-size:12px;}
/* Follow-up Notes column cell (Date + Remarks stacked tight) — a normal column, so
   it's hideable via the existing Columns ▾ menu without any extra work, per
   explicit user instruction ("with option that i can hide it"). */
.followup-note-cell{display:flex;flex-direction:column;gap:1px;min-width:0;}
.followup-note-date{font-size:10px;font-weight:700;color:var(--accent-dark);font-family:'JetBrains Mono',monospace;}
.followup-note-remarks{font-size:11px;color:var(--ink-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.followup-note-ts{font-size:9px;color:var(--muted);font-style:italic;}
/* Previous follow-ups list shown INSIDE the Mark/Edit Follow Up popup — per
   explicit user instruction ("SAVE ALL PREVIOUS FOLLOW UP REMARKS ALSO AND CAN SEE
   ALSO WHILE FOLLOW UP"). Scrollable so a party with many past entries doesn't blow
   up the modal's height. */
.followup-history-section{margin-top:4px;}
.followup-history-section label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.followup-history-list{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;}
.followup-history-empty{font-size:11.5px;color:var(--muted);font-style:italic;padding:10px 0;}
.followup-history-item{background:var(--bg);border:1px solid var(--line-light);border-radius:8px;padding:8px 10px;}
.followup-history-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
.followup-history-date{font-size:11px;font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace;}
.followup-history-latest{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--accent-tint);color:var(--accent-dark);padding:2px 6px;border-radius:8px;}
.followup-history-ts{font-size:9.5px;color:var(--muted);margin-left:auto;}
.followup-history-remarks{font-size:11.5px;color:var(--ink-secondary);line-height:1.4;}
.followup-history-promised{font-size:10.5px;font-weight:700;color:var(--success);margin-top:3px;}

/* Print/PDF view — .ledger-print-area was a wrapper div that no longer exists in
   Ledger.html's current markup (the ledger detail's own header/company info now
   lives inline in .ledger-toolbar-info, and the table sits directly in
   .ledger-scroll) — updated to the CURRENT class names so "Print / Download PDF"
   actually shows the statement. `.shell` itself must stay display:block (it can't
   be display:none AND have a visibility:visible descendant show through — display:
   none removes an element and everything inside it from the render tree entirely,
   which is a separate, stronger hide than visibility) — only the sidebar/topbar/
   toolbar CONTROLS are display:none'd individually below. */
@media print{
  body *{visibility:hidden;}
  .ledger-scroll,.ledger-scroll *{visibility:visible;}
  .ledger-scroll{position:absolute;left:0;top:0;width:100%;padding:0;overflow:visible;max-height:none;}
  /* .ledger-toolbar-info (screen-only party name/company header) is now visibility:
     hidden along with the rest of the page chrome — it lived OUTSIDE .ledger-scroll,
     so it was never actually part of what got printed (this was the root cause of
     "PRINT MEIN PARTY NAME NAHI AA RHA HAI" — the toolbar it lived in sits above
     .ledger-scroll, which position:absolute here effectively covers/replaces).
     The .ledger-print-header-row inside <thead> below (see Ledger.html) is the
     replacement — company name + address + Group/Contact, positioned INSIDE the
     table's own <thead> instead, so it participates in print pagination directly. */
  table.ledger-table thead th,table.ledger-table tfoot td{position:static;}
  /* Standard CSS table print behavior: a <thead> repeats automatically at the top
     of every printed page a table spans — this is what carries the company/party
     name onto page 2, 3, etc, per explicit user instruction ("agle page pe jo data
     aaye usmein bhi top header and comp name likha aaye"). display:table-header-group
     makes that behavior explicit or Chrome can otherwise skip repeating it. */
  table.ledger-table thead{display:table-header-group;}
  .ledger-print-header-row{display:table-row;}
  .ledger-print-header-row td{border:none;padding:0 10px 12px;background:var(--surface);}
  .sidebar,.topbar,.dt-pagination,.ledger-party-list,.fbar,.bottom-nav,.ledger-toolbar,.ledger-toolbar *{display:none !important;}
}

/* =============================================================
   RESPONSIVE — MOBILE (<= 980px)
   ============================================================= */
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3);}

@media (min-width:981px){
  .bottom-nav{display:none !important;}
  /* Desktop-only hover-collapsible sidebar: rests as a narrow icon rail (each item
     shows its icon PLUS a small label underneath, stacked — per explicit user
     instruction "jub side bar chota hai to icon dikhe uske niche chote mein
     content"), and expands to full width the instant the cursor moves over it (no
     click needed) — collapsing back again the moment the cursor leaves — per
     explicit user instruction ("left bar sab chota ho to...jaise hi curson side bar
     pe jaye to expank ho jaye"). Pure CSS :hover — no JS state needed, so it can
     never get stuck in the wrong visual state. Scoped to desktop only so the
     existing mobile off-canvas open/close behavior (.sidebar.open / transform) is
     completely unaffected.
     BUG FIX: the label text used to be a bare text node directly inside .nav-item
     (never wrapped in its own <span>), so the old hide-on-collapse selector
     (`.nav-item span:not(.n-ic)`) could only ever match the OTHER spans
     (.nav-chevron/.nav-badge) — it never actually matched/hid the label itself. The
     full label text stayed visible and had to squeeze into the narrow 64px rail,
     wrapping/overlapping into the illegible mess seen in the reported screenshot.
     Fixed by wrapping the label in <span class="n-lbl"> (see renderShell() in
     Common.html) so it can be targeted precisely and reflowed into a small caption
     under the icon instead. */
  .sidebar{width:64px;}
  .sidebar:hover{width:236px;}
  .sidebar:not(:hover) .brand{padding:14px 4px;justify-content:center;}
  .sidebar:not(:hover) .brand-inner{gap:0;flex-direction:column;}

  .sidebar:not(:hover) .nav-item .nav-badge{position:absolute;top:2px;right:6px;margin-left:0;}
  .sidebar:not(:hover) .nav-item .nav-chevron{display:none;}
  .sidebar:not(:hover) .nav-item.active::before{display:none;} /* the left accent bar has no room on a centered icon rail */
  .sidebar:not(:hover) .nav-children{display:none;}
  .sidebar:not(:hover) .sidebar-foot{display:none;}

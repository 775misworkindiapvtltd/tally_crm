  {key:'partyGroup',label:'Party Group',width:130},{key:'subGroup',label:'Sub Group',width:150},{key:'mainGroup',label:'Main Group',width:150},
  {key:'salesPerson',label:'Sales Person',width:120},{key:'phoneNo',label:'Phone No',width:130},{key:'paymentTerms',label:'Payment Terms',width:130},
  {key:'pendingAmount',label:'Pending Amount',width:140,num:true},{key:'dueDate',label:'Due Date',width:110,date:true},{key:'overdueDays',label:'Overdue Days',width:110,num:true}

const RECEIPT_COLS=[
  {key:'timestamp',label:'Timestamp',width:150,date:true},{key:'voucherNumber',label:'Voucher No',width:110},{key:'date',label:'Date',width:100,date:true},
  {key:'group',label:'Group',width:120},{key:'subGroup',label:'Sub Group',width:130},{key:'creditLedgerName',label:'Ledger (Cr)',width:180},
  {key:'creditLedgerAmount',label:'Amount (Cr)',width:120,num:true},{key:'billType',label:'Bill Type',width:100},{key:'billName',label:'Bill Name',width:150},
  {key:'billAmount',label:'Bill Amount',width:120,num:true},{key:'debitLedgerName',label:'Ledger (Dr)',width:200},{key:'debitLedgerAmount',label:'Amount (Dr)',width:120,num:true},
  {key:'bankPartyName',label:'Bank/Party Name',width:180},{key:'transactionType',label:'Transaction Type',width:130},{key:'instNo',label:'Instrument No',width:120},
  {key:'instDate',label:'Instrument Date',width:130,date:true},{key:'bankName',label:'Bank Name',width:180}
];
const CUSTOMER_COLS=[
  {key:'invoiceTo',label:'Invoice To',width:220},{key:'address',label:'Address',width:260},{key:'state',label:'State',width:130},
  {key:'gstNo',label:'GST No.',width:150},{key:'contactPerson',label:'Contact Person Name',width:190},{key:'phone',label:'Phone',width:140},
  {key:'email',label:'Email',width:220},{key:'totalInvoices',label:'Total Invoice',width:120,num:true},{key:'totalAmount',label:'Total Amount',width:150,num:true}
];
const AGEING_COLS=[
  {key:'partyName',label:'Party Name',width:220},{key:'billRefNo',label:'Bill Ref No',width:150},{key:'billDate',label:'Bill Date',width:120,date:true},
  {key:'dueDate',label:'Due Date',width:120,date:true},{key:'overdueDays',label:'Overdue Days',width:120,num:true},{key:'amount',label:'Amount',width:150,num:true}
];
const VENDOR_COLS=[
  {key:'name',label:'Vendor Name',width:230},{key:'group',label:'Group',width:160},{key:'phone',label:'Phone',width:140},
  {key:'salesPerson',label:'Sales Person',width:150},{key:'bills',label:'Bills',width:90,num:true},{key:'maxOverdue',label:'Max Overdue Days',width:140,num:true},
  {key:'total',label:'Outstanding',width:150,num:true},{key:'status',label:'Status',width:110}
];
const FOLLOWUP_COLS=[
  {key:'partyName',label:'Customer',width:210},{key:'billRefNo',label:'Bill Ref',width:140},{key:'phoneNo',label:'Phone',width:130},
  {key:'salesPerson',label:'Sales Person',width:140},{key:'dueDate',label:'Due Date',width:120,date:true},{key:'overdueDays',label:'Overdue Days',width:120,num:true},
  {key:'pendingAmount',label:'Amount',width:150,num:true},{key:'action',label:'Follow Up',width:150,render:r=>{const key=r.partyName+'|'+r.billRefNo,done=!!S.followUpDone[key];return `<button class="btn btn-ghost" style="padding:4px 10px;font-size:10.5px;" data-action="followup-toggle" data-key="${esc(key)}">${done?'Undo':'Mark Followed Up'}</button>`;}}
];
const CREDIT_NOTE_COLS=[
  {key:'partyName',label:'Customer',width:220},{key:'date',label:'Date',width:120,date:true},{key:'voucherNo',label:'Voucher No',width:140},
  {key:'particular',label:'Particulars',width:280},{key:'amount',label:'Amount',width:150,num:true}
];
// Dashboard mini reports intentionally use only the requested business columns.
// `compactName` renders a one-line ellipsis with the full text available on hover.
const TOP_CUSTOMERS_COLS=[
  {key:'label',label:'Party Name',width:220,reportWidth:'46%',compactName:true},{key:'value',label:'Outstanding (₹)',width:110,reportWidth:'26%',num:true,currency:true,reportTone:'recv'},
  {key:'overdueDays',label:'Overdue Days',width:110,reportWidth:'28%',num:true,reportTone:'overdue'}
];
const TOP_VENDORS_COLS=[
  {key:'label',label:'Party Name',width:220,reportWidth:'46%',compactName:true},{key:'value',label:'Outstanding (₹)',width:110,reportWidth:'26%',num:true,currency:true,reportTone:'pay'},
  {key:'overdueDays',label:'Overdue Days',width:110,reportWidth:'28%',num:true,reportTone:'overdue'}
];
const EXPENSE_CATEGORY_DASH_COLS=[
  {key:'label',label:'Category',width:230,reportWidth:'58%',compactName:true,reportTone:'category'},
  {key:'value',label:'Amount (₹)',width:150,reportWidth:'42%',num:true,currency:true,reportTone:'expense'}
];
const SUBCATEGORY_COLS=[
  {key:'label',label:'Sub Category',width:220},{key:'value',label:'Amount',width:160,num:true},{key:'pct',label:'% of Total',width:130}
];
// Sales Report — one MASTER row per unique Invoice No, grouped from the SALES sheet
// (see buildSalesReport() below). Party/contact fields + Amount are shown on this
// master row; each raw SALES line (Date/Description/Category/Amount) that makes up
// the invoice is only shown when the row is expanded via the ▸/▾ toggle — see the
// `expandable`/`detailCols` handling in renderGrid() (Common.html). Both the master
// grid and every expanded sub-grid get the full generic engine (filter, sort,
// hide/unhide columns, resize) because each expanded invoice gets its OWN nested
// grid registered on the fly — see renderSalesReportDetail_() below.
//
// "—" (an em-dash, styled muted) is shown instead of a fabricated 0 whenever a value
// genuinely isn't known — Amount (Excl. GST) when the SALES sheet has no GST column,
// and the two Receivable columns when no RECEIVABLES row's Bill Ref No matches this
// Invoice No.
function muted_(html){return `<span class="muted-cell">${html}</span>`;}
function renderMoneyOrDash_(v){return v==null?muted_('—'):fmtNum(v);}
const SALES_REPORT_COLS=[
  {key:'invoiceNo',label:'Invoice No',width:140},{key:'invoiceTo',label:'Invoice To',width:200},
  {key:'address',label:'Address',width:240},{key:'state',label:'State',width:110},
  {key:'gstNo',label:'GST No.',width:150},{key:'contactPerson',label:'Contact Person Name',width:170},
  {key:'phone',label:'Phone',width:150},{key:'email',label:'Email',width:210},
  {key:'amount',label:'Total Price (Incl. GST)',width:160,num:true,filterType:'number-range'},
  {key:'amountExclGst',label:'Amount (Excl. GST)',width:150,num:true,render:(r)=>renderMoneyOrDash_(r.amountExclGst)},
  {key:'recvPendingAmount',label:'Pending (Receivable)',width:150,num:true,render:(r)=>renderMoneyOrDash_(r.recvPendingAmount)},
  {key:'recvOverdueDays',label:'Overdue Days',width:120,num:true,render:(r)=>{
    if(r.recvOverdueDays==null)return muted_('—');
    const d=Number(r.recvOverdueDays)||0,tone=d>60?'danger':d>20?'warning':'success';
    return `<span class="dreport-overdue ${tone}">${esc(fmtNum(d))}</span>`;
  }}
];
// Detail sub-table — every individual SALES line belonging to one invoice. Category
// here is the single raw value per line (never concatenated), so it keeps the plain
// text filter+sort every other column gets — no special select/token handling needed.
const SALES_REPORT_DETAIL_COLS=[
  {key:'date',label:'Date',width:120,date:true},
  {key:'description',label:'Description',width:260},
  {key:'category',label:'Category',width:200},
  {key:'amount',label:'Amount (Incl. GST)',width:150,num:true},
  {key:'amountExclGst',label:'Amount (Excl. GST)',width:150,num:true,render:(r)=>renderMoneyOrDash_(r.amountExclGst)}
];

function firstUseful(current,next){return current||next||'';}
function buildCustomerList(){
  const byCustomer={};
  dataForFY('sales').forEach(r=>{
    const name=String(r.invoiceTo||'').trim();if(!name)return;
    const key=name.toLowerCase().replace(/\s+/g,' ');
    if(!byCustomer[key])byCustomer[key]={invoiceTo:name,address:'',state:'',gstNo:'',contactPerson:'',phone:'',email:'',invoiceNos:new Set(),rowCount:0,totalAmount:0};
    const c=byCustomer[key];c.rowCount++;
    c.address=firstUseful(c.address,r.address);c.state=firstUseful(c.state,r.state);c.gstNo=firstUseful(c.gstNo,r.gstNo);
    c.contactPerson=firstUseful(c.contactPerson,r.contactPerson);c.phone=firstUseful(c.phone,r.phone);c.email=firstUseful(c.email,r.email);
    const invoice=String(r.invoiceNo||'').trim().toLowerCase();if(invoice)c.invoiceNos.add(invoice);
    c.totalAmount+=Number(r.amount)||0;
  });
  return Object.values(byCustomer).map(c=>({invoiceTo:c.invoiceTo,address:c.address,state:c.state,gstNo:c.gstNo,contactPerson:c.contactPerson,phone:c.phone,email:c.email,totalInvoices:c.invoiceNos.size||c.rowCount,totalAmount:c.totalAmount})).sort((a,b)=>a.invoiceTo.localeCompare(b.invoiceTo));
}
// Groups SALES rows by unique Invoice No + party fields (Invoice To, Address, State,
// GST No., Contact Person, Phone, Email) — per explicit user instruction, this is the
// dedup key rather than Invoice No alone, though in practice one Invoice No always
// belongs to one party. Party/contact fields are taken once per invoice via
// firstUseful() (first non-blank line wins). Every raw SALES line for the invoice is
// kept (not concatenated) in `lines`, for the expandable sub-table — each line carries
// its own Date/Description/Category/Amount/Amount-Excl-GST. Total Price (both
// incl./excl. GST) is the SUM of every line's amount for that invoice.
//
// Receivable linkage: the RECEIVABLES sheet's Bill Ref No is matched against this
// Invoice No (case-insensitive) so the master row can also show Pending Amount +
// Overdue Days for that invoice, without duplicating the receivable calculation logic
// used elsewhere (outstandingReceivable(), ageingBuckets(), etc). If no receivable row
// matches (already fully paid, or billed outside the RECEIVABLES sheet), both fields
// stay null and the grid shows "—" rather than a fabricated 0/blank.
function buildSalesReport(){
  const byInvoice={};
  const order=[];
  dataForFY('sales').forEach(r=>{
    const invoiceNo=String(r.invoiceNo||'').trim();if(!invoiceNo)return;
    const key=invoiceNo.toLowerCase()+'|'+String(r.invoiceTo||'').trim().toLowerCase();
    if(!byInvoice[key]){byInvoice[key]={invoiceNo,invoiceTo:'',address:'',state:'',gstNo:'',contactPerson:'',phone:'',email:'',lines:[],amount:0,amountExclGst:0,hasAnyExclGst:false};order.push(key);}
    const g=byInvoice[key];
    g.invoiceTo=firstUseful(g.invoiceTo,r.invoiceTo);g.address=firstUseful(g.address,r.address);g.state=firstUseful(g.state,r.state);
    g.gstNo=firstUseful(g.gstNo,r.gstNo);g.contactPerson=firstUseful(g.contactPerson,r.contactPerson);
    g.phone=firstUseful(g.phone,r.phone);g.email=firstUseful(g.email,r.email);
    const lineAmount=Number(r.amount)||0;
    const lineExclGst=(r.amountExclGst===null||r.amountExclGst===undefined)?null:Number(r.amountExclGst)||0;
    g.lines.push({date:r.date,description:r.description||'',category:r.category||'',amount:lineAmount,amountExclGst:lineExclGst});
    g.amount+=lineAmount;
    if(lineExclGst!==null){g.amountExclGst+=lineExclGst;g.hasAnyExclGst=true;}
  });
  const recvByInvoice={};
  dataForFY('receivables').forEach(r=>{
    const key=String(r.billRefNo||'').trim().toLowerCase();if(!key)return;
    if(!recvByInvoice[key])recvByInvoice[key]=r; // first match wins if duplicated
  });
  return order.map(key=>{
    const g=byInvoice[key];
    const recv=recvByInvoice[String(g.invoiceNo).trim().toLowerCase()];
    return {
      invoiceNo:g.invoiceNo,invoiceTo:g.invoiceTo,address:g.address,state:g.state,gstNo:g.gstNo,
      contactPerson:g.contactPerson,phone:g.phone,email:g.email,
      amount:g.amount,amountExclGst:g.hasAnyExclGst?Math.round(g.amountExclGst*100)/100:null,
      lines:g.lines.slice().sort((a,b)=>(parseDT(a.date)||0)-(parseDT(b.date)||0)),
      recvPendingAmount:recv?Number(recv.pendingAmount)||0:null,
      recvOverdueDays:recv?Number(recv.overdueDays)||0:null
    };
  }).sort((a,b)=>a.invoiceNo.localeCompare(b.invoiceNo));
}
// Renders the expandable sub-table for one Sales Report master row (its individual
// SALES lines: Date/Description/Category/Amount/Amount-Excl-GST). A separate
// GRID_DEF is registered on the fly, keyed by invoice+party so every expanded
// invoice keeps its OWN independent filter/sort/hidden-column state — reusing the
// exact same generic grid engine (renderGrid) as the master table and every other
// grid in the app, so filters, sorting, and column hide/unhide all work here too,
// per explicit user instruction ("All filters, hide unhide col otpion will be
// there n main and sub table").
function renderSalesReportDetail_(masterRow){
  const detailKey='salesReportDetail:'+String(masterRow.invoiceNo)+'|'+String(masterRow.invoiceTo);
  GRID_DEFS[detailKey]={cols:SALES_REPORT_DETAIL_COLS,data:()=>masterRow.lines||[],showSortArrows:true};
  return `<div class="sr-detail-label">Line items for Invoice <b>${esc(masterRow.invoiceNo)}</b> — ${masterRow.lines.length} row(s)</div>${renderGrid(detailKey)}`;
}
function buildVendorList(){
  const byParty={};
  dataForFY('payables').forEach(r=>{
    const key=r.partyName||'Unknown';if(!byParty[key])byParty[key]={name:key,group:r.partyGroup,phone:r.phoneNo,salesPerson:r.salesPerson,total:0,maxOverdue:0,bills:0};
    byParty[key].total+=Number(r.closingBalance)||0;byParty[key].maxOverdue=Math.max(byParty[key].maxOverdue,Number(r.overdueDays)||0);byParty[key].bills++;
  });
  return Object.values(byParty).map(p=>Object.assign(p,{status:p.maxOverdue>0?'Overdue':'Current'})).sort((a,b)=>b.total-a.total);
}
function ageingGridRows(kind){
  const amtKey=kind==='recv'?'pendingAmount':'closingBalance';
  return dataForFY(kind==='recv'?'receivables':'payables').filter(r=>(Number(r.overdueDays)||0)>0).map(r=>Object.assign({},r,{amount:Number(r[amtKey])||0}));
}
function creditNoteRows(){return dataForFY('balanceVouchers').filter(v=>/credit\s*note/i.test(v.voucherType||'')).map(v=>Object.assign({},v,{amount:Number(v.debit||v.credit)||0}));}

const GRID_DEFS={
  expense:{cols:EXPENSE_COLS,data:()=>dataForFY('expense')},payables:{cols:PAYABLES_COLS,data:()=>dataForFY('payables')},receivables:{cols:RECEIVABLES_COLS,data:()=>dataForFY('receivables')},
  receipt:{cols:RECEIPT_COLS,data:()=>dataForFY('receipt')},payment:{cols:RECEIPT_COLS,data:()=>dataForFY('payment')},
  customerList:{cols:CUSTOMER_COLS,data:buildCustomerList},vendorList:{cols:VENDOR_COLS,data:buildVendorList},
  salesReport:{cols:SALES_REPORT_COLS,data:buildSalesReport,showSortArrows:true,expandable:true,
    rowKey:r=>String(r.invoiceNo)+'|'+String(r.invoiceTo),
    renderDetail:r=>renderSalesReportDetail_(r)},
  ageingRecv:{cols:AGEING_COLS,data:()=>ageingGridRows('recv')},ageingPay:{cols:AGEING_COLS,data:()=>ageingGridRows('pay')},
  followUpList:{cols:FOLLOWUP_COLS,data:()=>dataForFY('receivables').filter(r=>(Number(r.overdueDays)||0)>0)},
  creditNotes:{cols:CREDIT_NOTE_COLS,data:creditNoteRows},
  topCustomersDash:{cols:TOP_CUSTOMERS_COLS,data:()=>S.dashTopCustomers||[],compact:true,dashboardReport:true,reportType:'customers'},
  topVendorsDash:{cols:TOP_VENDORS_COLS,data:()=>S.dashTopVendors||[],compact:true,dashboardReport:true,reportType:'vendors'},
  expenseCategoryDash:{cols:EXPENSE_CATEGORY_DASH_COLS,data:()=>S.dashExpenseCategories||[],compact:true,dashboardReport:true,reportType:'expenses'},
  expenseSubCategory:{cols:SUBCATEGORY_COLS,data:()=>S.expenseSubCategoryRows||[]}
};
</script>

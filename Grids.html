// Sales Report — one MASTER row per unique Invoice No, grouped from the SALES sheet
// (see buildSalesReport() below). Party/contact fields + Amount are shown on this
// master row; each raw SALES line (Date/Description/Category/Amount) that makes up

//
// "—" (an em-dash, styled muted) is shown instead of a fabricated 0 whenever a value
// genuinely isn't known — Amount (Excl. GST) when the SALES sheet has no GST column,

function muted_(html){return `<span class="muted-cell">${html}</span>`;}
function renderMoneyOrDash_(v){return v==null?muted_('—'):fmtNum(v);}

function firstUseful(current,next){return current||next||'';}
function buildCustomerList(){
  const byCustomer={};
  dataForFY('sales').forEach(r=>{
    const name=String(r.invoiceTo||'').trim();if(!name)return;
    const key=name.toLowerCase().replace(/\s+/g,' ');
    if(!byCustomer[key])byCustomer[key]={invoiceTo:name,address:'',state:'',gstNo:'',contactPerson:'',phone:'',email:'',invoiceNos:new Set(),rowCount:0,totalAmount:0};
    const c=byCustomer[key];c.rowCount++;
    c.address=firstUseful(c.address,r.address);c.state=firstUseful(c.state,r.state);c.gstNo=firstUseful(c.gstNo,r.gstNo);
    c.contactPerson=firstUseful(c.contactPerson,r.contactPerson);c.phone=firstUseful(c.phone,r.phone);c.email=firstUseful(c.email,r.email);
    const invoice=String(r.invoiceNo||'').trim().toLowerCase();if(invoice)c.invoiceNos.add(invoice);
    c.totalAmount+=Number(r.amount)||0;
  });
  return Object.values(byCustomer).map(c=>({invoiceTo:c.invoiceTo,address:c.address,state:c.state,gstNo:c.gstNo,contactPerson:c.contactPerson,phone:c.phone,email:c.email,totalInvoices:c.invoiceNos.size||c.rowCount,totalAmount:c.totalAmount})).sort((a,b)=>a.invoiceTo.localeCompare(b.invoiceTo));
}
// Groups SALES rows by unique Invoice No + party fields (Invoice To, Address, State,
// GST No., Contact Person, Phone, Email) — per explicit user instruction, this is the
// dedup key rather than Invoice No alone, though in practice one Invoice No always
// belongs to one party. Party/contact fields are taken once per invoice via
// firstUseful() (first non-blank line wins). Every raw SALES line for the invoice is
// kept (not concatenated) in `lines`, for the expandable sub-table — each line carries
// its own Date/Description/Category/Amount/Amount-Excl-GST. Total Price (both
// incl./excl. GST) is the SUM of every line's amount for that invoice.
//
// Receivable linkage: the RECEIVABLES sheet's Bill Ref No is matched against this
// Invoice No (case-insensitive) so the master row can also show Pending Amount +
// Overdue Days for that invoice, without duplicating the receivable calculation logic
// used elsewhere (outstandingReceivable(), ageingBuckets(), etc). If no receivable row
// matches (already fully paid, or billed outside the RECEIVABLES sheet), both fields
// stay null and the grid shows "—" rather than a fabricated 0/blank.
function buildSalesReport(){
  const byInvoice={};
  const order=[];
  dataForFY('sales').forEach(r=>{
    const invoiceNo=String(r.invoiceNo||'').trim();if(!invoiceNo)return;
    const key=invoiceNo.toLowerCase()+'|'+String(r.invoiceTo||'').trim().toLowerCase();
    if(!byInvoice[key]){byInvoice[key]={invoiceNo,invoiceTo:'',address:'',state:'',gstNo:'',contactPerson:'',phone:'',email:'',lines:[],amount:0,amountExclGst:0,hasAnyExclGst:false,invoiceDate:null};order.push(key);}
    const g=byInvoice[key];
    g.invoiceTo=firstUseful(g.invoiceTo,r.invoiceTo);g.address=firstUseful(g.address,r.address);g.state=firstUseful(g.state,r.state);
    g.gstNo=firstUseful(g.gstNo,r.gstNo);g.contactPerson=firstUseful(g.contactPerson,r.contactPerson);
    g.phone=firstUseful(g.phone,r.phone);g.email=firstUseful(g.email,r.email);
    // Invoice Date: take the FIRST (earliest) date from the SALES lines belonging to
    // this invoice — this is the invoice's own date. Per explicit user instruction
    // ("ismein invoice date nahi aa rahi hai ye col add karo").
    if(!g.invoiceDate&&r.date)g.invoiceDate=r.date;
    const lineAmount=Number(r.amount)||0;
    const lineExclGst=(r.amountExclGst===null||r.amountExclGst===undefined)?null:Number(r.amountExclGst)||0;
    g.lines.push({invoiceNo:g.invoiceNo,date:r.date,description:r.description||'',category:r.category||'',amount:lineAmount,amountExclGst:lineExclGst});
    g.amount+=lineAmount;
    if(lineExclGst!==null){g.amountExclGst+=lineExclGst;g.hasAnyExclGst=true;}
  });
  const recvByInvoice={};
  dataForFY('receivables').forEach(r=>{
    const key=String(r.billRefNo||'').trim().toLowerCase();if(!key)return;
    if(!recvByInvoice[key])recvByInvoice[key]=r; // first match wins if duplicated
  });
  // Cumulative Amount per customer (Invoice To) — sum of every invoice's Amount
  // (With GST) for that same customer, across the whole currently-selected
  // financial-year data. Computed once here so every master row belonging to that
  // customer shows the identical total, per explicit user instruction ("if client
  // is pansari, to table me jitni baar bhi pansari hai sabka sum bhi dikhe").
  const cumulativeByCustomer={};
  order.forEach(key=>{
    const g=byInvoice[key];
    const custKey=String(g.invoiceTo||'').trim().toLowerCase();
    cumulativeByCustomer[custKey]=(cumulativeByCustomer[custKey]||0)+g.amount;
  });
  return order.map(key=>{
    const g=byInvoice[key];
    const recv=recvByInvoice[String(g.invoiceNo).trim().toLowerCase()];
    const custKey=String(g.invoiceTo||'').trim().toLowerCase();
    return {
      invoiceNo:g.invoiceNo,invoiceDate:g.invoiceDate||'',invoiceTo:g.invoiceTo,address:g.address,state:g.state,gstNo:g.gstNo,
      contactPerson:g.contactPerson,phone:g.phone,email:g.email,
      amount:g.amount,amountExclGst:g.hasAnyExclGst?Math.round(g.amountExclGst*100)/100:null,
      cumulativeAmount:Math.round((cumulativeByCustomer[custKey]||0)*100)/100,
      lines:g.lines.slice().sort((a,b)=>(parseDT(a.date)||0)-(parseDT(b.date)||0)),
      recvPendingAmount:recv?Number(recv.pendingAmount)||0:null,
      recvOverdueDays:recv?Number(recv.overdueDays)||0:null
    };
  }).sort((a,b)=>a.invoiceNo.localeCompare(b.invoiceNo));
}
// Renders the expandable sub-table for one Sales Report master row (its individual
// SALES lines: Invoice No/Date/Description/Category/Amount/Amount-Excl-GST). A
// separate GRID_DEF is registered on the fly, keyed by invoice+party so every
// expanded invoice keeps its OWN independent filter/sort/hidden-column state —
// reusing the exact same generic grid engine (renderGrid) as the master table and
// every other grid in the app, so filters, sorting, and column hide/unhide all work
// here too, per explicit user instruction ("All filters, hide unhide col otpion
// will be there n main and sub table"). Wrapped in `.sr-detail-card` for the
// elegant boxed look requested ("sub table acchese elegatnt box me open hone").
function renderSalesReportDetail_(masterRow){
  const detailKey='salesReportDetail:'+String(masterRow.invoiceNo)+'|'+String(masterRow.invoiceTo);
  GRID_DEFS[detailKey]={cols:SALES_REPORT_DETAIL_COLS,data:()=>masterRow.lines||[],showSortArrows:true,subGrid:true,noPagination:true};
  // The "Line items for Invoice X — Party · N row(s)" label was removed per explicit
  // user instruction — the parent row it belongs to is now highlighted instead (see
  // .exp-row-open in CSS.html), which already makes clear which invoice/party this
  // expanded card belongs to without repeating it in its own text line.
  return `<div class="sr-detail-card">${renderGrid(detailKey)}</div>`;
}
// ============================= SALES REPORT — CATEGORY-WISE PIVOT =============================
// Built per user's reference screenshot (their internal MIS sheet): rows = distinct
// Category values found on raw SALES lines, columns = either months of the selected
// financial year(s), each selected financial year itself, or one Custom Range — plus
// a Total column (placed LEFT of Category, per explicit user instruction "AND LEFT
// MEIN AA JAYE CATEGORY SE PEHLE") and a Total row pinned to the top of the header
// (per "TOTAL SADKE UPAR AA JAYE"). Unlike buildSalesReport() (which groups by unique
// Invoice No for the master/detail table), this pivot works on every RAW SALES line —
// one invoice can carry several categories across its lines, and each line's amount
// belongs to whichever category is on that specific line.
function salesCategoryPeriods_(mode){
  // All modes respect S.salesCategoryCustomFYs when set — this is the Duration
  // pivot's OWN FY picker (shown above the table in every mode), independent of
  // the main dashboard's FY filter, per explicit user instruction ("custom range
  // not working with monthly pls see vo dono ke liye same hai").
  const customFYs=S.salesCategoryCustomFYs||[];
  const useCustom=customFYs.length>0;

  if(mode==='year'||mode==='custom'){
    let years=useCustom?customFYs:selectedFinancialYears();
    if(!years.length)years=availableFinancialYears().map(f=>f.key);
    return years.slice().sort().map(key=>{
      const fy=financialYearFromKey(key);
      const startYear=fy.start.getFullYear(),endYear=fy.end.getFullYear();
      return {key,label:`(Apr ${startYear} – Mar ${endYear})`,test:r=>financialYearKey(r.date)===key};
    });
  }
  // month (default) — when customFYs is set, generate months only for those FYs;
  // otherwise fall back to the main dashboard's selectedFYMonths().
  if(useCustom){
    const months=[];
    customFYs.slice().sort().forEach(key=>{
      const fy=financialYearFromKey(key);if(!fy)return;
      for(let d=new Date(fy.start);d<=fy.end;d.setMonth(d.getMonth()+1)){
        const y=d.getFullYear(),m=d.getMonth();
        const label=(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m])+' '+String(y).slice(-2);
        months.push({key:y+'-'+m,label,y,m});
      }
    });
    return months.map(m=>({key:m.key,label:m.label,test:r=>{
      const t=parseDT(r.date);if(t===null)return false;
      const d=new Date(t);return d.getFullYear()===m.y&&d.getMonth()===m.m;
    }}));
  }
  // Fallback: use the shared selectedFYMonths() from the main dashboard's FY filter.
  return selectedFYMonths().map(m=>({key:m.y+'-'+m.m,label:m.label.replace(/\d{4}/,y=>y.slice(-2)),test:r=>{
    const t=parseDT(r.date);if(t===null)return false;
    const d=new Date(t);return d.getFullYear()===m.y&&d.getMonth()===m.m;
  }}));
}
// Reads whichever SALES field the currently selected dimension groups by — Category
// (raw SALES "CATEGORY" column, existing default), Party Name (Invoice To — the
// customer on that SALES line), or State (raw SALES "STATE" column). Per explicit
// user request ("CATEGORY MEIN DROPDOWN AAYE CATEGORY/PARTY NAME/STATE AND AMT USKE
// ACCORDING CHANGE HO") the pivot rows/amounts must recompute against whichever of
// these three the dropdown currently has selected — this is the single place that
// mapping lives, so buildSalesDimensionPivot_ below stays dimension-agnostic.
function salesDimensionRawValue_(row,dimension){
  if(dimension==='partyName')return row.invoiceTo;
  if(dimension==='state')return row.state;
  return row.category;
}
function buildSalesDimensionPivot_(mode,dimension,crossFilterDim,crossFilterValues){
  const periods=salesCategoryPeriods_(mode);
  const hasCross=crossFilterDim&&crossFilterValues&&crossFilterValues.length>0;
  const crossSet=hasCross?new Set(crossFilterValues.map(v=>v.toLowerCase())):null;
  const byDim={};
  dataForFY('sales').forEach(r=>{
    // Cross-filter: if active, skip rows that don't match the cross-filter values
    if(hasCross){
      const crossVal=String(salesDimensionRawValue_(r,crossFilterDim)||'').trim().toLowerCase();
      if(!crossSet.has(crossVal))return;
    }
    const dimVal=String(salesDimensionRawValue_(r,dimension)||'').trim()||'Uncategorized';
    if(!byDim[dimVal])byDim[dimVal]={dimVal,total:0,periods:{}};
    const amt=Number(r.amount)||0;
    for(let i=0;i<periods.length;i++){
      if(periods[i].test(r)){ byDim[dimVal].periods[periods[i].key]=(byDim[dimVal].periods[periods[i].key]||0)+amt; break; }
    }
  });
  const rows=Object.values(byDim).map(c=>{
    periods.forEach(p=>{ if(!(p.key in c.periods)) c.periods[p.key]=0; });
    c.total=periods.reduce((s,p)=>s+(c.periods[p.key]||0),0);
    return c;
  });
  return {periods,rows};
}
// Helper: get all unique values for a dimension (for the cross-filter dropdown options)
function salesDimensionValues_(dimension){
  const vals=new Set();
  dataForFY('sales').forEach(r=>{
    const v=String(salesDimensionRawValue_(r,dimension)||'').trim();
    if(v)vals.add(v);
  });
  return Array.from(vals).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
}
// Which SALES field the Duration pivot currently groups by — driven by the header
// dropdown (see renderSalesCategoryPivot() in Finance.html). Label = shown in the
// dropdown option and the toolbar row count; plural = the row-count text next to
// the inline Refresh button ("15 Categories" / "15 Party Names" / "15 States").
const SALES_DIMENSION_META={
  category:{label:'Category',plural:'Categories'},
  partyName:{label:'Party Name',plural:'Party Names'},
  state:{label:'State',plural:'States'}
};
// ============================= EXPENSE REPORT — GROUP/SUBGROUP PIVOT =============================
const EXPENSE_DIMENSION_META={
  group:{label:'Group',plural:'Groups'},
  subGroup:{label:'Sub Group',plural:'Sub Groups'}
};
function expenseDimensionRawValue_(row,dimension){
  if(dimension==='subGroup')return row.subGroup;
  return row.group;
}
function expenseDimensionValues_(dimension){
  const vals=new Set();
  dataForFY('expense').forEach(r=>{
    const v=String(expenseDimensionRawValue_(r,dimension)||'').trim();
    if(v)vals.add(v);
  });
  return Array.from(vals).sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
}
function expenseCategoryPeriods_(mode){
  const customFYs=S.expenseCategoryCustomFYs||[];
  const useCustom=customFYs.length>0;
  if(mode==='year'||mode==='custom'){
    let years=useCustom?customFYs:selectedFinancialYears();
    if(!years.length)years=availableFinancialYears().map(f=>f.key);
    return years.slice().sort().map(key=>{
      const fy=financialYearFromKey(key);
      const startYear=fy.start.getFullYear(),endYear=fy.end.getFullYear();
      return {key,label:`(Apr ${startYear} – Mar ${endYear})`,test:r=>financialYearKey(r.date)===key};
    });
  }
  if(useCustom){
    const months=[];
    customFYs.slice().sort().forEach(key=>{
      const fy=financialYearFromKey(key);if(!fy)return;
      for(let d=new Date(fy.start);d<=fy.end;d.setMonth(d.getMonth()+1)){
        const y=d.getFullYear(),m=d.getMonth();
        const label=(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m])+' '+String(y).slice(-2);
        months.push({key:y+'-'+m,label,y,m});
      }
    });
    return months.map(m=>({key:m.key,label:m.label,test:r=>{
      const t=parseDT(r.date);if(t===null)return false;
      const d=new Date(t);return d.getFullYear()===m.y&&d.getMonth()===m.m;
    }}));
  }
  return selectedFYMonths().map(m=>({key:m.y+'-'+m.m,label:m.label.replace(/\d{4}/,y=>y.slice(-2)),test:r=>{
    const t=parseDT(r.date);if(t===null)return false;
    const d=new Date(t);return d.getFullYear()===m.y&&d.getMonth()===m.m;
  }}));
}
function buildExpenseDimensionPivot_(mode,dimension,crossFilterDim,crossFilterValues){
  const periods=expenseCategoryPeriods_(mode);
  const hasCross=crossFilterDim&&crossFilterValues&&crossFilterValues.length>0;
  const crossSet=hasCross?new Set(crossFilterValues.map(v=>v.toLowerCase())):null;
  const byDim={};
  dataForFY('expense').forEach(r=>{
    if(hasCross){
      const crossVal=String(expenseDimensionRawValue_(r,crossFilterDim)||'').trim().toLowerCase();
      if(!crossSet.has(crossVal))return;
    }
    const dimVal=String(expenseDimensionRawValue_(r,dimension)||'').trim()||'Uncategorized';
    if(!byDim[dimVal])byDim[dimVal]={dimVal,total:0,periods:{}};
    const amt=Number(r.amount)||0;
    for(let i=0;i<periods.length;i++){
      if(periods[i].test(r)){ byDim[dimVal].periods[periods[i].key]=(byDim[dimVal].periods[periods[i].key]||0)+amt; break; }
    }
  });
  const rows=Object.values(byDim).map(c=>{
    periods.forEach(p=>{ if(!(p.key in c.periods)) c.periods[p.key]=0; });
    c.total=periods.reduce((s,p)=>s+(c.periods[p.key]||0),0);
    return c;
  });
  return {periods,rows};
}
function buildVendorList(){
  const byParty={};
  dataForFY('payables').forEach(r=>{
    const key=r.partyName||'Unknown';if(!byParty[key])byParty[key]={name:key,group:r.partyGroup,phone:r.phoneNo,salesPerson:r.salesPerson,total:0,maxOverdue:0,bills:0};
    byParty[key].total+=Number(r.closingBalance)||0;byParty[key].maxOverdue=Math.max(byParty[key].maxOverdue,Number(r.overdueDays)||0);byParty[key].bills++;
  });
  return Object.values(byParty).map(p=>Object.assign(p,{status:p.maxOverdue>0?'Overdue':'Current'})).sort((a,b)=>b.total-a.total);
}
function ageingGridRows(kind){
  const amtKey=kind==='recv'?'pendingAmount':'closingBalance';
  return dataForFY(kind==='recv'?'receivables':'payables').filter(r=>(Number(r.overdueDays)||0)>0).map(r=>Object.assign({},r,{amount:Number(r[amtKey])||0}));
}
function creditNoteRows(){return dataForFY('balanceVouchers').filter(v=>/credit\s*note/i.test(v.voucherType||'')).map(v=>Object.assign({},v,{amount:Number(v.debit||v.credit)||0}));}

const GRID_DEFS={
  expense:{cols:EXPENSE_COLS,data:()=>dataForFY('expense'),reportTabs:()=>(typeof renderExpenseReportViewToggle_==='function'?renderExpenseReportViewToggle_():'')},payables:{cols:PAYABLES_COLS,data:()=>dataForFY('payables')},receivables:{cols:RECEIVABLES_COLS,data:()=>dataForFY('receivables')},
  // noToolbar: this grid is only ever embedded inside the Receivables Ageing
  // Summary "All Data" tab (see renderAgeing() in Receivables.html), which already
  // folds its own Refresh + Columns controls into the kind/mode-tabs row directly
  // above the KPI cards — per explicit user instruction ("refresh and column bhi
  // ismi me right me adjust ho jaaye...ye ek line ka screen bacha lega"). Skipping
  // this grid's own toolbar row entirely avoids rendering Refresh/Columns twice.
  receivablesDashboard:{cols:RECEIVABLES_COLS,data:()=>dataForFY('receivables'),showSortArrows:true,noToolbar:true},
  payablesDashboard:{cols:PAYABLES_COLS,data:()=>dataForFY('payables'),showSortArrows:true,noToolbar:true},
  receipt:{cols:RECEIPT_COLS,data:()=>dataForFY('receipt'),reportTabs:()=>(typeof renderReceivablesReportTabs_==='function'?renderReceivablesReportTabs_():'')},
  payment:{cols:RECEIPT_COLS,data:()=>dataForFY('payment')},
  // reportTabs: lazily looked up the same way salesReport's toolbarExtra is (defined
  // in Receivables.html, which loads AFTER Grids.html) — by the time renderGrid()
  // actually calls it, every script has run. Adds the Customer List/Receipt
  // List/Collection Analysis/Follow Up List/Credit Notes tab row to this grid's own
  // toolbar so you can jump straight to any of the other 4 reports, per explicit
  // user instruction. vendorList (Payables side) intentionally does NOT get this —
  // only the 5 Receivables reports were asked for.
  customerList:{cols:CUSTOMER_COLS,data:buildCustomerList,reportTabs:()=>(typeof renderReceivablesReportTabs_==='function'?renderReceivablesReportTabs_():'')},
  vendorList:{cols:VENDOR_COLS,data:buildVendorList},
  salesReport:{cols:SALES_REPORT_COLS,data:buildSalesReport,showSortArrows:true,expandable:true,
    rowKey:r=>String(r.invoiceNo)+'|'+String(r.invoiceTo),
    renderDetail:r=>renderSalesReportDetail_(r),
    // Lazily looked up (defined in Finance.html, which loads AFTER Grids.html) only
    // when actually invoked during render — by then every script has run, so the
    // reference always resolves. Wired as `reportTabs` (not `toolbarExtra`) so this
    // grid gets the same toolbar layout as the Receivables report-switcher pages —
    // per explicit user instruction: the Sales/Duration toggle now sits on the LEFT,
    // the "N of N rows" count is dropped entirely, and Refresh + Columns move
    // together into the right corner.
    reportTabs:()=>(typeof renderSalesReportViewToggle_==='function'?renderSalesReportViewToggle_():'')},
  ageingRecv:{cols:AGEING_COLS,data:()=>ageingGridRows('recv')},ageingPay:{cols:AGEING_COLS,data:()=>ageingGridRows('pay')},
  // highlightKey: every row sharing the same customer name stays highlighted
  // together after the Mark/Edit Follow Up popup is used on any one of them, per
  // explicit user instruction ("agar company name 3 baar hai is table me teeno me
  // ye update ho jaye...jo row click ke hai vo highlight ho jaye").
  followUpList:{cols:FOLLOWUP_COLS,data:()=>dataForFY('receivables').filter(r=>(Number(r.overdueDays)||0)>0),highlightKey:r=>followUpDataKey_(r.partyName),reportTabs:()=>(typeof renderReceivablesReportTabs_==='function'?renderReceivablesReportTabs_():'')},
  creditNotes:{cols:CREDIT_NOTE_COLS,data:creditNoteRows,reportTabs:()=>(typeof renderReceivablesReportTabs_==='function'?renderReceivablesReportTabs_():'')},
  topCustomersDash:{cols:TOP_CUSTOMERS_COLS,data:()=>S.dashTopCustomers||[],compact:true,dashboardReport:true,reportType:'customers'},
  topVendorsDash:{cols:TOP_VENDORS_COLS,data:()=>S.dashTopVendors||[],compact:true,dashboardReport:true,reportType:'vendors'},
  expenseCategoryDash:{cols:EXPENSE_CATEGORY_DASH_COLS,data:()=>S.dashExpenseCategories||[],compact:true,dashboardReport:true,reportType:'expenses'},
  expenseSubCategory:{cols:SUBCATEGORY_COLS,data:()=>S.expenseSubCategoryRows||[]}
};
</script>
